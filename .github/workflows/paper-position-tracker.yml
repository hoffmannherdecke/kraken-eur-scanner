name: Paper position tracker diagnostic

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Diagnostic lifecycle compile check
        run: |
          set -euo pipefail
          python -m py_compile paper_position_tracker.py
          echo "Standalone position tracker is diagnostic-only. Productive lifecycle tracking runs inside paper-evaluator.yml."
