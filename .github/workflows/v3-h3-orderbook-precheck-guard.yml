name: V3 H3 orderbook depth precheck guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h3-orderbook-depth-precheck-v1.json'
      - 'research/v3/h3-orderbook-state-contract-v1.json'
      - 'tools/v3-h3-orderbook-state-capture.py'
      - 'research/v3/h3-ws-book-reconciliation-evidence-20261001T193640Z.json'
      - 'tools/run-minipc-v3-h3-ws-book-smoke.ps1'
      - 'tools/v3-h3-kraken-depth-precheck.py'
      - 'tools/v3-h3-kraken-ws-book-reconciliation-smoke.py'
      - '.github/workflows/v3-h3-orderbook-precheck-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile H3 depth precheck
        run: python -m py_compile tools/v3-h3-kraken-depth-precheck.py
      - name: Validate H3 preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/v3/h3-orderbook-depth-precheck-v1.json').read_text('utf-8'))
          assert j['kind']=='V3_H3_ORDERBOOK_DEPTH_PRECHECK_V1'
          assert j['status'] in {'PRECHECK_L2_SNAPSHOT_ONLY_WEBSOCKET_PENDING','PRECHECK_L2_SNAPSHOT_GREEN_WEBSOCKET_PENDING','PRECHECK_WS_PROTOCOL_SMOKE_PREPARED_CLOUD_PENDING','PRECHECK_WS_PROTOCOL_GREEN_MINIPC_PENDING','PRECHECK_WS_PROTOCOL_AND_MINIPC_GREEN_ORDERFLOW_RESEARCH_PREREG_PENDING','ORDERBOOK_STATE_CONTRACT_FROZEN_CAPTURE_SMOKE_PENDING','ORDERBOOK_STATE_CAPTURE_GREEN_ASSOCIATION_PREREG_PENDING'}
          assert 'queue_position' in j['not_proven_by_snapshot']
          assert 'maker_fill_probability' in j['not_proven_by_snapshot']
          assert j['future_ws_gate']['required'] is True
          assert j['future_ws_gate']['bounded_pairs_first'] is True
          assert j['future_ws_gate']['no_endless_raw_archive'] is True
          assert j['research_guardrails']['performance_trial_started'] is False
          assert j['research_guardrails']['threshold_selection_allowed'] is False
          assert j['runtime_guardrails']['active_v2r3_change_allowed'] is False
          assert j['runtime_guardrails']['orders_allowed'] is False
          assert j['runtime_guardrails']['real_money_actions_allowed'] is False
          if j['status'] in {'PRECHECK_L2_SNAPSHOT_GREEN_WEBSOCKET_PENDING','PRECHECK_WS_PROTOCOL_SMOKE_PREPARED_CLOUD_PENDING','PRECHECK_WS_PROTOCOL_GREEN_MINIPC_PENDING','PRECHECK_WS_PROTOCOL_AND_MINIPC_GREEN_ORDERFLOW_RESEARCH_PREREG_PENDING','ORDERBOOK_STATE_CONTRACT_FROZEN_CAPTURE_SMOKE_PENDING','ORDERBOOK_STATE_CAPTURE_GREEN_ASSOCIATION_PREREG_PENDING'}:
              rd=j['snapshot_readiness']
              assert rd['audit']=='CI_GREEN_RUN_1'
              assert rd['representative_pairs_ok']==3
              assert rd['queue_position_proven'] is False
              assert rd['maker_fill_probability_proven'] is False
              if j['status']=='PRECHECK_L2_SNAPSHOT_GREEN_WEBSOCKET_PENDING':
                  assert j['next_gate']=='BOUNDED_MINIPC_PUBLIC_WS_BOOK_CAPTURE_SMOKE_BEFORE_H3_OR_H9_RESEARCH'
              else:
                  assert j['ws_protocol_contract']['synchronization_guard']=='CRC32_TOP10_EVERY_PROCESSED_BOOK_MESSAGE'
                  assert j['ws_protocol_contract']['bounded_reconnect_cycles']==2
                  assert j['ws_protocol_contract']['raw_archive'] is False
          print('V3_H3_PREREG PASS snapshot-only/ws-pending/no-fill-claim')
          PY
      - name: Real public Kraken depth snapshot smoke
        run: |
          python tools/v3-h3-kraken-depth-precheck.py \
            --pairs XBTEUR,ETHEUR,SOLEUR \
            --count 10 \
            --output /tmp/h3-depth.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/h3-depth.json').read_text())
          assert j['status']=='PASS'
          assert len(j['pairs'])==3
          for row in j['pairs']:
              assert row['best_ask'] > row['best_bid'] > 0
              assert row['spread_bps'] > 0
              assert row['bid_levels'] > 0 and row['ask_levels'] > 0
              assert row['bid_depth_quote_top_n'] > 0 and row['ask_depth_quote_top_n'] > 0
          assert j['interpretation']['snapshot_semantics_only'] is True
          assert j['interpretation']['websocket_delta_sequence_proven'] is False
          assert j['interpretation']['queue_position_proven'] is False
          assert j['interpretation']['maker_fill_probability_proven'] is False
          assert j['guardrails']['performance_trial_started'] is False
          assert j['guardrails']['orders'] is False
          print('V3_H3_DEPTH PASS public-L2-snapshot/no-queue-no-fill')
          print(json.dumps({'pairs':[{'pair':x['requested_pair'],'spread_bps':round(x['spread_bps'],3),'bid_depth':round(x['bid_depth_quote_top_n'],2),'ask_depth':round(x['ask_depth_quote_top_n'],2)} for x in j['pairs']]},sort_keys=True))
          PY


      - name: Install pinned websocket client for bounded H3 smoke
        run: python -m pip install --disable-pip-version-check --no-input "websockets==15.0.1"

      - name: Cloud Kraken Spot WS-v2 book reconciliation smoke
        run: |
          python -m py_compile tools/v3-h3-kraken-ws-book-reconciliation-smoke.py
          python tools/v3-h3-kraken-ws-book-reconciliation-smoke.py \
            --symbols BTC/EUR,ETH/EUR,SOL/EUR \
            --depth 10 \
            --cycles 2 \
            --seconds-per-cycle 12 \
            --output /tmp/h3-ws.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h3-ws.json").read_text())
          assert j["status"]=="PASS"
          assert j["depth"]==10
          assert j["symbols"]==["BTC/EUR","ETH/EUR","SOL/EUR"]
          assert j["cycles_requested"]==2
          assert j["cycles_completed"]==2
          assert all(c["complete"] for c in j["cycles"])
          assert j["totals"]["updates"]>0
          assert j["totals"]["checksum_pass"]>0
          assert j["totals"]["checksum_fail"]==0
          i=j["interpretation"]
          assert i["l2_snapshot_and_delta_reconciliation_proven"] is True
          assert i["crc32_top10_validation_used"] is True
          assert i["bounded_reconnect_resubscribe_proven"] is True
          assert i["explicit_sequence_number_observed"] is False
          assert i["checksum_used_as_synchronization_guard"] is True
          assert i["queue_position_proven"] is False
          assert i["maker_fill_probability_proven"] is False
          g=j["guardrails"]
          assert g["active_v2r3_changed"] is False
          assert g["v2r4_changed"] is False
          assert g["orders"] is False
          assert g["real_money_actions"] is False
          print("V3_H3_WS_PROTOCOL PASS checksum/reconnect/public/no-fill-claim")
          print("H3_WS_COMPACT "+json.dumps({
            "checked_at_utc":j["checked_at_utc"],
            "totals":j["totals"],
            "cycles":[{
              "cycle":c["cycle"],
              "elapsed_seconds":c["elapsed_seconds"],
              "book_messages":c["book_messages"],
              "errors":c["errors"],
              "symbols":c["symbols"]
            } for c in j["cycles"]]
          },sort_keys=True))
          PY


      - name: Validate persisted H3 cloud WS evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h3-ws-book-reconciliation-evidence-20261001T193640Z.json").read_text())
          assert j["status"]=="PASS"
          assert j["totals"]["updates"]==1611
          assert j["totals"]["checksum_pass"]==1617
          assert j["totals"]["checksum_fail"]==0
          assert len(j["cycles"])==2
          assert all(not c["errors"] for c in j["cycles"])
          assert j["interpretation"]["l2_snapshot_and_delta_reconciliation_proven"] is True
          assert j["interpretation"]["bounded_reconnect_resubscribe_proven"] is True
          assert j["interpretation"]["queue_position_proven"] is False
          assert j["interpretation"]["maker_fill_probability_proven"] is False
          print("V3_H3_PERSISTED_EVIDENCE PASS cloud-ws/checksum/reconnect/no-fill-claim")
          PY


      - name: Validate H3 orderbook state contract
        run: |
          python -m py_compile tools/v3-h3-orderbook-state-capture.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/v3/h3-orderbook-state-contract-v1.json").read_text())
          assert c["status"]=="FROZEN_PREREGISTERED_BOUNDED_CAPTURE_ONLY"
          assert c["source"]["symbols"]==["BTC/EUR","ETH/EUR","SOL/EUR"]
          assert c["source"]["depth"]==10
          assert "future outcome join" in c["prohibited"]
          assert "threshold selection" in c["prohibited"]
          assert "queue position inference" in c["prohibited"]
          assert c["aggregation"]["raw_book_archive"] is False
          assert c["runtime_guardrails"]["orders_allowed"] is False
          print("V3_H3_STATE_CONTRACT PASS fixed/bounded/no-outcomes/no-fill-claim")
          PY

      - name: Bounded H3 orderbook state capture smoke
        run: |
          python tools/v3-h3-orderbook-state-capture.py --seconds 12 --output /tmp/h3-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h3-state.json").read_text())
          assert j["status"]=="PASS" and not j["errors"]
          for r in j["per_symbol"].values():
              assert r["snapshots"]>=1 and r["checksum_pass"]>=1 and r["checksum_fail"]==0
              for f in ["spread_bps","bid_depth_quote_top10","ask_depth_quote_top10","depth_imbalance_top10"]:
                  assert r["features"][f]["n"]>=1
          assert j["interpretation"]["future_outcomes_joined"] is False
          assert j["interpretation"]["thresholds_selected"] is False
          assert j["interpretation"]["queue_position_proven"] is False
          assert j["guardrails"]["raw_book_archive"] is False
          assert j["guardrails"]["orders"] is False
          print("V3_H3_STATE_CAPTURE PASS checksum-valid/descriptive/no-outcomes")
          print("H3_STATE_COMPACT "+json.dumps({
            "symbols":j["symbols"],
            "per_symbol":j["per_symbol"],
            "wire_messages":j["wire_messages"],
            "subscription_acks":j["subscription_acks"]
          },sort_keys=True))
          PY
