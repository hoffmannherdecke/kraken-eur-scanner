name: Kraken EUR early sensor

'on':
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kraken-eur-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Rebuild and verify scanner package
        run: |
          set -euo pipefail
          cat .payload/part*.b64 | base64 -d > /tmp/kraken_eur_scanner.zip
          echo "601c00f35a2df01a0f8c28c2cdf463629d7a77450043ea61f174b0b535ae18f6  /tmp/kraken_eur_scanner.zip" | sha256sum -c -
          unzip -t /tmp/kraken_eur_scanner.zip
          rm -rf .scanner
          mkdir .scanner
          unzip -q /tmp/kraken_eur_scanner.zip -d .scanner

      - name: Restore rolling scanner state
        uses: actions/cache@v4
        with:
          path: .scanner/kraken_eur_scanner/.state
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Unit and regression tests
        if: github.event_name != 'schedule'
        working-directory: .scanner/kraken_eur_scanner
        run: python -m unittest discover -s tests -v

      - name: Scan Kraken EUR market
        working-directory: .scanner/kraken_eur_scanner
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MIN_TURNOVER_EUR_24H: '150000'
          MAX_STAGE2_PAIRS: '120'
          MAX_SPREAD_PCT: '1.5'
          CANDIDATE_THRESHOLD: '5.0'
          COOLDOWN_SECONDS: '2700'
          REQUEST_SPACING: '1.05'
          ALIGN_SAFE_PHASE: '1'
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from dataclasses import asdict
          from datetime import datetime, timezone
          from pathlib import Path
          import scanner

          audit_path = Path(".state/audit_history.jsonl")
          pending_events = []
          scan_started_ts = int(time.time())
          scan_started_at_utc = datetime.fromtimestamp(scan_started_ts, tz=timezone.utc).isoformat().replace("+00:00", "Z")

          # Compact, machine-readable handoff for ChatGPT. This is public
          # market/scanner context only; it contains no account keys, orders,
          # private ledger data or real-money instructions.
          handoff_dir = Path("handoff")
          handoff_dir.mkdir(parents=True, exist_ok=True)
          handoff_path = handoff_dir / "candidates.jsonl"

          def append_handoff(event):
              with handoff_path.open("a", encoding="utf-8") as fh:
                  fh.write(json.dumps(event, separators=(",", ":"), sort_keys=True) + "\n")

          append_handoff({
              "schema_version": 1,
              "kind": "scan_run_meta",
              "scan_started_ts": scan_started_ts,
              "scan_started_at_utc": scan_started_at_utc,
          })

          original_post = scanner.post_slack
          original_save = scanner.save_state
          original_should_post = scanner.should_post

          def audit_post(text):
              original_post(text)
              m = re.search(r"(?:^|\|\s*)pair=([^|]+)", text)
              pair = m.group(1).strip() if m else None
              posted_at = int(time.time())
              pending_events.append({
                  "type": "posted",
                  "ts": posted_at,
                  "pair": pair,
                  "text": text,
              })
              append_handoff({
                  "schema_version": 1,
                  "kind": "review_candidate_message",
                  "ts": posted_at,
                  "pair": pair,
                  "action": "REVIEW_ONLY_NOT_ORDER",
                  "text": text,
              })
              print("AUDIT_POSTED " + text, flush=True)

          def audit_should_post(row, state, now):
              result = original_should_post(row, state, now)
              if not result:
                  pending_events.append({
                      "type": "cooldown",
                      "ts": int(now),
                      "pair": row.pair,
                      "score": row.score,
                  })
              return result

          def _f(payload, key, default=0.0):
              try:
                  return float(payload.get(key, default))
              except (TypeError, ValueError):
                  return float(default)

          def _kraken_public(path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = "https://api.kraken.com" + path + (("?" + query) if query else "")
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "kraken-eur-scanner-decision-context/1.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  result = json.loads(resp.read().decode())
              if result.get("error"):
                  raise RuntimeError(f"Kraken public error for {path}: {result['error']}")
              return result.get("result", {})

          def emit_decision_context(payload, now):
              # Reuse the same GitHub runner that already reaches Kraken reliably.
              # This is decision support only: raw/derived OHLC levels, never an order.
              pair = payload.get("pair")
              altname = payload.get("altname")
              if not pair or not altname:
                  print(f"WARN DECISION_CONTEXT missing pair/altname for {pair}", flush=True)
                  return
              try:
                  result = _kraken_public("/0/public/OHLC", {"pair": altname, "interval": 15})
                  keys = [k for k in result.keys() if k != "last"]
                  if not keys:
                      raise RuntimeError("No OHLC pair payload")
                  bars = result[keys[0]]
                  if len(bars) < 6:
                      raise RuntimeError(f"Insufficient OHLC bars: {len(bars)}")
                  # Kraken includes the current not-yet-committed candle as the last row.
                  closed = bars[:-1] if len(bars) > 1 else bars
                  recent = closed[-16:]
                  last = recent[-1]

                  def nums(rows, idx):
                      return [float(x[idx]) for x in rows]

                  last4 = recent[-4:]
                  last12 = recent[-12:] if len(recent) >= 12 else recent
                  close = float(last[4])
                  support_1h = min(nums(last4, 3))
                  resistance_1h = max(nums(last4, 2))
                  support_3h = min(nums(last12, 3))
                  resistance_3h = max(nums(last12, 2))

                  trs = []
                  prev_close = None
                  for bar in recent[-15:]:
                      high = float(bar[2])
                      low = float(bar[3])
                      bar_close = float(bar[4])
                      tr = high - low if prev_close is None else max(
                          high - low,
                          abs(high - prev_close),
                          abs(low - prev_close),
                      )
                      trs.append(tr)
                      prev_close = bar_close
                  atr15 = sum(trs[-14:]) / max(1, len(trs[-14:]))

                  context = {
                      "schema_version": 1,
                      "ts": int(now),
                      "pair": pair,
                      "altname": altname,
                      "source": "kraken_public_ohlc_via_github_runner",
                      "interval_min": 15,
                      "sensor_price_eur": float(payload.get("price") or 0.0),
                      "closed_through_epoch": int(float(last[0])),
                      "last_closed": {
                          "open": float(last[1]),
                          "high": float(last[2]),
                          "low": float(last[3]),
                          "close": close,
                          "volume": float(last[6]),
                      },
                      "support_1h": support_1h,
                      "resistance_1h": resistance_1h,
                      "support_3h": support_3h,
                      "resistance_3h": resistance_3h,
                      "atr15_eur": atr15,
                      "atr15_pct": (100.0 * atr15 / close) if close else None,
                      "range_1h_pct": (100.0 * (resistance_1h - support_1h) / close) if close else None,
                      "recent_closed_closes": [float(x[4]) for x in recent[-6:]],
                  }
                  append_handoff({
                      "schema_version": 1,
                      "kind": "market_context",
                      "ts": int(now),
                      "pair": pair,
                      "context": context,
                  })
                  print(
                      "DECISION_CONTEXT_V1 "
                      + json.dumps(context, separators=(",", ":"), sort_keys=True),
                      flush=True,
                  )
              except Exception as exc:
                  print(f"WARN DECISION_CONTEXT pair={pair} failed: {exc}", flush=True)

          def rescue_candidate(payload):
              # Safety net for the handoff layer only: never an order signal.
              # It protects exceptional liquid momentum candidates from being
              # dropped solely by the scanner's normal top-N/score selection.
              score = _f(payload, "score")
              rank = int(_f(payload, "rank15", 999))
              ret15 = _f(payload, "ret15_live")
              ret1h = _f(payload, "ret1h")
              vol_live = _f(payload, "volume_ratio_live")
              turnover = _f(payload, "turnover24h")
              spread = _f(payload, "spread_pct")
              fresh = _f(payload, "fresh_move_3h")
              breakout = bool(payload.get("breakout3h", False))

              liquid = turnover >= 150000 and spread <= 1.5
              controlled_distance = fresh <= 18.0
              extreme_accel = ret15 >= 5.0 or ret1h >= 8.0
              volume_ignition = vol_live >= 25.0 and (ret15 >= 2.0 or ret1h >= 4.0)
              top_breakout = rank <= 2 and breakout and vol_live >= 3.0 and (ret15 >= 2.0 or ret1h >= 4.0)

              return (
                  score >= 8.5
                  and liquid
                  and controlled_distance
                  and (extreme_accel or volume_ignition or top_breakout)
              )

          def rescue_message(payload):
              def g(key, default=""):
                  return payload.get(key, default)

              return (
                  "SCANNER_CANDIDATE_V1"
                  f" | pair={g('pair')}"
                  f" | score={_f(payload, 'score'):.2f}"
                  f" | price_eur={g('price')}"
                  f" | ret15_live={_f(payload, 'ret15_live'):.2f}%"
                  f" | ret1h={_f(payload, 'ret1h'):.2f}%"
                  f" | ret3h={_f(payload, 'ret3h'):.2f}%"
                  f" | ret24h={_f(payload, 'ret24h'):.2f}%"
                  f" | vol_live={_f(payload, 'volume_ratio_live'):.2f}x"
                  f" | vol_closed={_f(payload, 'volume_ratio_closed'):.2f}x"
                  f" | rank={int(_f(payload, 'rank15', 999))}"
                  f" | rank_jump={int(_f(payload, 'rank_jump'))}"
                  f" | state_rank_jump={int(_f(payload, 'state_rank_jump'))}"
                  f" | breakout3h={1 if payload.get('breakout3h') else 0}"
                  f" | higher_lows={1 if payload.get('higher_lows') else 0}"
                  f" | base_tight={_f(payload, 'base_tight_pct'):.2f}%"
                  f" | fresh_move3h={_f(payload, 'fresh_move_3h'):.2f}%"
                  f" | adx14={_f(payload, 'adx14'):.1f}"
                  f" | spread={_f(payload, 'spread_pct'):.3f}%"
                  f" | turnover24h_eur={int(_f(payload, 'turnover24h'))}"
                  " | rescue_lane=1"
                  " | action=REVIEW_ONLY_NOT_ORDER"
              )

          # Regression guard based on the BCH 22-Sep missed-move shape:
          # exceptional liquid rank-1 acceleration must reach review even if
          # it loses a normal candidate slot. A routine candidate must not.
          assert rescue_candidate({
              "score": 10.10, "rank15": 1, "ret15_live": 10.48, "ret1h": 10.95,
              "volume_ratio_live": 136.35, "turnover24h": 1300000, "spread_pct": 0.15,
              "fresh_move_3h": 11.0, "breakout3h": True,
          })
          assert not rescue_candidate({
              "score": 9.0, "rank15": 8, "ret15_live": 0.4, "ret1h": 1.5,
              "volume_ratio_live": 2.0, "turnover24h": 500000, "spread_pct": 0.10,
              "fresh_move_3h": 2.0, "breakout3h": False,
          })

          def audit_save(items, posted):
              now = int(time.time())
              rows = sorted(items, key=lambda x: x.score, reverse=True)

              posted_pairs = {
                  event.get("pair")
                  for event in pending_events
                  if event.get("type") == "posted" and event.get("pair")
              }
              cooldown_pairs = {
                  event.get("pair")
                  for event in pending_events
                  if event.get("type") == "cooldown" and event.get("pair")
              }

              rescued = []
              for row in rows:
                  payload = asdict(row)
                  pair = payload.get("pair")
                  if pair in posted_pairs or pair in cooldown_pairs:
                      continue
                  if rescue_candidate(payload):
                      text = rescue_message(payload)
                      audit_post(text)
                      posted_pairs.add(pair)
                      rescued.append(pair)
                      print(f"AUDIT_RESCUE pair={pair} reason=exceptional_handoff", flush=True)

              if rescued:
                  print("AUDIT_RESCUE_SUMMARY " + ",".join(rescued), flush=True)

              # Emit fresh Kraken 15m OHLC decision context only for candidates
              # actually handed off for review. Failure is non-blocking.
              for row in rows:
                  if row.pair in posted_pairs:
                      append_handoff({
                          "schema_version": 1,
                          "kind": "candidate_snapshot",
                          "ts": now,
                          "pair": row.pair,
                          "action": "REVIEW_ONLY_NOT_ORDER",
                          "features": asdict(row),
                      })
                      emit_decision_context(asdict(row), now)

              new_events = list(pending_events)
              for row in rows:
                  payload = asdict(row)
                  new_events.append({
                      "type": "row",
                      "ts": now,
                      "pair": row.pair,
                      "features": payload,
                  })
                  print("AUDIT_ROW " + json.dumps(payload, separators=(",", ":"), sort_keys=True), flush=True)

              # Telemetry is diagnostic only and must never block the live scanner.
              try:
                  audit_path.parent.mkdir(parents=True, exist_ok=True)
                  keep_after = now - 5 * 24 * 60 * 60
                  retained = []
                  if audit_path.exists():
                      for line in audit_path.read_text("utf-8").splitlines():
                          try:
                              event = json.loads(line)
                              if int(event.get("ts", 0)) >= keep_after:
                                  retained.append(event)
                          except Exception:
                              continue
                  retained.extend(new_events)
                  tmp = audit_path.with_suffix(".tmp")
                  tmp.write_text(
                      "".join(json.dumps(event, separators=(",", ":"), sort_keys=True) + "\n" for event in retained),
                      encoding="utf-8",
                  )
                  tmp.replace(audit_path)
              except Exception as exc:
                  print(f"WARN audit telemetry persistence failed: {exc}", flush=True)

              return original_save(items, posted)

          scanner.post_slack = audit_post
          scanner.should_post = audit_should_post
          scanner.save_state = audit_save
          scanner.run()
          PY

      - name: Upload compact ChatGPT handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scanner/kraken_eur_scanner/handoff/candidates.jsonl
          retention-days: 30
          compression-level: 9
          if-no-files-found: warn

      - name: Persist canonical evaluator handoff queue
        if: success() && hashFiles('.scanner/kraken_eur_scanner/handoff/candidates.jsonl') != ''
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path(".scanner/kraken_eur_scanner/handoff/candidates.jsonl")
          rows = [json.loads(line) for line in source.read_text("utf-8").splitlines() if line.strip()]
          run_meta = next((r for r in rows if r.get("kind") == "scan_run_meta"), None)
          messages = {r["pair"]: r for r in rows if r.get("kind") == "review_candidate_message" and r.get("pair")}
          snapshots = {r["pair"]: r for r in rows if r.get("kind") == "candidate_snapshot" and r.get("pair")}
          contexts = {r["pair"]: r for r in rows if r.get("kind") == "market_context" and r.get("pair")}

          out = Path("handoff_queue")
          out.mkdir(exist_ok=True)
          created = []
          run_id = int(os.environ["SOURCE_RUN_ID"])
          run_attempt = int(os.environ["SOURCE_RUN_ATTEMPT"])

          for pair in sorted(snapshots):
              snap = snapshots[pair]
              msg = messages.get(pair)
              ctx = contexts.get(pair)
              if not msg or not ctx:
                  raise SystemExit(f"incomplete handoff for {pair}: message={bool(msg)} context={bool(ctx)}")
              if msg.get("action") != "REVIEW_ONLY_NOT_ORDER" or snap.get("action") != "REVIEW_ONLY_NOT_ORDER":
                  raise SystemExit(f"unsafe handoff action for {pair}")

              ts = int(snap["ts"])
              dt = datetime.fromtimestamp(ts, tz=timezone.utc)
              detected_ts = int(msg.get("ts", ts))
              detected_dt = datetime.fromtimestamp(detected_ts, tz=timezone.utc)
              handoff_written_dt = datetime.now(timezone.utc)
              pair_tag = pair.replace("/", "-")
              queue_id = f"{run_id}:{pair_tag}:{ts}"
              candidate_id = f"{dt.strftime('%Y%m%d-%H%M%S')}-{pair_tag}-r{run_id}"
              name = f"{candidate_id}.json"
              payload = {
                  "schema_version": 1,
                  "kind": "CANONICAL_CANDIDATE_HANDOFF_V1",
                  "candidate_id": candidate_id,
                  "queue_id": queue_id,
                  "source_repo": "hoffmannherdecke/kraken-eur-scanner",
                  "source_scanner_run_id": run_id,
                  "source_scanner_run_attempt": run_attempt,
                  "event_time_utc": dt.isoformat().replace("+00:00", "Z"),
                  "event_ts": ts,
                  "timing": {
                      "scan_step_started_at_utc": run_meta.get("scan_started_at_utc") if run_meta else None,
                      "candidate_detected_at_utc": detected_dt.isoformat().replace("+00:00", "Z"),
                      "candidate_detected_ts": detected_ts,
                      "candidate_snapshot_at_utc": dt.isoformat().replace("+00:00", "Z"),
                      "handoff_written_at_utc": handoff_written_dt.isoformat().replace("+00:00", "Z"),
                      "altrady_detected_at_utc": None,
                  },
                  "pair": pair,
                  "altname": snap["features"].get("altname"),
                  "action": "REVIEW_ONLY_NOT_ORDER",
                  "scanner_candidate": snap["features"],
                  "scanner_market_context": ctx["context"],
                  "review_message": msg.get("text", ""),
              }
              if not payload["altname"]:
                  raise SystemExit(f"missing altname for {pair}")
              target = out / name
              encoded = json.dumps(payload, sort_keys=True, indent=2, ensure_ascii=False) + "\n"
              if target.exists() and target.read_text("utf-8") != encoded:
                  raise SystemExit(f"queue file collision with different content: {target}")
              target.write_text(encoded, encoding="utf-8")
              created.append(str(target))

          # Job-local manifest: the dynamic gate checks only candidates from this run.
          Path(".candidate-identity-manifest.json").write_text(
              json.dumps({"candidate_files": created}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("CANONICAL_HANDOFF_QUEUE " + json.dumps({
              "source_run_id": run_id,
              "candidate_files": created,
              "count": len(created),
          }, sort_keys=True))
          PY

      - name: Dynamic candidate identity gate
        if: success() && hashFiles('.candidate-identity-manifest.json') != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          manifest = json.loads(Path(".candidate-identity-manifest.json").read_text("utf-8"))
          checked = []
          for raw_path in manifest.get("candidate_files", []):
              path = Path(raw_path)
              candidate = json.loads(path.read_text("utf-8"))
              candidate_id = candidate.get("candidate_id")
              pair = candidate.get("pair")
              event_time = candidate.get("event_time_utc")
              try:
                  if not isinstance(event_time, str) or not event_time.endswith("Z"):
                      raise ValueError("event_time_utc must be UTC Z time")
                  dt = datetime.fromisoformat(event_time[:-1] + "+00:00")
                  event_ts = int(candidate.get("event_ts"))
                  run_id = int(candidate.get("source_scanner_run_id"))
              except (TypeError, ValueError) as exc:
                  raise SystemExit(f"candidate identity mismatch for {path}: malformed identity fields: {exc}")

              pair_tag = pair.replace("/", "-") if isinstance(pair, str) else ""
              expected_id = f"{dt.strftime('%Y%m%d-%H%M%S')}-{pair_tag}-r{run_id}"
              expected_queue_id = f"{run_id}:{pair_tag}:{event_ts}"
              if (
                  candidate_id != expected_id
                  or path.stem != expected_id
                  or int(dt.timestamp()) != event_ts
                  or candidate.get("queue_id") != expected_queue_id
                  or candidate.get("kind") != "CANONICAL_CANDIDATE_HANDOFF_V1"
                  or candidate.get("action") != "REVIEW_ONLY_NOT_ORDER"
              ):
                  raise SystemExit(f"candidate identity mismatch for {path}")
              checked.append(candidate_id)

          print("DYNAMIC_CANDIDATE_IDENTITY_GATE_PASS " + json.dumps({
              "count": len(checked),
              "candidate_ids": checked,
          }, sort_keys=True))
          PY

      - name: Commit validated canonical handoff queue
        id: queue_commit
        if: success() && hashFiles('.candidate-identity-manifest.json') != ''
        run: |
          set -euo pipefail
          if git status --porcelain -- handoff_queue | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add handoff_queue
            git commit -m "[auto-handoff] persist scanner candidates from run ${GITHUB_RUN_ID}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "new_candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new canonical handoff queue files."
            echo "new_candidates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch paper evaluator immediately
        if: success() && steps.queue_commit.outputs.new_candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          control_path = Path("paper_runtime_control.json")
          control = json.loads(control_path.read_text("utf-8")) if control_path.exists() else {"enabled": False}
          if control.get("enabled") is not True:
              print("PAPER_EVALUATOR_PAUSED | scanner handoff preserved; no evaluator dispatch")
              raise SystemExit(0)

          url = f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/paper-evaluator.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "main"}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "kraken-eur-scanner-immediate-evaluator/1.0",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              if resp.status not in (204,):
                  raise RuntimeError(f"workflow dispatch HTTP {resp.status}")
          print("PAPER_EVALUATOR_DISPATCHED")
          PY
