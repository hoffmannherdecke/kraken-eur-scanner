name: Kraken EUR early sensor

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'

permissions:
  contents: read

concurrency:
  group: kraken-eur-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Rebuild and verify scanner package
        run: |
          cat .payload/part*.b64 | base64 -d > /tmp/kraken_eur_scanner.zip
          echo "601c00f35a2df01a0f8c28c2cdf463629d7a77450043ea61f174b0b535ae18f6  /tmp/kraken_eur_scanner.zip" | sha256sum -c -
          unzip -t /tmp/kraken_eur_scanner.zip
          rm -rf .scanner
          mkdir .scanner
          unzip -q /tmp/kraken_eur_scanner.zip -d .scanner

      - name: Apply late-move regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path(".scanner/kraken_eur_scanner/scanner.py")
          s=p.read_text()
          pattern=r'(?m)^(?P<i>\s*)if x\.context7d > 50 and x\.dist7d_high_pct > -5 and not x\.breakout3h:\n(?P=i)    x\.score = round\(x\.score - 0\.8, 2\)'
          m=re.search(pattern,s)
          if not m:
              raise SystemExit("late-guard patch target not found; fail closed")
          i=m.group("i")
          lines=[
              i+"# Long-context late-move guard. This is an EARLY sensor.",
              i+"# Missing long-context data never blocks a candidate.",
              i+"too_late = (",
              i+"    x.ret24h >= 25.0",
              i+"    or (x.context7d >= 50.0 and x.dist7d_high_pct > -8.0)",
              i+"    or (x.context30d >= 80.0 and x.dist30d_high_pct > -10.0)",
              i+"    or (x.context30d >= 35.0 and x.dist30d_high_pct > -3.0)",
              i+"    or (x.ret24h >= 8.0 and x.context30d >= 15.0 and x.dist30d_high_pct > -3.0)",
              i+"    or (x.ret24h >= 12.0 and x.context7d >= 35.0 and x.dist7d_high_pct > -8.0)",
              i+")",
              i+"if too_late:",
              i+"    x.late = True",
              i+"    x.score = round(x.score - 4.0, 2)",
              i+"elif x.context7d > 35.0 and x.dist7d_high_pct > -5.0:",
              i+"    x.score = round(x.score - 0.8, 2)",
          ]
          s=s[:m.start()]+"\n".join(lines)+s[m.end():]

          # Every emitted Slack candidate must have verified 7d/30d context.
          p_ctx=r'(def add_long_context\([^\n]+\) -> None:\n)(\s*)for x in candidates\[:10\]:'
          s2,n=re.subn(p_ctx,lambda z:z.group(1)+z.group(2)+"for x in candidates:",s,count=1)
          if n != 1:
              raise SystemExit("long-context coverage patch target not found; fail closed")
          s=s2

          old_filter='candidates = [x for x in plausible if x.score >= CANDIDATE_THRESHOLD and not x.late]'
          new_filter='candidates = [x for x in plausible if x.score >= CANDIDATE_THRESHOLD and not x.late and x.context7d is not None and x.context30d is not None]'
          if old_filter not in s:
              raise SystemExit("final context gate patch target not found; fail closed")
          s=s.replace(old_filter,new_filter,1)
          p.write_text(s)
          PY

      - name: Restore rolling scanner state
        uses: actions/cache@v4
        with:
          path: .scanner/kraken_eur_scanner/.state
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Unit and regression tests
        working-directory: .scanner/kraken_eur_scanner
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import scanner
          class C:
              def ohlc(self, pair, interval=60):
                  rows=[]
                  for i in range(720):
                      px=1.0*(1+0.0015*i)
                      rows.append([i*3600,str(px),str(px*1.01),str(px*.99),str(px),str(px),"1000",10])
                  return rows
          def mk(ret24):
              return scanner.Features(
                  pair="TEST/EUR",altname="TESTEUR",price=2.0,turnover24h=1_000_000,
                  spread_pct=.2,ret15_live=1,ret15_closed=.2,ret1h=2,ret3h=4,ret24h=ret24,
                  volume_ratio_live=2.5,volume_ratio_closed=2,breakout3h=True,
                  base_tight_pct=4,higher_lows=True,ema26_gt_50=True,adx14=30,
                  fresh_move_3h=5,stale=False,score=9.0)
          meta={"TEST/EUR":scanner.PairMeta("T","TESTEUR","TEST/EUR","T",4)}
          late=mk(30)
          scanner.add_long_context(C(),meta,[late])
          assert late.late, "24h +30% must not remain a fresh early candidate"

          kas_like=mk(6)
          scanner.add_long_context(C(),meta,[kas_like])
          assert kas_like.late, "30d strongly up and at monthly high must not be a fresh early candidate"

          ondo_like=mk(10)
          class C23:
              def ohlc(self, pair, interval=60):
                  rows=[]
                  for i in range(720):
                      px=1.0*(1+0.23*i/719)
                      rows.append([i*3600,str(px),str(px*1.002),str(px*.998),str(px),str(px),"1000",10])
                  return rows
          scanner.add_long_context(C23(),meta,[ondo_like])
          assert ondo_like.late, "24h near +10%, 30d positive and at monthly high must be continuation, not fresh early"

          mon_like=mk(9)
          class CMon:
              def ohlc(self, pair, interval=60):
                  rows=[]
                  for i in range(720):
                      if i < 300:
                          px=1.10 - 0.20*i/299
                      elif i < 552:
                          px=0.90 - 0.10*(i-300)/251
                      else:
                          px=0.80 + 0.15*(i-552)/167
                      hi=px*1.002
                      if i==100: hi=1.20
                      rows.append([i*3600,str(px),str(hi),str(px*.998),str(px),str(px),"1000",10])
                  return rows
          scanner.add_long_context(CMon(),meta,[mon_like])
          assert not mon_like.late, "fresh recovery well below 30d high must remain eligible"
          print("late-context regressions: OK")
          PY

      - name: Scan Kraken EUR market
        working-directory: .scanner/kraken_eur_scanner
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MIN_TURNOVER_EUR_24H: '150000'
          MAX_STAGE2_PAIRS: '120'
          MAX_SPREAD_PCT: '1.5'
          CANDIDATE_THRESHOLD: '5.0'
          COOLDOWN_SECONDS: '2700'
          REQUEST_SPACING: '1.05'
          ALIGN_SAFE_PHASE: '1'
        run: python scanner.py
