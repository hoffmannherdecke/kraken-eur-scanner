name: Kraken EUR early sensor

'on':
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'

permissions:
  contents: read

concurrency:
  group: kraken-eur-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Rebuild and verify scanner package
        run: |
          set -euo pipefail
          cat .payload/part*.b64 | base64 -d > /tmp/kraken_eur_scanner.zip
          echo "601c00f35a2df01a0f8c28c2cdf463629d7a77450043ea61f174b0b535ae18f6  /tmp/kraken_eur_scanner.zip" | sha256sum -c -
          unzip -t /tmp/kraken_eur_scanner.zip
          rm -rf .scanner
          mkdir .scanner
          unzip -q /tmp/kraken_eur_scanner.zip -d .scanner

      - name: Restore rolling scanner state
        uses: actions/cache@v4
        with:
          path: .scanner/kraken_eur_scanner/.state
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Unit and regression tests
        working-directory: .scanner/kraken_eur_scanner
        run: python -m unittest discover -s tests -v

      - name: Scan Kraken EUR market
        working-directory: .scanner/kraken_eur_scanner
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MIN_TURNOVER_EUR_24H: '150000'
          MAX_STAGE2_PAIRS: '120'
          MAX_SPREAD_PCT: '1.5'
          CANDIDATE_THRESHOLD: '5.0'
          COOLDOWN_SECONDS: '2700'
          REQUEST_SPACING: '1.05'
          ALIGN_SAFE_PHASE: '1'
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from dataclasses import asdict
          from pathlib import Path
          import scanner

          audit_path = Path(".state/audit_history.jsonl")
          pending_events = []

          original_post = scanner.post_slack
          original_save = scanner.save_state
          original_should_post = scanner.should_post

          def audit_post(text):
              original_post(text)
              m = re.search(r"(?:^|\|\s*)pair=([^|]+)", text)
              pair = m.group(1).strip() if m else None
              pending_events.append({
                  "type": "posted",
                  "ts": int(time.time()),
                  "pair": pair,
                  "text": text,
              })
              print("AUDIT_POSTED " + text, flush=True)

          def audit_should_post(row, state, now):
              result = original_should_post(row, state, now)
              if not result:
                  pending_events.append({
                      "type": "cooldown",
                      "ts": int(now),
                      "pair": row.pair,
                      "score": row.score,
                  })
              return result

          def audit_save(items, posted):
              now = int(time.time())
              rows = sorted(items, key=lambda x: x.score, reverse=True)
              new_events = list(pending_events)
              for row in rows:
                  payload = asdict(row)
                  new_events.append({
                      "type": "row",
                      "ts": now,
                      "pair": row.pair,
                      "features": payload,
                  })
                  print("AUDIT_ROW " + json.dumps(payload, separators=(",", ":"), sort_keys=True), flush=True)

              # Telemetry is diagnostic only and must never block the live scanner.
              try:
                  audit_path.parent.mkdir(parents=True, exist_ok=True)
                  keep_after = now - 5 * 24 * 60 * 60
                  retained = []
                  if audit_path.exists():
                      for line in audit_path.read_text("utf-8").splitlines():
                          try:
                              event = json.loads(line)
                              if int(event.get("ts", 0)) >= keep_after:
                                  retained.append(event)
                          except Exception:
                              continue
                  retained.extend(new_events)
                  tmp = audit_path.with_suffix(".tmp")
                  tmp.write_text(
                      "".join(json.dumps(event, separators=(",", ":"), sort_keys=True) + "\n" for event in retained),
                      encoding="utf-8",
                  )
                  tmp.replace(audit_path)
              except Exception as exc:
                  print(f"WARN audit telemetry persistence failed: {exc}", flush=True)

              return original_save(items, posted)

          scanner.post_slack = audit_post
          scanner.should_post = audit_should_post
          scanner.save_state = audit_save
          scanner.run()
          PY
