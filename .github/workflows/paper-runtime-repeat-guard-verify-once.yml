name: Paper runtime repeat-guard verify once

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-runtime-repeat-guard-verify-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch paper runtime once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/paper-evaluator.yml/dispatches"
          req=urllib.request.Request(
              url,
              data=json.dumps({"ref":"main"}).encode(),
              method="POST",
              headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"paper-repeat-guard-verifier/1.0",
              },
          )
          with urllib.request.urlopen(req,timeout=20) as resp:
              print("dispatch_status",resp.status)
              if resp.status!=204:
                  raise RuntimeError(resp.status)
          PY
