name: Slack event trigger diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/slack-event-trigger-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send TEST_ONLY bot event to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "text": "TEST_ONLY BOT_EVENT-2309-02 source=github-actions purpose=verify_slack_to_work_event_trigger"
          }
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              print("slack_status", r.status)
          PY
