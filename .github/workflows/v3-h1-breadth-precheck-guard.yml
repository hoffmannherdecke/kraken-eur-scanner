name: V3 H1 breadth precheck guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h1-cross-crypto-breadth-precheck-v1.json'
      - 'research/v3/h1-eur15-development-feature-trial-v1.json'
      - 'research/v3/h1-association-trial-ledger-record-v1.json'
      - 'research/v3/association/v3-h1-h6-association-evidence-20261002.json'
      - 'research/v3/h1-h6-association-review-20261002.json'
      - 'research/v3/h1-breadth-association-trial-v1.json'
      - 'research/v3/h1-incremental-relative-context-trial-v1.json'
      - 'research/v3/h1-incremental-trial-ledger-record-v1.json'
      - 'tools/v3-h1-eur15-breadth-feature-integrity.py'
      - 'tools/v3-h1-association-trial.py'
      - 'tools/v3-h1-incremental-relative-context.py'
      - 'tools/run-minipc-v3-h1-h6-incremental.ps1'
      - 'tools/run-minipc-v3-h1-h6-association.ps1'
      - 'tools/run-minipc-v3-feature-integrity-gates.ps1'
      - 'research/v3/fixtures/h1-cross-crypto-breadth-synthetic.json'
      - 'tools/v3-h1-breadth-pit-smoke.py'
      - '.github/workflows/v3-h1-breadth-precheck-guard.yml'

permissions:
  contents: read

concurrency:
  group: v3-h1-breadth-precheck-guard
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile H1 smoke
        run: python -m py_compile tools/v3-h1-breadth-pit-smoke.py

      - name: Validate H1 preregistration guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h1-cross-crypto-breadth-precheck-v1.json").read_text("utf-8"))
          assert j["kind"]=="V3_H1_CROSS_CRYPTO_BREADTH_PRECHECK_V1"
          assert j["status"] in {"PRECHECK_PIT_METHOD_GREEN","PRECHECK_REAL_FEATURE_INTEGRITY_GREEN_ASSOCIATION_PREREG_PENDING","ASSOCIATION_TRIAL_PREREGISTERED_NOT_EXECUTED","ASSOCIATION_001_GREEN_INCREMENTAL_VALUE_PREREG_PENDING","INCREMENTAL_TRIAL_PREREGISTERED_NOT_EXECUTED","INCREMENTAL_TRIAL_RUNNER_READY_PHYSICAL_PENDING"}
          assert j["feature_role"]=="STATE_AND_RELATIVE_CONTEXT_FIRST"
          assert j["first_research_role"]["performance_trial"] is False
          assert j["first_research_role"]["threshold_selection"] is False
          assert j["first_research_role"]["pair_selection_by_performance"] is False
          assert j["future_trial_constraints"]["sealed_2026h1_holdout_open_allowed"] is False
          assert j["runtime_guardrails"]["orders"] is False
          assert j["runtime_guardrails"]["real_money_actions"] is False
          if j["status"]=="PRECHECK_PIT_METHOD_GREEN":
              assert j["next_gate"]=="REAL_EUR15_BREADTH_FEATURE_TRIAL_PREREGISTERED__NEXT_EXECUTE_PHYSICALLY_WITH_HOLDOUT_SEALED"
          elif j["status"]=="PRECHECK_REAL_FEATURE_INTEGRITY_GREEN_ASSOCIATION_PREREG_PENDING":
              assert j["next_gate"]=="PREREGISTER_H1_ASSOCIATION_TRIAL_ON_DEVELOPMENT_ONLY_NO_HOLDOUT_NO_THRESHOLD_SEARCH"
          elif j["status"]=="ASSOCIATION_TRIAL_PREREGISTERED_NOT_EXECUTED":
              assert j["next_gate"]=="IMPLEMENT_VALIDATE_AND_EXECUTE_V3_H1_ASSOC_001_ON_PRE2026_DEVELOPMENT_ONLY"
          elif j["status"]=="ASSOCIATION_001_GREEN_INCREMENTAL_VALUE_PREREG_PENDING":
              assert j["next_gate"]=="PREREGISTER_H1_INCREMENTAL_RELATIVE_CONTEXT_TRIAL_CONTROLLING_TARGET_RETURN_1H_NO_HOLDOUT"
          elif j["status"]=="INCREMENTAL_TRIAL_PREREGISTERED_NOT_EXECUTED":
              assert j["next_gate"]=="IMPLEMENT_VALIDATE_AND_EXECUTE_V3_H1_INCR_001_PRE2026_ONLY_NO_HOLDOUT"
          else:
              assert j["next_gate"]=="EXECUTE_FROZEN_V3_H1_INCR_001_ON_MINIPC_PRE2026_ONLY_NO_HOLDOUT"
          rd=j["methodology_readiness"]
          assert rd["real_eur15_feature_trial_preregistered"]=="V3-H1-EUR15-BREADTH-FEATURE-INTEGRITY-001"
          assert rd["real_eur15_expected_pair_files"]==648
          assert rd["real_eur15_expected_rows"]==20960798
          assert rd["fixed_leaders"]==["XBTEUR","ETHEUR"]
          assert rd["feature_trial_performance_labels_allowed"] is False
          assert rd["synthetic_pit_multi_pair_smoke"]=="CI_GREEN_RUN_3"
          assert rd["future_rows_leakage_trap"]=="PASS_IGNORED"
          assert rd["missing_exact_1h_lookback"]=="PASS_REMAINS_MISSING_AND_DENOMINATOR_EXPLICIT"
          assert rd["performance_trial_started"] is False
          assert rd["holdout_opened"] is False
          print("V3_H1_PREREG PASS no-performance/no-holdout")
          PY

      - name: Synthetic multi-pair PIT breadth smoke
        run: |
          python tools/v3-h1-breadth-pit-smoke.py             research/v3/fixtures/h1-cross-crypto-breadth-synthetic.json             --cutoff-epoch 18000             --target SOLEUR             --leaders XBTEUR,ETHEUR             --output /tmp/h1-breadth-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h1-breadth-smoke.json").read_text())
          assert j["status"]=="PASS"
          assert j["future_rows_present"]==5
          assert j["cross_section"]["15m"]["eligible_pair_count"]==5
          assert j["cross_section"]["1h"]["eligible_pair_count"]==4
          assert j["cross_section"]["1h"]["missing_pair_count"]==1
          assert j["cross_section"]["4h"]["eligible_pair_count"]==5
          assert j["returns_pct"]["XRPEUR"]["1h"] is None
          assert j["returns_pct"]["XRPEUR"]["15m"] is not None
          assert j["returns_pct"]["XRPEUR"]["4h"] is not None
          assert j["returns_pct"]["SOLEUR"]["1h"] < 20
          assert all(j["point_in_time_assertions"].values())
          assert j["guardrails"]["performance_trial_started"] is False
          assert j["guardrails"]["threshold_selection_performed"] is False
          assert j["guardrails"]["holdout_opened"] is False
          assert j["guardrails"]["active_v2r3_changed"] is False
          print("V3_H1_BREADTH_PIT_SMOKE PASS future-ignored/missing-explicit")
          PY


      - name: Validate real EUR15 H1 breadth feature-only preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h1-eur15-development-feature-trial-v1.json").read_text("utf-8"))
          assert j["kind"]=="V3_H1_EUR15_DEVELOPMENT_FEATURE_TRIAL_V1"
          assert j["status"]=="FROZEN_PREREGISTERED_NOT_EXECUTED"
          assert j["trial_id"]=="V3-H1-EUR15-BREADTH-FEATURE-INTEGRITY-001"
          d=j["dataset"]
          assert d["normalized_schema"]=="KRAKEN_EUR15_NORMALIZED_V1"
          assert d["expected_normalized_pair_files"]==648
          assert d["expected_total_normalized_rows"]==20960798
          assert d["development_window"]["end_utc_exclusive"]=="2026-01-01T00:00:00Z"
          assert d["sealed_holdout"]["status"]=="LOCKED_DO_NOT_READ_IN_H1_FEATURE_TRIAL"
          assert d["current_live_universe_filter"] is False
          f=j["fixed_feature_contract"]
          assert f["horizons_seconds"]=={"15m":900,"1h":3600,"4h":14400}
          assert f["leaders"]==["XBTEUR","ETHEUR"]
          m=j["denominator_and_missingness_contract"]
          assert m["denominator_is_horizon_specific"] is True
          assert m["eligible_pair_requires_exact_cutoff_and_exact_lookback"] is True
          assert m["missing_pair_count_reported"] is True
          assert m["no_zero_fill"] is True
          assert m["no_forward_fill"] is True
          assert m["no_current_listing_filter"] is True
          o=j["outputs_allowed"]
          assert o["future_return_labels"] is False
          assert o["trade_returns"] is False
          assert o["edge_metrics"] is False
          assert o["threshold_ranking"] is False
          assert o["pair_ranking_by_performance"] is False
          g=j["search_and_selection_guardrails"]
          assert g["target_pair_subset_selected_by_seen_performance"] is False
          assert g["horizon_sweep"] is False
          assert g["threshold_selection"] is False
          assert g["performance_trial_started"] is False
          assert g["sealed_holdout_opened"] is False
          r=j["runtime_guardrails"]
          assert r["active_v2r3_change_allowed"] is False
          assert r["v2r4_change_allowed"] is False
          assert r["paper_shadow_runtime_change_allowed"] is False
          assert r["orders"] is False
          assert r["real_money_actions"] is False
          print("V3_H1_REAL_FEATURE_PREREG PASS 648-pair/pre-2026/breadth-no-label/no-holdout")
          PY


      - name: H1 real feature runner self-test
        run: |
          python -m py_compile tools/v3-h1-eur15-breadth-feature-integrity.py
          python tools/v3-h1-eur15-breadth-feature-integrity.py --self-test


      - name: Validate H1 association preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("research/v3/h1-breadth-association-trial-v1.json").read_text())
          assert s["kind"]=="V3_H1_BREADTH_ASSOCIATION_TRIAL_V1"
          assert s["status"]=="FROZEN_PREREGISTERED_NOT_EXECUTED"
          assert s["trial_id"]=="V3-H1-ASSOC-001"
          assert s["fixed_features"]==[
            "target_return_1h","breadth_positive_share_1h","cross_sectional_median_return_1h",
            "leader_minus_target_return_1h","target_minus_peer_median_return_1h"]
          assert s["topology"]["sealed_holdout"]["status"]=="LOCKED_DO_NOT_READ_OR_LABEL"
          assert s["topology"]["purge_seconds"]==14400
          assert s["topology"]["embargo_seconds"]==14400
          assert s["labels"]["exact_contiguous_future_required"] is True
          assert s["outputs_guard"]["threshold_search"] is False
          assert s["outputs_guard"]["pair_subset_search"] is False
          assert s["outputs_guard"]["p_value_feature_selection"] is False
          assert s["outputs_guard"]["automatic_winner_selection"] is False
          assert s["runtime_guardrails"]["orders"] is False
          assert s["runtime_guardrails"]["real_money_actions"] is False
          r=json.loads(Path("research/v3/h1-association-trial-ledger-record-v1.json").read_text())
          assert r["trial_id"]=="V3-H1-ASSOC-001"
          assert r["dataset_sha256"]=="fc81b54cba6e12af3e9422dde9416179e6ef76af4831d48d839fbdb43018eaa4"
          assert r["purge_seconds"]==14400 and r["embargo_seconds"]==14400
          assert r["influenced_later_design"] is False
          print("V3_H1_ASSOC_PREREG PASS fixed/descriptive/no-holdout/no-selection")
          PY

      - name: H1 association runner self-test
        run: |
          python -m py_compile tools/v3-h1-association-trial.py
          python tools/v3-h1-association-trial.py --self-test


      - name: Validate completed H1 H6 association evidence and review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path("research/v3/association/v3-h1-h6-association-evidence-20261002.json").read_text())
          r=json.loads(Path("research/v3/h1-h6-association-review-20261002.json").read_text())
          assert e["kind"]=="V3_H1_H6_ASSOCIATION_EVIDENCE_V1"
          assert e["status"]=="PASS"
          assert e["trial_ledger"]["verify"]["status"]=="PASS"
          assert e["trial_ledger"]["verify"]["corrupt_trial_ids"]==[]
          assert e["h1"]["dataset"]["holdout_status"]=="LOCKED_DO_NOT_READ_OR_LABEL"
          assert e["h6"]["dataset"]["holdout_status"]=="LOCKED_DO_NOT_READ_OR_LABEL"
          assert e["collector_guardrails"]["holdout_opened"] is False
          assert e["collector_guardrails"]["threshold_search"] is False
          assert e["collector_guardrails"]["winner_selected"] is False
          assert r["status"]=="PASS_ASSOCIATION_REVIEW_HOLDOUT_SEALED"
          assert r["h1"]["review"]["unique_incremental_value_beyond_target_return_proven"] is False
          assert r["h6"]["review"]["raw_volume_ratio_incremental_signal_supported"] is False
          assert r["h6"]["review"]["volume_expansion_incremental_value_beyond_price_direction_proven"] is False
          assert r["governance"]["next_trials_must_set_influenced_later_design_true"] is True
          assert r["governance"]["sealed_2026h1_holdout_opened"] is False
          print("V3_H1_H6_ASSOC_REVIEW PASS canonical/no-holdout/no-auto-promotion")
          PY

      - name: Validate H1 incremental preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("research/v3/h1-incremental-relative-context-trial-v1.json").read_text())
          assert s["kind"]=="V3_H1_INCREMENTAL_RELATIVE_CONTEXT_TRIAL_V1"
          assert s["trial_id"]=="V3-H1-INCR-001"
          assert s["status"]=="FROZEN_PREREGISTERED_NOT_EXECUTED"
          assert s["fixed_control"]=="target_return_1h"
          assert s["fixed_incremental_features"]==["leader_minus_target_return_1h","target_minus_peer_median_return_1h"]
          assert s["label"]["name"]=="future_return_1h"
          assert s["search_accounting"]["influenced_later_design"] is True
          assert s["outputs_guard"]["threshold_search"] is False
          assert s["outputs_guard"]["holdout_open"] is False
          assert s["topology"]["sealed_holdout"]["status"]=="LOCKED_DO_NOT_READ_OR_LABEL"
          r=json.loads(Path("research/v3/h1-incremental-trial-ledger-record-v1.json").read_text())
          assert r["trial_id"]=="V3-H1-INCR-001"
          assert r["influenced_later_design"] is True
          print("V3_H1_INCR_PREREG PASS partial-correlation/no-holdout/search-accounted")
          PY


      - name: H1 incremental runner self-test
        run: |
          python -m py_compile tools/v3-h1-incremental-relative-context.py
          python tools/v3-h1-incremental-relative-context.py --self-test
