name: V2R4 PR validation

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2r4-pr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: prep/v2r4-fast-trigger-minipc-20260929
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile V2R4 Python sources
        run: |
          python -m py_compile \
            paper_evaluator/v2r4_trigger_contract.py \
            paper_evaluator/v2r4_trigger_plan.py \
            paper_evaluator/v2r4_wait_watcher.py \
            paper_evaluator/v2r4_precandidate_discovery.py \
            paper_evaluator/v2r4_precandidate_watcher.py

      - name: Run V2R4 unit tests
        run: |
          python -m unittest             tests.test_v2r4_trigger_contract             tests.test_v2r4_trigger_plan             tests.test_v2r4_precandidate_discovery             tests.test_v2r4_precandidate_watcher -v

      - name: Harmless live Kraken WAIT watcher smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          now=datetime.now(timezone.utc)
          plan={
            "schema_version":1,
            "candidate_id":"V2R4-SYNTHETIC-SMOKE",
            "pair":"BTC/EUR",
            "altname":"XXBTZEUR",
            "created_at_utc":now.isoformat().replace("+00:00","Z"),
            "expires_at_utc":(now+timedelta(minutes=10)).isoformat().replace("+00:00","Z"),
            "logic":"ALL",
            "conditions":[{"metric":"spread_pct","op":"<=","value":100.0}],
            "on_match":"FRESH_PAPER_RECHECK_ONLY",
            "paper_only":True
          }
          open("/tmp/v2r4-plan.json","w").write(json.dumps(plan))
          PY
          python paper_evaluator/v2r4_wait_watcher.py /tmp/v2r4-plan.json --once --receipt-dir /tmp/v2r4-receipts
          test -n "$(find /tmp/v2r4-receipts -type f -name '*.json' -print -quit)"
          python - <<'PY'
          import json,glob
          p=glob.glob("/tmp/v2r4-receipts/*.json")[0]
          x=json.load(open(p))
          assert x["matched"] is True
          assert x["next_action"]=="FRESH_PAPER_RECHECK_ONLY"
          assert x["real_money_actions_enabled"] is False
          print("WAIT_WATCHER_SMOKE_OK",p)
          PY

      - name: Broad Kraken EUR pre-candidate discovery smoke
        run: |
          python paper_evaluator/v2r4_precandidate_watcher.py             --once             --state /tmp/v2r4-pre/state.json             --event-dir /tmp/v2r4-pre/events             --max-depth-checks 2             --cooldown-seconds 0
          test -s /tmp/v2r4-pre/state.json
          echo PRE_CANDIDATE_SMOKE_OK
