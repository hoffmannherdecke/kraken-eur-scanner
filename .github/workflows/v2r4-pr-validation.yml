name: V2R4 PR validation

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to validate'
        required: true
        type: string
  pull_request:
    paths:
      - 'paper_evaluator/evaluate.py'
      - 'paper_context.py'
      - 'tests/test_kraken_paper_context_budget.py'
      - 'paper_evaluator/revalidate.py'
      - 'paper_evaluator/v2r4_*.py'
      - 'research/v2r4/**'
      - 'tests/test_v2r4_*.py'
      - 'tools/v2r4_cpu_versioned_release_contract.py'
      - 'docs/v2r4-cpu-cache-versioned-technical-release-20261017.md'
      - 'tools/v2r4-paper-cloud-sync.py'
      - 'tests/test_v2r4_paper_cloudsync_v3_fence.py'
      - 'tests/test_kraken_public_budget.py'
      - 'tools/minipc-runtime-supervisor.ps1'
      - 'tests/test_minipc_supervisor_rate_only.ps1'
      - 'tools/minipc-pr332-cloudsync-protected-switch.ps1'
      - 'tests/test_pr332_cloudsync_originalhost_one_shot.ps1'
      - 'tools/minipc-v3-originalhost-norearm-stop-only.ps1'
      - 'tools/minipc-v3-originalhost-norearm-restore-only.ps1'
      - 'tests/test_v3_originalhost_norearm_stop_only.ps1'
      - 'market_data/kraken_public_budget.py'
      - 'market_data/rest.py'
      - 'tools/minipc-kraken-universe-feed.py'
      - 'paper_evaluator/v3_bounded_four_candidate_compare.py'
      - 'paper_evaluator/v3_second_leg_policy_candidate_v1.py'
      - 'tests/test_v3_second_leg_policy_candidate_v1.py'
      - 'research/v3/v3-buy-decision-lessons-implementation-matrix-20261011.json'
      - 'tests/test_v3_bounded_four_candidate_compare.py'
      - 'tools/run-minipc-v3-a-four-candidate-compare.ps1'
      - 'paper_evaluator/successor_coin_entry_evidence_v1.py'
      - 'tests/test_successor_coin_entry_evidence_v1.py'
      - '.github/workflows/v2r4-pr-validation.yml'

permissions:
  contents: read

# Cancel superseded runs for the same PR only. Keep manual repair/validation
# dispatches independent, and never skip the final PR-head checks.
concurrency:
  group: v2r4-pr-validation-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Detect V2R4 implementation candidate
        id: implementation
        shell: bash
        run: |
          if test -f paper_evaluator/v2r4_trigger_contract.py && test -f paper_evaluator/v2r4_wait_runtime.py; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "V2R4_IMPLEMENTATION_PRESENT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "V2R4_CONTRACT_ONLY_NO_IMPLEMENTATION_TO_VALIDATE"
          fi


      - name: Compile V2R4 Python sources
        if: steps.implementation.outputs.present == 'true'
        run: |
          python -m py_compile \
            paper_evaluator/evaluate.py \
            paper_context.py \
            paper_evaluator/revalidate.py \
            paper_evaluator/v2r4_trigger_contract.py \
            paper_evaluator/v2r4_trigger_plan.py \
            paper_evaluator/v2r4_wait_watcher.py \
            market_data/kraken_public_budget.py \
            market_data/rest.py \
            tools/minipc-kraken-universe-feed.py \
            paper_evaluator/v2r4_wait_runtime.py \
            paper_evaluator/v2r4_precandidate_discovery.py \
            paper_evaluator/v2r4_precandidate_watcher.py \
            paper_evaluator/v2r4_ws_shadow_watcher.py \
            paper_evaluator/v2r4_local_recheck.py \
            paper_evaluator/successor_coin_entry_evidence_v1.py \
            paper_evaluator/v3_entry_handoff_probe.py \
            paper_evaluator/v3_one_shot_model_compare.py \
            paper_evaluator/v3_bounded_four_candidate_compare.py \
            paper_evaluator/v3_second_leg_policy_candidate_v1.py
          python -m py_compile tools/v2r4-readonly-decision-funnel.py
          python -m py_compile tools/v2r4_cpu_versioned_release_contract.py
          python -m py_compile paper_evaluator/v3_extended_reentry_review_v1.py

      - name: Run V2R4 unit tests
        if: steps.implementation.outputs.present == 'true'
        run: |
          python -m unittest \
            tests.test_v2r4_trigger_contract \
            tests.test_v2r4_trigger_plan \
            tests.test_v2r4_precandidate_discovery \
            tests.test_v2r4_precandidate_watcher \
            tests.test_v2r4_ws_shadow_watcher \
            tests.test_v2r4_ws_shadow_file_access \
            tests.test_v2r4_tradability_policy \
            tests.test_v2r4_evaluator_watch_conditions \
            tests.test_v2r4_evaluator_contract \
            tests.test_v2r4_local_recheck \
            tests.test_kraken_public_budget \
            tests.test_kraken_paper_context_budget \
            tests.test_v2r4_wait_runtime \
            tests.test_v2r4_paper_activation_runtime \
            tests.test_v2r4_cache_scale \
            tests.test_v2r4_cpu_versioned_release_contract \
            tests.test_v2r4_paper_cloudsync_v3_fence \
            tests.test_successor_coin_entry_evidence_v1 \
            tests.test_v2r4_v3_entry_lineage_contract \
            tests.test_v2r4_v3_entry_handoff_probe \
            tests.test_v2r4_v3_one_shot_model_compare \
            tests.test_v3_bounded_four_candidate_compare \
            tests.test_v2r4_readonly_decision_funnel \
            tests.test_v3_second_leg_policy_candidate_v1 \
            tests.test_v2r4_v3_extended_reentry_review \
            -v

      - name: V3 PRE-CAS offline host BUY and REJECT original journal witness regression
        run: |
          # Pure synthetic fixtures; network socket/HTTP blocked in source.
          # No services, real API, tasks, Cloud POST, CAS or live Paper.
          python -m unittest tests.test_v3_paper_precas_originalhost_offline_witness_v1 -v

      - name: V3 isolated synthetic Cloud sandbox provenance and offline preview regression
        run: |
          # Existing job; no Edge deployment, no credentials, no network for sandbox tests.
          python -m unittest tests.test_v3_paper_precas_synthetic_cloud_sandbox_v1 -v

      - name: One bounded live Kraken EUR coin-entry input smoke (research only)
        if: steps.implementation.outputs.present == 'true'
        run: |
          # Exactly three public OHLC requests plus one public Ticker.
          # No OpenAI API key, no BUY classification, no orders, no persistence.
          python -m paper_evaluator.v3_entry_handoff_probe \
            --pair XBT/EUR --altname XBTEUR --require-entry-input-ready

      - name: Validate isolated Mini-PC one-shot launcher syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/run-minipc-v3-entry-model-compare.ps1",
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Output "V3_ONE_SHOT_LAUNCHER_PARSE_PASS"
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/run-minipc-v3-a-four-candidate-compare.ps1",
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Output "V3_FOUR_CASE_BATCH_LAUNCHER_PARSE_PASS"

      - name: Offline Supervisor source-rate-only policy tests
        if: steps.implementation.outputs.present == 'true'
        shell: pwsh
        run: |
          ./tests/test_minipc_supervisor_rate_only.ps1
          ./tests/test_pr332_cloudsync_originalhost_one_shot.ps1
          ./tests/test_v3_originalhost_norearm_stop_only.ps1

      - name: Harmless live Kraken WAIT watcher smoke
        if: steps.implementation.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          now=datetime.now(timezone.utc)
          plan={
            "schema_version":1,
            "candidate_id":"V2R4-SYNTHETIC-SMOKE",
            "pair":"BTC/EUR",
            "altname":"XXBTZEUR",
            "created_at_utc":now.isoformat().replace("+00:00","Z"),
            "expires_at_utc":(now+timedelta(minutes=10)).isoformat().replace("+00:00","Z"),
            "logic":"ALL",
            "conditions":[{"metric":"spread_pct","op":"<=","value":100.0}],
            "on_match":"FRESH_PAPER_RECHECK_ONLY",
            "paper_only":True
          }
          open("/tmp/v2r4-plan.json","w").write(json.dumps(plan))
          PY
          python paper_evaluator/v2r4_wait_watcher.py /tmp/v2r4-plan.json --once --receipt-dir /tmp/v2r4-receipts
          test -n "$(find /tmp/v2r4-receipts -type f -name '*.json' -print -quit)"
          python - <<'PY'
          import json,glob
          p=glob.glob("/tmp/v2r4-receipts/*.json")[0]
          x=json.load(open(p))
          assert x["matched"] is True
          assert x["next_action"]=="FRESH_PAPER_RECHECK_ONLY"
          assert x["real_money_actions_enabled"] is False
          print("WAIT_WATCHER_SMOKE_OK",p)
          PY

      - name: Synthetic WS-snapshot shadow runtime smoke
        if: steps.implementation.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc)
          snap={
            "schema_version":1,
            "kind":"MINIPC_KRAKEN_EUR_TICKER_LATEST_V1",
            "written_at_utc":now.isoformat().replace("+00:00","Z"),
            "universe_sha256":"synthetic",
            "pair_count":1,
            "observed_pair_count":1,
            "pairs":{
              "BTC/EUR":{
                "symbol":"BTC/EUR",
                "exchange_at_utc":now.isoformat().replace("+00:00","Z"),
                "received_at_utc":now.isoformat().replace("+00:00","Z"),
                "bid_eur":50000.0,
                "ask_eur":50001.0,
                "last_eur":50000.5,
                "spread_pct":0.002,
                "volume24_base":100.0,
                "vwap24_eur":50000.0,
                "turnover24_est_eur":5000000.0
              }
            }
          }
          open("/tmp/v2r4-ws-snapshot.json","w").write(json.dumps(snap))
          PY
          python paper_evaluator/v2r4_ws_shadow_watcher.py \
            --snapshot /tmp/v2r4-ws-snapshot.json \
            --state /tmp/v2r4-ws/state.json \
            --event-dir /tmp/v2r4-ws/events \
            --ledger /tmp/v2r4-ws/ledger.jsonl \
            --heartbeat /tmp/v2r4-ws/heartbeat.json \
            --once
          python - <<'PY'
          import json
          h=json.load(open("/tmp/v2r4-ws/heartbeat.json"))
          assert h["kind"]=="V2R4_WS_SHADOW_HEARTBEAT_V1"
          assert h["status"]=="HEALTHY"
          assert h["strategy_action"]=="NONE_SHADOW_ONLY"
          assert h["real_money_actions"] is False
          print("WS_SHADOW_SYNTHETIC_OK")
          PY
          rm -rf /tmp/v2r4-ws-bounded
          python paper_evaluator/v2r4_ws_shadow_watcher.py \
            --snapshot /tmp/v2r4-ws-snapshot.json \
            --state /tmp/v2r4-ws-bounded/state.json \
            --event-dir /tmp/v2r4-ws-bounded/events \
            --ledger /tmp/v2r4-ws-bounded/ledger.jsonl \
            --heartbeat /tmp/v2r4-ws-bounded/heartbeat.json \
            --poll-seconds 0.5 \
            --max-runtime-seconds 3 \
            --state-flush-seconds 5
          python - <<'PY'
          import json
          s=json.load(open("/tmp/v2r4-ws-bounded/state.json"))
          lines=[x for x in open("/tmp/v2r4-ws-bounded/ledger.jsonl") if x.strip()]
          assert s["counters"]["snapshots_processed"] == 1
          assert s["counters"]["duplicates_skipped"] >= 1
          assert len(lines) == 1, lines
          print("WS_SHADOW_BOUNDED_PERSISTENCE_OK")
          PY

      - name: Broad Kraken EUR pre-candidate discovery smoke
        if: steps.implementation.outputs.present == 'true'
        run: |
          python paper_evaluator/v2r4_precandidate_watcher.py             --once             --state /tmp/v2r4-pre/state.json             --event-dir /tmp/v2r4-pre/events             --max-depth-checks 2             --cooldown-seconds 0
          test -s /tmp/v2r4-pre/state.json
          echo PRE_CANDIDATE_SMOKE_OK
