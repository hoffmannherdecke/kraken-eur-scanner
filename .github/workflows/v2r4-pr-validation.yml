name: V2R4 PR validation

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to validate'
        required: true
        type: string
  pull_request:
    paths:
      - 'paper_evaluator/evaluate.py'
      - 'paper_evaluator/revalidate.py'
      - 'paper_evaluator/v2r4_*.py'
      - 'research/v2r4/**'
      - 'tests/test_v2r4_*.py'
      - '.github/workflows/v2r4-pr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile V2R4 Python sources
        run: |
          python -m py_compile \
            paper_evaluator/evaluate.py \
            paper_evaluator/revalidate.py \
            paper_evaluator/v2r4_trigger_contract.py \
            paper_evaluator/v2r4_trigger_plan.py \
            paper_evaluator/v2r4_wait_watcher.py \
            paper_evaluator/v2r4_wait_runtime.py \
            paper_evaluator/v2r4_precandidate_discovery.py \
            paper_evaluator/v2r4_precandidate_watcher.py \
            paper_evaluator/v2r4_ws_shadow_watcher.py \
            paper_evaluator/v2r4_local_recheck.py

      - name: Run V2R4 unit tests
        run: |
          python -m unittest \
            tests.test_v2r4_trigger_contract \
            tests.test_v2r4_trigger_plan \
            tests.test_v2r4_precandidate_discovery \
            tests.test_v2r4_precandidate_watcher \
            tests.test_v2r4_ws_shadow_watcher \
            tests.test_v2r4_tradability_policy \
            tests.test_v2r4_evaluator_watch_conditions \
            tests.test_v2r4_evaluator_contract \
            tests.test_v2r4_local_recheck \
            tests.test_v2r4_wait_runtime \
            -v

      - name: Harmless live Kraken WAIT watcher smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          now=datetime.now(timezone.utc)
          plan={
            "schema_version":1,
            "candidate_id":"V2R4-SYNTHETIC-SMOKE",
            "pair":"BTC/EUR",
            "altname":"XXBTZEUR",
            "created_at_utc":now.isoformat().replace("+00:00","Z"),
            "expires_at_utc":(now+timedelta(minutes=10)).isoformat().replace("+00:00","Z"),
            "logic":"ALL",
            "conditions":[{"metric":"spread_pct","op":"<=","value":100.0}],
            "on_match":"FRESH_PAPER_RECHECK_ONLY",
            "paper_only":True
          }
          open("/tmp/v2r4-plan.json","w").write(json.dumps(plan))
          PY
          python paper_evaluator/v2r4_wait_watcher.py /tmp/v2r4-plan.json --once --receipt-dir /tmp/v2r4-receipts
          test -n "$(find /tmp/v2r4-receipts -type f -name '*.json' -print -quit)"
          python - <<'PY'
          import json,glob
          p=glob.glob("/tmp/v2r4-receipts/*.json")[0]
          x=json.load(open(p))
          assert x["matched"] is True
          assert x["next_action"]=="FRESH_PAPER_RECHECK_ONLY"
          assert x["real_money_actions_enabled"] is False
          print("WAIT_WATCHER_SMOKE_OK",p)
          PY

      - name: Synthetic WS-snapshot shadow runtime smoke
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc)
          snap={
            "schema_version":1,
            "kind":"MINIPC_KRAKEN_EUR_TICKER_LATEST_V1",
            "written_at_utc":now.isoformat().replace("+00:00","Z"),
            "universe_sha256":"synthetic",
            "pair_count":1,
            "observed_pair_count":1,
            "pairs":{
              "BTC/EUR":{
                "symbol":"BTC/EUR",
                "exchange_at_utc":now.isoformat().replace("+00:00","Z"),
                "received_at_utc":now.isoformat().replace("+00:00","Z"),
                "bid_eur":50000.0,
                "ask_eur":50001.0,
                "last_eur":50000.5,
                "spread_pct":0.002,
                "volume24_base":100.0,
                "vwap24_eur":50000.0,
                "turnover24_est_eur":5000000.0
              }
            }
          }
          open("/tmp/v2r4-ws-snapshot.json","w").write(json.dumps(snap))
          PY
          python paper_evaluator/v2r4_ws_shadow_watcher.py \
            --snapshot /tmp/v2r4-ws-snapshot.json \
            --state /tmp/v2r4-ws/state.json \
            --event-dir /tmp/v2r4-ws/events \
            --ledger /tmp/v2r4-ws/ledger.jsonl \
            --heartbeat /tmp/v2r4-ws/heartbeat.json \
            --once
          python - <<'PY'
          import json
          h=json.load(open("/tmp/v2r4-ws/heartbeat.json"))
          assert h["kind"]=="V2R4_WS_SHADOW_HEARTBEAT_V1"
          assert h["status"]=="HEALTHY"
          assert h["strategy_action"]=="NONE_SHADOW_ONLY"
          assert h["real_money_actions"] is False
          print("WS_SHADOW_SYNTHETIC_OK")
          PY
          rm -rf /tmp/v2r4-ws-bounded
          python paper_evaluator/v2r4_ws_shadow_watcher.py \
            --snapshot /tmp/v2r4-ws-snapshot.json \
            --state /tmp/v2r4-ws-bounded/state.json \
            --event-dir /tmp/v2r4-ws-bounded/events \
            --ledger /tmp/v2r4-ws-bounded/ledger.jsonl \
            --heartbeat /tmp/v2r4-ws-bounded/heartbeat.json \
            --poll-seconds 0.5 \
            --max-runtime-seconds 3 \
            --state-flush-seconds 5
          python - <<'PY'
          import json
          s=json.load(open("/tmp/v2r4-ws-bounded/state.json"))
          lines=[x for x in open("/tmp/v2r4-ws-bounded/ledger.jsonl") if x.strip()]
          assert s["counters"]["snapshots_processed"] == 1
          assert s["counters"]["duplicates_skipped"] >= 1
          assert len(lines) == 1, lines
          print("WS_SHADOW_BOUNDED_PERSISTENCE_OK")
          PY

      - name: Broad Kraken EUR pre-candidate discovery smoke
        run: |
          python paper_evaluator/v2r4_precandidate_watcher.py             --once             --state /tmp/v2r4-pre/state.json             --event-dir /tmp/v2r4-pre/events             --max-depth-checks 2             --cooldown-seconds 0
          test -s /tmp/v2r4-pre/state.json
          echo PRE_CANDIDATE_SMOKE_OK
