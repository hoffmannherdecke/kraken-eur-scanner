name: V2R4 evaluator live paper smoke

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2r4-evaluator-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v7
        with:
          ref: prep/v2r4-fast-trigger-minipc-20260929
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Prepare isolated V2R4 smoke control/spec and live candidate
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "missing OPENAI_API_KEY"; exit 2; }
          cp research/v2r4/paper_strategy_spec_v2r4_proposed.json paper_strategy_spec.json
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          now=datetime.now(timezone.utc)
          started=now-timedelta(minutes=2)
          control={
            "schema_version": 6,
            "enabled": True,
            "test_id": "V2R4-E2E-SMOKE",
            "series_id": "PAPER-V2R4-E2E-SMOKE",
            "strategy_revision": "V2R4-PROPOSED-2026-09-30-PRECANDIDATE",
            "series_started_at_utc": started.isoformat().replace("+00:00","Z"),
            "resumed_at_utc": started.isoformat().replace("+00:00","Z"),
            "reason": "isolated CI smoke only; not persisted",
            "target_completed_paper_trades": 1,
            "real_money_actions_enabled": False
          }
          Path("paper_runtime_control.json").write_text(json.dumps(control,indent=2)+"\n","utf-8")

          q=urllib.parse.urlencode({"pair":"XBTEUR"})
          req=urllib.request.Request("https://api.kraken.com/0/public/Ticker?"+q,headers={"User-Agent":"v2r4-e2e-smoke"})
          with urllib.request.urlopen(req,timeout=20) as r:
            d=json.loads(r.read().decode())
          row=next(iter(d["result"].values()))
          price=float(row["c"][0])

          ts=int(now.timestamp())
          stamp=now.strftime("%Y%m%d-%H%M%S")
          cid=f"{stamp}-BTC-EUR-r0"
          candidate={
            "schema_version":1,
            "kind":"CANONICAL_CANDIDATE_HANDOFF_V1",
            "candidate_id":cid,
            "queue_id":f"0:BTC-EUR:{ts}",
            "source_scanner_run_id":0,
            "event_time_utc":now.isoformat().replace("+00:00","Z"),
            "event_ts":ts,
            "pair":"BTC/EUR",
            "altname":"XBTEUR",
            "action":"REVIEW_ONLY_NOT_ORDER",
            "scanner_candidate":{
              "pair":"BTC/EUR",
              "altname":"XBTEUR",
              "price":price,
              "score":8.0,
              "ret15_live":0.0,
              "ret1h":0.0,
              "ret3h":0.0,
              "ret24h":0.0,
              "volume_ratio_closed":1.0,
              "volume_ratio_live":1.0,
              "late":False,
              "fresh_move_3h":0.0,
              "spread_pct":0.1,
              "turnover24h":1000000000.0
            },
            "scanner_market_context":{
              "schema_version":1,
              "pair":"BTC/EUR",
              "altname":"XBTEUR",
              "sensor_price_eur":price,
              "source":"synthetic_ci_smoke_with_live_kraken_ticker"
            },
            "timing":{
              "candidate_detected_at_utc":now.isoformat().replace("+00:00","Z"),
              "candidate_detected_ts":ts,
              "candidate_snapshot_at_utc":now.isoformat().replace("+00:00","Z"),
              "handoff_written_at_utc":now.isoformat().replace("+00:00","Z"),
              "scan_step_started_at_utc":now.isoformat().replace("+00:00","Z")
            }
          }
          candidate_path=Path("/tmp")/(cid+".json")
          candidate_path.write_text(json.dumps(candidate,indent=2)+"\n","utf-8")
          Path("/tmp/v2r4-candidate-path.txt").write_text(str(candidate_path)+"\n","utf-8")
          print("SMOKE_CANDIDATE",cid,price,candidate_path)
          PY

      - name: Run actual V2R4 evaluator once, isolated and paper-only
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2r4-decisions
          CANDIDATE_PATH="$(cat /tmp/v2r4-candidate-path.txt)"
          python paper_evaluator/evaluate.py "$CANDIDATE_PATH" --out /tmp/v2r4-decisions

      - name: Verify paper-only decision contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json
          files=glob.glob("/tmp/v2r4-decisions/*.json")
          assert len(files)==1, files
          d=json.load(open(files[0]))
          decision=d["decision"]["decision"]
          assert decision in {"BUY_SCOUT","WAIT","REJECT"}
          assert d["real_money_actions_enabled"] is False
          if decision=="WAIT":
              assert d["v2r4_trigger_plan"] is not None
              assert d["v2r4_trigger_plan"]["paper_only"] is True
              assert d["v2r4_trigger_plan"]["on_match"]=="FRESH_PAPER_RECHECK_ONLY"
              assert d["decision"]["watch_conditions"]
          elif decision=="BUY_SCOUT":
              assert d["paper_entry"] is not None
              assert d["paper_entry"]["status"].startswith("SCOUT_FILLED_SIMULATED")
              assert d["paper_entry"]["stage2_plan"]["status"]=="PENDING"
          else:
              assert d["paper_entry"] is None
          print("V2R4_EVALUATOR_LIVE_SMOKE_PASS",json.dumps({
            "decision":decision,
            "pair":d["pair"],
            "real_money_actions_enabled":d["real_money_actions_enabled"],
            "has_trigger_plan":d.get("v2r4_trigger_plan") is not None,
            "has_paper_entry":d.get("paper_entry") is not None,
          },sort_keys=True))
          PY
