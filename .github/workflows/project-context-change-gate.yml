name: Project-wide context before material PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: project-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Mandatory current project sources and honest author review (all PR paths)
        run: |
          python -m unittest tests.test_project_context_change_guard -v
          # Full four-scope context regression, not just a single runner smoke test.
          python -m unittest tests.test_context_before_action -v
          # Existing Mini-PC source contracts now run in this already required check.
          # No Windows host, new runner, schedule or extra workflow is involved.
          python -m unittest tests.test_minipc_reviewed_task_source_contract tests.test_minipc_runner_local_guard_contract tests.test_minipc_runner_bounded_availability_contract -v
          python tools/project_context_change_guard.py --base HEAD^1 --head HEAD --template
          python tools/project_context_change_guard.py --base HEAD^1 --head HEAD --event "$GITHUB_EVENT_PATH"
      - name: Parse every reviewed MINI-PC PowerShell task on hosted CI (source-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath 'tools/minipc_runner_tasks' -Filter '*.ps1' -File)
          # The existing named allowlist test separately blocks unreviewed tasks.
          # Keep parser generic so a later reviewed capability needs no workflow edit.
          if ($files.Count -eq 0 -or $files.Count -gt 32) { throw 'MINIPC_SOURCE_BLOCK: invalid reviewed task inventory' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              throw ('MINIPC_SOURCE_BLOCK: invalid PowerShell syntax: ' + $file.Name)
            }
          }
          Write-Output 'MINIPC_ALL_REVIEWED_TASKS_PARSE_PASS'
