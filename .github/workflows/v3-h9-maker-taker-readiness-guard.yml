name: V3 H9 maker taker readiness guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h9-maker-taker-readiness-v1.json'
      - '.github/workflows/v3-h9-maker-taker-readiness-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate H9 readiness blocker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/v3/h9-maker-taker-readiness-v1.json').read_text('utf-8'))
          assert j['kind']=='V3_H9_MAKER_TAKER_READINESS_V1'
          assert j['status']=='DEFERRED_FILL_DATA_NOT_READY'
          e=j['current_evidence']
          assert e['public_rest_l2_snapshot']=='GREEN_H3_REST_DEPTH'
          assert e['public_ws_book_delta_capture']=='NOT_YET_PROVEN'
          assert e['synchronized_book_and_trade_clock']=='NOT_YET_PROVEN'
          assert e['queue_position_model']=='NOT_AVAILABLE'
          assert e['maker_fill_probability_model']=='NOT_AVAILABLE'
          assert 'queue_position' in j['public_rest_snapshot_is_insufficient_for']
          assert 'maker_fill_probability' in j['public_rest_snapshot_is_insufficient_for']
          assert j['decision_contract_when_later_ready']['choose_route_by_expected_net_edge_not_fee_alone'] is True
          assert j['decision_contract_when_later_ready']['cleanup_taker_cost_must_be_included'] is True
          assert j['bias_guardrails']['threshold_selection_allowed'] is False
          assert j['bias_guardrails']['current_sealed_holdout_open_allowed'] is False
          assert j['runtime_guardrails']['live_order_routing_change_allowed'] is False
          assert j['runtime_guardrails']['private_api_allowed'] is False
          assert j['runtime_guardrails']['orders_allowed'] is False
          assert j['runtime_guardrails']['real_money_actions_allowed'] is False
          assert j['next_gate']=='COMPLETE_H3_BOUNDED_PUBLIC_WS_BOOK_CAPTURE_AND_SYNCHRONIZED_TRADE_PRINT_SMOKE_BEFORE_H9_MODELLING'
          print('V3_H9_READINESS PASS fill-model-blocked/no-orders/no-holdout')
          PY
