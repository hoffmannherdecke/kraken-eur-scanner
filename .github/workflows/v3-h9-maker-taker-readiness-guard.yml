name: V3 H9 maker taker readiness guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h9-maker-taker-readiness-v1.json'
      - 'research/v3/h9-kraken-spot-public-fee-schedule-20261002.json'
      - 'research/v3/h9-book-trade-clock-evidence-20261001T194344Z.json'
      - 'tools/run-minipc-v3-h9-book-trade-clock-smoke.ps1'
      - 'tools/v3-h9-public-book-trade-clock-smoke.py'
      - '.github/workflows/v3-h9-maker-taker-readiness-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate H9 readiness blocker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/v3/h9-maker-taker-readiness-v1.json').read_text('utf-8'))
          assert j['kind']=='V3_H9_MAKER_TAKER_READINESS_V1'
          assert j['status'] in {'DEFERRED_FILL_DATA_NOT_READY','DEFERRED_FILL_MODEL_BOOK_TRADE_CLOCK_SMOKE_PREPARED','DEFERRED_FILL_MODEL_PUBLIC_CLOCK_GREEN_PHYSICAL_AND_MODEL_GATES_PENDING','DEFERRED_FILL_MODEL_PHYSICAL_CLOCK_GREEN_FEE_DEADLINE_QUEUE_GATES_PENDING','DEFERRED_FILL_MODEL_PUBLIC_FEES_VERSIONED_ACCOUNT_TIER_AND_DEADLINE_QUEUE_GATES_PENDING'}
          e=j['current_evidence']
          assert e['public_rest_l2_snapshot']=='GREEN_H3_REST_DEPTH'
          if j['status']=='DEFERRED_FILL_DATA_NOT_READY':
              assert e['public_ws_book_delta_capture']=='NOT_YET_PROVEN'
              assert e['synchronized_book_and_trade_clock']=='NOT_YET_PROVEN'
          else:
              assert e['public_ws_book_delta_capture'] in {
                  'GREEN_H3_CLOUD_CHECKSUM_RECONCILIATION__PHYSICAL_MINIPC_PENDING',
                  'GREEN_H3_CLOUD_AND_PHYSICAL_MINIPC_CHECKSUM_RECONCILIATION'
              }
              assert e['synchronized_book_and_trade_clock'] in {
                  'CLOUD_SMOKE_PREPARED',
                  'GREEN_CLOUD_SAME_CONNECTION_PROTOCOL__PHYSICAL_MINIPC_PENDING',
                  'GREEN_CLOUD_AND_PHYSICAL_MINIPC_SAME_CONNECTION_PROTOCOL'
              }
              if 'physical_book_trade_clock' in e:
                  p=e['physical_book_trade_clock']
                  assert p['trades']>0
                  assert p['safely_aligned_preceding_book_trades']>0
                  assert p['duplicate_trade_ids']==0
                  assert p['out_of_order_trade_ids']==0
                  assert p['book_checksum_fail']==0
          assert e['queue_position_model']=='NOT_AVAILABLE'
          assert e['maker_fill_probability_model']=='NOT_AVAILABLE'
          assert 'queue_position' in j['public_rest_snapshot_is_insufficient_for']
          assert 'maker_fill_probability' in j['public_rest_snapshot_is_insufficient_for']
          assert j['decision_contract_when_later_ready']['choose_route_by_expected_net_edge_not_fee_alone'] is True
          assert j['decision_contract_when_later_ready']['cleanup_taker_cost_must_be_included'] is True
          assert j['bias_guardrails']['threshold_selection_allowed'] is False
          assert j['bias_guardrails']['current_sealed_holdout_open_allowed'] is False
          assert j['runtime_guardrails']['live_order_routing_change_allowed'] is False
          assert j['runtime_guardrails']['private_api_allowed'] is False
          assert j['runtime_guardrails']['orders_allowed'] is False
          assert j['runtime_guardrails']['real_money_actions_allowed'] is False
          if j['status']=='DEFERRED_FILL_DATA_NOT_READY':
              assert j['next_gate']=='COMPLETE_H3_BOUNDED_PUBLIC_WS_BOOK_CAPTURE_AND_SYNCHRONIZED_TRADE_PRINT_SMOKE_BEFORE_H9_MODELLING'
          if j['status']=='DEFERRED_FILL_MODEL_PUBLIC_FEES_VERSIONED_ACCOUNT_TIER_AND_DEADLINE_QUEUE_GATES_PENDING':
              assert e['public_fee_schedule']['status']=='PUBLIC_SCHEDULE_VERSIONED_ACCOUNT_TIER_UNVERIFIED'
              assert e['public_fee_schedule']['account_specific_fee_tier_verified'] is False
              assert j['next_gate']=='VERIFY_ACCOUNT_SPECIFIC_FEE_TIER_THEN_PREREGISTER_DEADLINE_CLEANUP_AND_EXPLICIT_QUEUE_ASSUMPTION_BEFORE_ANY_FILL_MODEL'
          print('V3_H9_READINESS PASS fill-model-blocked/no-orders/no-holdout')
          PY


      - name: Install pinned websocket client for bounded H9 smoke
        run: python -m pip install --disable-pip-version-check --no-input "websockets==15.0.1"

      - name: Cloud H9 same-connection book trade clock smoke
        run: |
          python -m py_compile tools/v3-h9-public-book-trade-clock-smoke.py
          python tools/v3-h9-public-book-trade-clock-smoke.py \
            --symbols BTC/EUR,ETH/EUR,SOL/EUR --depth 10 --seconds 15 \
            --output /tmp/h9-clock.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h9-clock.json").read_text())
          assert j["status"]=="PASS"
          assert j["totals"]["trades"]>0
          assert j["totals"]["aligned_preceding_book_trades"]>0
          assert not j["errors"]
          for s,row in j["per_symbol"].items():
              assert row["book"]["snapshots"]>=1
              assert row["book"]["checksum_fail"]==0
              seq=row["trade_id_sequence"]
              assert seq["duplicates"]==0
              assert seq["out_of_order"]==0
          i=j["interpretation"]
          assert i["same_websocket_connection"] is True
          assert i["book_crc_reconciliation_used"] is True
          assert i["trade_id_is_public_per_book_sequence"] is True
          assert i["queue_position_proven"] is False
          assert i["maker_fill_probability_proven"] is False
          assert i["routing_decision_allowed"] is False
          g=j["guardrails"]
          assert g["active_v2r3_changed"] is False
          assert g["v2r4_changed"] is False
          assert g["orders"] is False
          assert g["real_money_actions"] is False
          print("V3_H9_BOOK_TRADE_CLOCK PASS same-connection/CRC/trade-sequence/no-fill-model")
          print("H9_CLOCK_COMPACT "+json.dumps({
            "checked_at_utc":j["checked_at_utc"],"totals":j["totals"],
            "per_symbol":{s:{
              "book":v["book"],"trades":v["trades"],"trade_id_sequence":v["trade_id_sequence"],
              "clock_join":v["clock_join"]} for s,v in j["per_symbol"].items()}
          },sort_keys=True))
          PY


      - name: Validate persisted H9 cloud clock evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h9-book-trade-clock-evidence-20261001T194344Z.json").read_text())
          assert j["status"]=="PASS"
          assert j["totals"]["trades"]==3
          assert j["totals"]["aligned_preceding_book_trades"]==2
          assert j["per_symbol"]["SOL/EUR"]["clock_join"]["no_book_yet"]==1
          for row in j["per_symbol"].values():
              assert row["book"]["checksum_fail"]==0
              assert row["trade_id_sequence"]["duplicates"]==0
              assert row["trade_id_sequence"]["out_of_order"]==0
          assert j["interpretation"]["no_book_yet_is_valid_missing_join"] is True
          assert j["interpretation"]["queue_position_proven"] is False
          assert j["interpretation"]["maker_fill_probability_proven"] is False
          assert j["interpretation"]["routing_decision_allowed"] is False
          print("V3_H9_PERSISTED_CLOCK PASS sparse-trades/safe-join/no-fill-claim")
          PY


      - name: Validate H9 public fee schedule snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h9-kraken-spot-public-fee-schedule-20261002.json").read_text())
          assert j["status"]=="PUBLIC_SCHEDULE_VERSIONED_ACCOUNT_TIER_UNVERIFIED"
          assert j["public_standard_tiers"][0]["maker_pct"]==0.40
          assert j["public_standard_tiers"][0]["taker_pct"]==0.80
          assert j["public_standard_tiers"][1]["maker_pct"]==0.30
          assert j["public_standard_tiers"][1]["taker_pct"]==0.60
          assert j["representative_execution_pairs"]["checked"]==["BTC/EUR","ETH/EUR","SOL/EUR"]
          assert j["account_specific_state"]["fee_tier_verified"] is False
          assert j["account_specific_state"]["public_schedule_may_not_be_used_to_guess_user_tier"] is True
          assert j["guardrails"]["account_accessed"] is False
          assert j["guardrails"]["orders"] is False
          assert j["guardrails"]["routing_decision_allowed"] is False
          print("V3_H9_PUBLIC_FEES PASS versioned/account-tier-unverified/no-routing")
          PY
