name: V3 H8 on-chain coverage precheck guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h8-onchain-state-precheck-v1.json'
      - 'research/v3/h8-known-at-capture-contract-v1.json'
      - 'tools/v3-h8-prospective-state-capture.py'
      - 'research/v3/h8-prospective-onchain-state-contract-v1.json'
      - 'research/v3/captures/h8-coinmetrics-known-at-*.json'
      - 'research/v3/h8-known-at-two-cycle-review-20261002.json'
      - 'tools/v3-h8-coinmetrics-known-at-capture.py'
      - 'research/source-registry.json'
      - 'tools/v3-h8-coinmetrics-coverage-precheck.py'
      - '.github/workflows/v3-h8-onchain-precheck-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile H8 coverage tool
        run: python -m py_compile tools/v3-h8-coinmetrics-coverage-precheck.py
      - name: Validate H8 preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/v3/h8-onchain-state-precheck-v1.json').read_text('utf-8'))
          assert j['kind']=='V3_H8_ONCHAIN_STATE_PRECHECK_V1'
          assert j['status'] in {'PRECHECK_SOURCE_COVERAGE_ONLY','PRECHECK_COVERAGE_GREEN_KNOWN_AT_PENDING','PRECHECK_CAPTURE_METHOD_PREREGISTERED_LIVE_SMOKE_PENDING','PRECHECK_LIVE_CAPTURE_GREEN_REPEATED_LAG_PENDING','PRECHECK_TWO_EOD_CYCLES_GREEN_PROSPECTIVE_ONLY_STATE_PREREG_PENDING','PROSPECTIVE_ONLY_STATE_CONTRACT_FROZEN_CAPTURE_SMOKE_PENDING','PROSPECTIVE_ONLY_STATE_CAPTURE_GREEN_NOT_SCHEDULED'}
          assert j['point_in_time_contract']['metric_interval_time_is_not_assumed_equal_to_known_at_time'] is True
          assert j['point_in_time_contract']['historical_use_requires_known_at_or_proven_publication_lag'] is True
          assert 'historical_performance_trial' in j['forbidden_before_availability_lag_proven']
          assert j['bias_guardrails']['metric_selection_by_seen_performance_allowed'] is False
          assert j['bias_guardrails']['current_sealed_holdout_open_allowed'] is False
          assert j['runtime_guardrails']['active_v2r3_change_allowed'] is False
          assert j['runtime_guardrails']['orders_allowed'] is False
          assert j['runtime_guardrails']['real_money_actions_allowed'] is False
          if j['status'] in {'PRECHECK_COVERAGE_GREEN_KNOWN_AT_PENDING','PRECHECK_CAPTURE_METHOD_PREREGISTERED_LIVE_SMOKE_PENDING','PRECHECK_LIVE_CAPTURE_GREEN_REPEATED_LAG_PENDING','PRECHECK_TWO_EOD_CYCLES_GREEN_PROSPECTIVE_ONLY_STATE_PREREG_PENDING'}:
              rd=j['coverage_readiness']
              assert rd['audit']=='CI_GREEN_RUN_1'
              assert rd['active_addresses']['count']==4
              assert rd['mvrv']['count']==4
              assert rd['transaction_count']['count']==4
              assert rd['exchange_in_out_flow']['count']==2
              assert rd['new_addresses']['count']==0
              assert rd['sol_target_metric_coverage']=='NONE_IN_CHECKED_GROUPS'
              if j['status']=='PRECHECK_COVERAGE_GREEN_KNOWN_AT_PENDING':
                  assert j['next_gate']=='PROSPECTIVE_COMPACT_CAPTURE_TO_MEASURE_PUBLICATION_LAG_AND_KNOWN_AT_BEFORE_ANY_HISTORICAL_OR_SIGNAL_TRIAL'
              else:
                  assert j['known_at_capture_readiness']['automatic_schedule_enabled'] is False
                  assert j['known_at_capture_readiness']['performance_trial_started'] is False
                  assert j['known_at_capture_readiness']['holdout_opened'] is False
                  if j['status']=='PRECHECK_LIVE_CAPTURE_GREEN_REPEATED_LAG_PENDING':
                      assert j['known_at_capture_readiness']['historical_known_at_claim_allowed'] is False
                      assert j['known_at_capture_readiness']['first_live_capture']['status']=='PASS'
                      assert j['known_at_capture_readiness']['first_live_capture']['distinct_eod_cycles_observed']==1
                      assert j['next_gate']=='BOUNDED_REPEATED_PROSPECTIVE_CAPTURE_ACROSS_AT_LEAST_TWO_DISTINCT_EOD_CYCLES_BEFORE_HISTORICAL_OR_SIGNAL_TRIAL'
          print('V3_H8_PREREG PASS coverage-only/known-at-blocked/no-holdout')
          PY
      - name: Real public Coin Metrics community coverage audit
        run: |
          python tools/v3-h8-coinmetrics-coverage-precheck.py \
            --assets btc,eth,sol,xrp,ada \
            --output /tmp/h8-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/h8-coverage.json').read_text())
          assert j['status']=='PASS'
          assert len(j['returned_assets']) > 0
          assert j['coverage']['active_addresses']['count'] > 0 or j['coverage']['transaction_count']['count'] > 0
          assert j['point_in_time_interpretation']['historical_performance_trial_allowed'] is False
          assert j['point_in_time_interpretation']['metric_interval_time_must_not_be_treated_as_publication_time'] is True
          assert j['guardrails']['api_key_used'] is False
          assert j['guardrails']['raw_history_downloaded'] is False
          assert j['guardrails']['performance_trial_started'] is False
          assert j['guardrails']['holdout_opened'] is False
          assert j['guardrails']['orders'] is False
          print('V3_H8_COVERAGE PASS public/no-key/no-history')
          print(json.dumps({'returned_assets':j['returned_assets'],'coverage':j['coverage']},sort_keys=True))
          PY
      - name: Validate source registry
        run: python tools/validate-source-registry.py


      - name: Validate H8 known-at capture contract
        run: |
          python -m py_compile tools/v3-h8-coinmetrics-known-at-capture.py
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h8-known-at-capture-contract-v1.json").read_text("utf-8"))
          assert j["kind"]=="V3_H8_COINMETRICS_KNOWN_AT_CAPTURE_CONTRACT_V1"
          assert j["status"]=="PREREGISTERED_CAPTURE_METHOD_NOT_SIGNAL_TRIAL"
          assert j["fixed_assets"]==["btc","eth","sol","xrp","ada"]
          assert j["fixed_metrics"]==["AdrActCnt","TxCnt","CapMVRVCur","FlowInExUSD","FlowOutExUSD","AssetEODCompletionTime"]
          assert j["semantic_contract"]["first_seen_requires_prospective_capture"] is True
          assert j["repeated_capture_gate"]["minimum_distinct_eod_cycles"]==2
          assert j["repeated_capture_gate"]["automatic_schedule_enabled_by_this_contract"] is False
          assert j["repeated_capture_gate"]["raw_endless_archive_allowed"] is False
          assert j["guardrails"]["active_v2r3_change_allowed"] is False
          assert j["guardrails"]["v2r4_change_allowed"] is False
          assert j["guardrails"]["orders"] is False
          assert j["guardrails"]["real_money_actions"] is False
          assert j["guardrails"]["sealed_2026h1_holdout_open_allowed"] is False
          print("V3_H8_CAPTURE_CONTRACT PASS prospective/bounded/no-signal/no-holdout")
          PY

      - name: One live public H8 known-at capture smoke
        run: |
          python tools/v3-h8-coinmetrics-known-at-capture.py --assets btc,eth,sol,xrp,ada --output /tmp/h8-known-at.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h8-known-at.json").read_text())
          assert j["status"]=="PASS"
          assert j["returned_asset_count"] > 0
          k=j["known_at_interpretation"]
          assert k["observation_time_is_publication_time"] is False
          assert k["retrieved_at_is_safe_known_at_upper_bound"] is True
          assert k["asset_eod_completion_is_exact_per_metric_publication_time"] is False
          assert k["single_capture_proves_historical_known_at"] is False
          assert k["repeated_prospective_capture_required_for_first_seen_lag"] is True
          g=j["guardrails"]
          assert g["api_key_used"] is False
          assert g["historical_backfill_performed"] is False
          assert g["performance_trial_started"] is False
          assert g["holdout_opened"] is False
          assert g["active_v2r3_changed"] is False
          assert g["v2r4_changed"] is False
          assert g["orders"] is False
          assert g["real_money_actions"] is False
          print("V3_H8_KNOWN_AT_LIVE_CAPTURE PASS public/first-seen-upper-bound/no-history")
          print("H8_CAPTURE_COMPACT "+json.dumps({
            "request_started_at_utc":j["request_started_at_utc"],
            "request_finished_at_utc":j["request_finished_at_utc"],
            "returned_asset_count":j["returned_asset_count"],
            "rows":[{"asset":r["asset"],"status":r["status"],"retrieved_at_utc":r["retrieved_at_utc"],
              "observation_time_utc":r.get("observation_time_utc"),
              "provider_asset_eod_completion_utc":r.get("provider_asset_eod_completion_utc"),
              "returned_metric_ids":sorted((r.get("metrics") or {}).keys())} for r in j["rows"]]
          },sort_keys=True))
          PY


      - name: Validate persisted first H8 prospective capture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/v3/captures/h8-coinmetrics-known-at-20261001T192024Z.json")
          j=json.loads(p.read_text("utf-8"))
          assert j["kind"]=="V3_H8_COINMETRICS_PROSPECTIVE_KNOWN_AT_CAPTURE_V1"
          assert j["status"]=="PASS"
          assert j["request_started_at_utc"]=="2026-10-01T19:20:24.691857Z"
          by={r["asset"]:r for r in j["rows"]}
          assert by["sol"]["status"]=="NO_ROW"
          for asset in ["btc","eth","xrp","ada"]:
              assert by[asset]["status"]=="ROW_RETURNED"
              assert by[asset]["observation_time_utc"]=="2026-09-30T00:00:00Z"
          assert by["eth"]["provider_asset_eod_completion_utc"]=="2026-10-01T03:22:28Z"
          assert by["eth"]["metric_status_times_if_returned"]["FlowInExUSD"] > "2026-10-01T03:22:28Z"
          assert by["eth"]["metric_status_times_if_returned"]["FlowOutExUSD"] > "2026-10-01T03:22:28Z"
          assert j["known_at_interpretation"]["single_capture_proves_historical_known_at"] is False
          assert j["guardrails"]["holdout_opened"] is False
          assert j["guardrails"]["active_v2r3_changed"] is False
          assert j["guardrails"]["v2r4_changed"] is False
          assert j["guardrails"]["orders"] is False
          print("V3_H8_CAPTURE_PERSISTENCE PASS first-cycle/versioned/revision-evidence")
          PY


      - name: Validate H8 two-cycle known-at review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("research/v3/captures/h8-coinmetrics-known-at-20261001T192024Z.json").read_text())
          b=json.loads(Path("research/v3/captures/h8-coinmetrics-known-at-20261002T045719Z.json").read_text())
          r=json.loads(Path("research/v3/h8-known-at-two-cycle-review-20261002.json").read_text())
          assert a["status"]=="PASS" and b["status"]=="PASS"
          assert {x["observation_time_utc"] for x in a["rows"] if x["status"]=="ROW_RETURNED"}=={"2026-09-30T00:00:00Z"}
          assert {x["observation_time_utc"] for x in b["rows"] if x["status"]=="ROW_RETURNED"}=={"2026-10-01T00:00:00Z"}
          assert r["status"]=="PASS_MINIMUM_TWO_DISTINCT_EOD_CYCLES_PROSPECTIVE_ONLY"
          e=r["eligibility"]
          assert e["minimum_distinct_eod_cycles_met"] is True
          assert e["prospective_retrieved_at_upper_bound_state_capture_allowed"] is True
          assert e["historical_known_at_reconstruction_allowed"] is False
          assert e["historical_backfill_performance_trial_allowed"] is False
          assert e["asset_eod_completion_as_exact_metric_finality_allowed"] is False
          assert e["threshold_selection_allowed"] is False
          assert e["sealed_2026h1_holdout_open_allowed"] is False
          print("V3_H8_TWO_CYCLE_REVIEW PASS prospective-only/historical-blocked/no-holdout")
          PY


      - name: Validate H8 prospective-only state contract
        run: |
          python -m py_compile tools/v3-h8-prospective-state-capture.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/v3/h8-prospective-onchain-state-contract-v1.json").read_text())
          assert c["status"]=="FROZEN_PREREGISTERED_NOT_SCHEDULED"
          assert c["fixed_assets"]==["btc","eth","sol","xrp","ada"]
          assert c["capture_semantics"]["retrieved_at_is_known_at_upper_bound"] is True
          assert c["capture_semantics"]["historical_backfill_for_state_forbidden"] is True
          assert "future outcome join" in c["prohibited"]
          assert "threshold selection" in c["prohibited"]
          assert c["runtime_guardrails"]["automatic_schedule_enabled"] is False
          assert c["runtime_guardrails"]["orders_allowed"] is False
          assert c["runtime_guardrails"]["real_money_actions_allowed"] is False
          print("V3_H8_PROSPECTIVE_STATE_CONTRACT PASS fixed/no-history/no-outcomes/no-schedule")
          PY

      - name: One bounded H8 prospective state capture smoke
        run: |
          python tools/v3-h8-prospective-state-capture.py --output /tmp/h8-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h8-state.json").read_text())
          assert j["status"]=="PASS"
          assert len(j["rows"])==5
          assert j["interpretation"]["retrieved_at_is_known_at_upper_bound"] is True
          assert j["interpretation"]["historical_known_at_reconstruction_performed"] is False
          assert j["interpretation"]["future_outcomes_joined"] is False
          assert j["interpretation"]["thresholds_selected"] is False
          assert j["guardrails"]["automatic_schedule_enabled"] is False
          assert j["guardrails"]["holdout_opened"] is False
          assert j["guardrails"]["orders"] is False
          assert j["guardrails"]["real_money_actions"] is False
          print("V3_H8_PROSPECTIVE_STATE_CAPTURE PASS bounded/no-outcomes/no-schedule")
          PY
