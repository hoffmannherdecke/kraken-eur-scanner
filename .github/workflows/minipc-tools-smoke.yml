name: MINI-PC tools smoke

'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/minipc-*.ps1'
      - 'tools/minipc_runner_tasks/file_access_bounded.ps1'
      - 'tools/minipc_runner_tasks/host_state_readonly.ps1'
      - 'tools/minipc_runner_guard/pre_job.ps1'
      - 'tools/minipc_runner_guard/local_file_handoff.ps1'
      - 'tests/test_minipc_user_handoff_contract.py'
      - 'tools/minipc_runner_guard/runner_readiness.py'
      - 'tests/test_minipc_runner_readiness.py'
      - 'tools/*minipc*.py'
      - 'tools/v2r4-shadow-cloud-sync.py'
      - 'tools/v2r4-ws-shadow-*.py'
      - 'tools/v3-h3-shadow-runtime.py'
      - 'tools/v3_h3_shadow_common.py'
      - 'tools/v3-h3-kraken-ws-book-reconciliation-smoke.py'
      - 'tools/install-minipc-v3-h3-shadow-001.ps1'
      - '.github/workflows/minipc-tools-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/minipc-*.ps1'
      - 'tools/minipc_runner_tasks/file_access_bounded.ps1'
      - 'tools/minipc_runner_tasks/host_state_readonly.ps1'
      - 'tools/minipc_runner_guard/pre_job.ps1'
      - 'tools/minipc_runner_guard/local_file_handoff.ps1'
      - 'tests/test_minipc_user_handoff_contract.py'
      - 'tools/minipc_runner_guard/runner_readiness.py'
      - 'tests/test_minipc_runner_readiness.py'
      - 'tools/install-minipc-baseline-tasks.ps1'
      - 'tools/uninstall-minipc-baseline-tasks.ps1'
      - 'tools/minipc-altrady-poller.py'
      - 'tools/minipc-altrady-live-alert-proof.py'
      - 'tools/minipc-kraken-universe-feed.py'
      - 'tools/v2r4-ws-shadow-evidence.py'
      - 'tools/v2r4-ws-shadow-outcome-tracker.py'
      - 'tools/v2r4-shadow-cloud-sync.py'
      - 'tools/minipc-status-sync.py'
      - 'tools/v3-h3-shadow-runtime.py'
      - 'tools/v3_h3_shadow_common.py'
      - 'tools/v3-h3-kraken-ws-book-reconciliation-smoke.py'
      - 'tools/install-minipc-v3-h3-shadow-001.ps1'
      - 'tools/minipc-github-cadence-guard.py'
      - 'tools/minipc-github-dispatch-secret-prep.ps1'
      - 'tools/install-minipc-github-cadence-guard.ps1'
      - 'tools/uninstall-minipc-github-cadence-guard.ps1'
      - 'tools/minipc-runtime-supervisor.ps1'
      - 'tools/install-minipc-runtime-supervisor.ps1'
      - 'tools/minipc-runtime-supervisor-selfheal-smoke.ps1'
      - 'tools/minipc-watchdog-effectiveness-smoke.ps1'
      - 'tools/minipc-secret-hygiene-audit.ps1'
      - 'tools/minipc-post-fix-verification.ps1'
      - 'tools/paper-runtime-reconciliation-audit.py'
      - 'tools/install-minipc-status-sync.ps1'
      - 'tools/uninstall-minipc-status-sync.ps1'
      - 'tools/install-minipc-v2r4-shadow-cloud-sync.ps1'
      - 'tools/uninstall-minipc-v2r4-shadow-cloud-sync.ps1'
      - 'tools/install-minipc-v2r4-shadow-outcomes.ps1'
      - 'tools/uninstall-minipc-v2r4-shadow-outcomes.ps1'
      - 'tools/minipc-v2r4-ws-shadow-smoke.ps1'
      - 'tools/minipc-v2r4-shadow-postboot-resilience.ps1'
      - 'tools/minipc-v2r4-shadow-resilience-bundle.ps1'
      - 'tools/minipc-v2r4-shadow-resilience-resume.ps1'
      - 'tools/install-minipc-v2r4-ws-shadow.ps1'
      - 'tools/uninstall-minipc-v2r4-ws-shadow.ps1'
      - 'tools/install-minipc-kraken-universe-feed.ps1'
      - 'tools/uninstall-minipc-kraken-universe-feed.ps1'
      - '.github/workflows/minipc-tools-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Parse Python transport tools
        shell: powershell
        run: |
          python -m py_compile .\tools\minipc-altrady-poller.py .\tools\minipc-altrady-live-alert-proof.py .\tools\minipc-altrady-e2e-smoke.py .\tools\minipc-kraken-universe-feed.py .\tools\v2r4-ws-shadow-evidence.py .\tools\v2r4-ws-shadow-outcome-tracker.py .\tools\v2r4-shadow-cloud-sync.py .\tools\minipc-status-sync.py .\tools\minipc-github-cadence-guard.py .\tools\paper-runtime-reconciliation-audit.py .\tools\v2r4-paper-local-runtime.py .\tools\v2r4-paper-cloud-sync.py .\tools\v2r4-paper-alerts.py .\tools\v3-h3-shadow-runtime.py .\tools\v3_h3_shadow_common.py .\tools\v3-h3-kraken-ws-book-reconciliation-smoke.py
          python -m py_compile tools/minipc-ws-shadow-crash-footer.py tools/minipc-ws-shadow-last-eur-fix-builder.py tests/test_minipc_ws_shadow_crash_capture.py tests/test_minipc_ws_shadow_last_eur_fix_builder.py
          python -m unittest tests.test_minipc_ws_shadow_crash_capture tests.test_minipc_ws_shadow_last_eur_fix_builder -v
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_WS_SOURCE_GUARD_TEST_FAILED' }
          python -m py_compile tools/minipc-ws-shadow-pr300-io-guard-builder.py tests/test_minipc_ws_shadow_pr300_guard_builder.py
          if ($LASTEXITCODE -ne 0) { throw 'PR300_BUILDER_PARSE_FAILED' }
          python -m unittest tests.test_minipc_ws_shadow_pr300_guard_builder -v
          if ($LASTEXITCODE -ne 0) { throw 'PR300_BUILDER_PARITY_TEST_FAILED' }
          if ($LASTEXITCODE -ne 0) { throw 'WS_SHADOW_CAPTURE_REGRESSION_FAILED' }
          python -m unittest tests.test_v2r4_ws_shadow_file_access -v
          if ($LASTEXITCODE -ne 0) { throw 'WS_SHADOW_ACCESS_REGRESSION_FAILED' }
          if ($LASTEXITCODE -ne 0) { throw 'WS_SHADOW_FIX_REGRESSIONS_FAILED' }
          python .\tools\minipc-github-cadence-guard.py --self-test
          Write-Host 'PYTHON_TRANSPORT_PARSE_OK'

      - name: Test GitHub runner readiness and fail-closed export gating
        shell: powershell
        run: |
          python -m py_compile tools/minipc_runner_guard/runner_readiness.py tests/test_minipc_runner_readiness.py
          if ($LASTEXITCODE -ne 0) { throw 'MINIPC_STATUS_PYTHON_PARSE_FAILED' }
          python -m unittest tests.test_minipc_runner_readiness -v
          if ($LASTEXITCODE -ne 0) { throw 'MINIPC_RUNNER_STATUS_AND_HANDOFF_TEST_FAILED' }

      - name: Validate local selected-file SendTo handoff and security contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools/minipc_runner_guard/local_file_handoff.ps1'
          $tokens=$null;$parseErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$parseErrors)
          if(@($parseErrors).Count -gt 0){throw ('MINIPC_USER_HANDOFF_POWERSHELL_PARSE_FAILED:'+@($parseErrors)[0].Message)}
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$parseErrors)
          foreach($name in @('Assert-SafeContent','Assert-SafeFileName')){
            $fn=$ast.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -ceq $name},$true)
            if(-not $fn){throw ('MINIPC_USER_HANDOFF_MISSING_FUNCTION:'+$name)}
            . ([ScriptBlock]::Create($fn.Extent.Text))
          }
          Assert-SafeContent ([Text.Encoding]::UTF8.GetBytes('neutral test'))
          Assert-SafeFileName 'neutral.json'
          $reject=0
          foreach($payload in @('api_key=example','password=example','token=example')){
            try {Assert-SafeContent ([Text.Encoding]::UTF8.GetBytes($payload))}catch{$reject++}
          }
          if($reject -ne 3){throw 'MINIPC_USER_HANDOFF_SENSITIVE_NEGATIVE_FAILED'}
          try {Assert-SafeFileName 'private-key.pem';throw 'MINIPC_USER_HANDOFF_NAME_NEGATIVE_FAILED'} catch {
            if($_.Exception.Message -eq 'MINIPC_USER_HANDOFF_NAME_NEGATIVE_FAILED'){throw}
          }
          python -m unittest tests.test_minipc_user_handoff_contract -v
          if($LASTEXITCODE -ne 0){throw 'MINIPC_USER_HANDOFF_CONTRACT_FAILED'}
          Write-Output 'MINIPC_USER_HANDOFF_SOURCE_AND_SYNTAX_PASS'

      - name: Validate generic bounded read-only host snapshot source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/minipc_runner_tasks/host_state_readonly.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'HOST_SNAPSHOT_PARSE_FAILED'}
          $text=Get-Content -LiteralPath $path -Raw
          if(-not $text.StartsWith('# MINIPC_REVIEWED_TASK_V1')){throw 'HOST_SNAPSHOT_BAD_HEADER'}
          foreach($marker in @(
            'CryptoSupportSvc','OBSERVED_BOUNDED','PARTIAL_LIMIT','UNAVAILABLE',
            'independent_custody_verified=$false','complete_writer_inventory_verified=$false',
            'host_recovery_authorized=$false','changed_host_state=$false',
            'Get-CimInstance Win32_Process','Get-ScheduledTask','Export-ScheduledTask',
            'Get-CimInstance Win32_Service','AddSeconds(35)'
          )){
            if(-not $text.Contains($marker)){throw "HOST_SNAPSHOT_MISSING:$marker"}
          }
          $prohibited=@(
            'Set-Service','Stop-Service','Start-Service','Stop-Process','Start-Process',
            'Start-ScheduledTask','Stop-ScheduledTask','Register-ScheduledTask',
            'Unregister-ScheduledTask','Set-ScheduledTask','Disable-ScheduledTask',
            'Enable-ScheduledTask','Invoke-Expression','Invoke-RestMethod',
            'Invoke-WebRequest','Set-Content','Out-File','Copy-Item','Move-Item',
            'Remove-Item','New-Item','Set-Acl','icacls'
          )
          $commands=@($ast.FindAll({
            param($node) $node -is [Management.Automation.Language.CommandAst]
          },$true) | ForEach-Object {$_.GetCommandName()})
          foreach($name in $commands){
            if($name -cin $prohibited){throw "HOST_SNAPSHOT_PROHIBITED_VERB:$name"}
          }
          foreach($noLeak in @('.CommandLine','.ExecutablePath','.EnvironmentVariables',
            'Get-Content','Get-ChildItem','TaskXml=')){
            if($text.Contains($noLeak)){throw "HOST_SNAPSHOT_SENSITIVE_FIELD:$noLeak"}
          }
          $functionAst=$ast.Find({
            param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -ceq 'Sha256-Text'
          },$true)
          if(-not $functionAst){throw 'HOST_SNAPSHOT_SHA_FUNCTION_MISSING'}
          . ([ScriptBlock]::Create($functionAst.Extent.Text))
          if((Sha256-Text 'abc') -cne 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'){
            throw 'HOST_SNAPSHOT_SHA_NEGATIVE'
          }
          Write-Output 'MINIPC_GENERIC_HOST_SNAPSHOT_SOURCE_AND_NEGATIVE_GATES_PASS'

      - name: Validate typed Mini-PC file request syntax and fail-closed source contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($p in @('tools/minipc_runner_tasks/file_access_bounded.ps1','tools/minipc_runner_guard/pre_job.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){throw "MINIPC_FILE_ACCESS_PARSE_DENIED:$p"}
          }
          $task=Get-Content -LiteralPath 'tools/minipc_runner_tasks/file_access_bounded.ps1' -Raw
          $guard=Get-Content -LiteralPath 'tools/minipc_runner_guard/pre_job.ps1' -Raw
          foreach($marker in @('MINIPC_REVIEWED_TASK_ACK_V1','file_access_bounded','REPARSE_ROOT','REPARSE_FILE','HASH_MISMATCH','AddSeconds(75)','EnumerateFileSystemInfos()','MISTRAL','C:\Users\ADMIN\Downloads')){
            if(-not $task.Contains($marker)){throw "MINIPC_FILE_ACCESS_MISSING:$marker"}
          }
          foreach($marker in @('MINIPC_FILE_V1','MINIPC_TASK_V1','expired_request','wrong_connector')){
            if(-not $guard.Contains($marker)){throw "MINIPC_FILE_GUARD_MISSING:$marker"}
          }
          $syntax='^MINIPC_FILE_V1 \| ([a-f0-9]{40}) \| (SEARCH|EXPORT) \| (TRADING|DOWNLOADS|MISTRAL|V3Q1|V3Q2|V3Q3|V3QR|V3P680|V3P681|V3P682|V3RS1|V3RS2) \| ([A-Za-z0-9_.-]{3,64}|[A-Za-z0-9_-]{4,512})(?: \| ([a-f0-9]{64}))?$'
          $pin='a'*40;$digest='b'*64
          foreach($valid in @("MINIPC_FILE_V1 | $pin | SEARCH | MISTRAL | fixture","MINIPC_FILE_V1 | $pin | EXPORT | DOWNLOADS | Zml4dHVyZS50eHQ | $digest")){
            if($valid -cnotmatch $syntax){throw 'MINIPC_FILE_POSITIVE_SYNTAX_DENIED'}
          }
          foreach($invalid in @("MINIPC_FILE_V1 | $pin | SEARCH | C: | fixture","MINIPC_FILE_V1 | $pin | SEARCH | TRADING | ..\secret","MINIPC_FILE_V1 | $pin | SEARCH | M: | fixture")){
            if($invalid -cmatch $syntax){throw 'MINIPC_FILE_NEGATIVE_SYNTAX_DENIED'}
          }
          # Real static roots are exact selected V3 sources, never the ADMIN profile as a root.
          $source=Get-Content 'tools/minipc_runner_tasks/file_access_bounded.ps1' -Raw
          $guard=Get-Content 'tools/minipc_runner_guard/pre_job.ps1' -Raw
          foreach($entry in @('V3Q1=','V3Paper-Quelle-46c5abbd6af1','V3Q2=','V3Paper-Quelle-5fd60d0e9dc2','V3Q3=','V3Paper-Quelle-985ed3230bb4','V3QR=','V3Paper-ReleaseSource-306aad033f16','V3P680=','V3-PR680-SOURCE-16d40540f7d8','V3P681=','V3-PR681-SOURCE-3ee5ea3cda54','V3P682=','V3-PR682-SOURCE-53dbcf6d8276','V3RS1=','V3-Release-Source-a40e93f7','V3RS2=','V3-Release-Source-b019448331df')){
            if(-not $source.Contains($entry)){throw "V3_ROOT_MISSING_SOURCE:$entry"}
          }
          foreach($alias in @('V3Q1','V3Q2','V3Q3','V3QR','V3P680','V3P681','V3P682','V3RS1','V3RS2')){
            if("MINIPC_FILE_V1 | $pin | SEARCH | $alias | source" -cnotmatch $syntax){throw "V3_ROOT_SYNTAX_FAILED:$alias"}
            if(-not $guard.Contains($alias)){throw "V3_ROOT_LOCAL_PREJOB_MISSING:$alias"}
          }
          Write-Output 'MINIPC_V3_NINE_EXACT_ROOTS_SOURCE_PASS'
          Write-Output 'MINIPC_FILE_ACCESS_SOURCE_SYNTAX_AND_BOUNDARY_PASS'

      - name: Validate bounded ZIP handoff with positive and fail-closed Windows fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $p='tools/minipc_runner_tasks/file_access_bounded.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'ZIP_HANDOFF_PARSE_FAILED'}
          foreach($name in @('Check-Time','Safe-Name','Assert-SafeZip')){
            $fn=$ast.Find({
              param($n)
              $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -ceq $name
            },$true)
            if(-not $fn){throw "ZIP_HANDOFF_MISSING_FUNCTION:$name"}
            . ([ScriptBlock]::Create($fn.Extent.Text))
          }
          $deadline=[DateTime]::UtcNow.AddMinutes(2)
          function New-ZipFixture([string]$entryName,[byte[]]$payload) {
            $ms=[IO.MemoryStream]::new()
            $archive=[IO.Compression.ZipArchive]::new($ms,[IO.Compression.ZipArchiveMode]::Create,$true)
            try {
              $entry=$archive.CreateEntry($entryName)
              $stream=$entry.Open()
              try{$stream.Write($payload,0,$payload.Length)}
              finally{$stream.Dispose()}
            }finally{$archive.Dispose()}
            $result=[byte[]]$ms.ToArray()
            $ms.Dispose()
            return ,$result
          }
          function Assert-ZipRejected([byte[]]$data,[string]$caseName) {
            $rejected=$false
            try {Assert-SafeZip $data}
            catch {$rejected=([string]$_.Exception.Message).StartsWith('FILE_ACCESS_DENIED:')}
            if(-not $rejected){throw "ZIP_HANDOFF_FAIL_OPEN:$caseName"}
          }
          $good=New-ZipFixture 'AP04-Contract-Review/cutover-fixed-inputs.json' ([Text.Encoding]::UTF8.GetBytes('{"status":"safe"}'))
          Assert-SafeZip $good
          Assert-ZipRejected (New-ZipFixture '../escape.json' ([Text.Encoding]::UTF8.GetBytes('{"x":1}'))) 'zip_slip'
          Assert-ZipRejected (New-ZipFixture 'archive/inner.zip' ([byte[]](1,2,3))) 'nested_zip'
          Assert-ZipRejected (New-ZipFixture 'archive/credential.json' ([Text.Encoding]::UTF8.GetBytes('{"x":1}'))) 'sensitive_name'
          Assert-ZipRejected (New-ZipFixture 'archive/data.json' ([Text.Encoding]::UTF8.GetBytes('{"password":"secret"}'))) 'sensitive_content'
          Assert-ZipRejected (New-ZipFixture 'archive/large.txt' ([Text.Encoding]::UTF8.GetBytes(('x' * 2097153)))) 'expansion'
          Assert-ZipRejected (New-ZipFixture 'archive/binary.json' ([byte[]](255,254,253))) 'invalid_utf8'
          Assert-ZipRejected ([byte[]](1,2,3,4)) 'invalid_zip'
          $source=Get-Content -LiteralPath $p -Raw
          foreach($marker in @("'.zip'","2097152",'Assert-SafeZip $body',"minipc-authorized-","+$extension")){
            if(-not $source.Contains($marker)){throw "ZIP_HANDOFF_MISSING_BOUND:$marker"}
          }
          Write-Output 'MINIPC_ZIP_HANDOFF_POSITIVE_AND_NEGATIVE_PASS'

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tools/minipc-watchdog.ps1',
            'tools/minipc-relay-credential-cutover.ps1',
            'tools/minipc-create-separated-relay-secrets.ps1',
            'tools/minipc-github-dispatch-secret-prep.ps1',
            'tools/install-minipc-github-cadence-guard.ps1',
            'tools/uninstall-minipc-github-cadence-guard.ps1',
            'tools/minipc-selftest.ps1',
            'tools/minipc-marketdata-smoke.ps1',
            'tools/minipc-next-gate.ps1',
            'tools/minipc-runtime-recovery-gate.ps1',
            'tools/minipc-v2r4-ws-shadow-smoke.ps1',
            'tools/minipc-v2r4-shadow-postboot-resilience.ps1',
            'tools/minipc-v2r4-shadow-resilience-bundle.ps1',
            'tools/minipc-v2r4-shadow-resilience-resume.ps1',
            'tools/minipc-v2r4-ws-shadow-evidence.ps1',
            'tools/install-minipc-v2r4-shadow-outcomes.ps1',
            'tools/uninstall-minipc-v2r4-shadow-outcomes.ps1',
            'tools/install-minipc-v2r4-shadow-cloud-sync.ps1',
            'tools/uninstall-minipc-v2r4-shadow-cloud-sync.ps1',
            'tools/install-minipc-status-sync.ps1',
            'tools/uninstall-minipc-status-sync.ps1',
            'tools/minipc-v2r4-technical-rollover-preflight.ps1',
            'tools/minipc-v2r4-technical-rollover-stage.ps1',
            'tools/minipc-v2r4-cpu-cache-inert-stage.ps1',
            'tools/minipc-v2r4-cpu-cache-release-readiness.ps1',
            'tools/minipc-v2r4-cpu-cache-rollback-readiness.ps1',
            'tools/minipc-v2r4-cpu-originalhost-baseline.ps1',
            'tools/minipc-v2r4-technical-cutover-readiness.ps1',
            'tools/minipc-v2r4-technical-cutover-operator.ps1',
            'tools/minipc-v2r4-shadow-cloud-sync-pr295-cutover.ps1',
            'tools/minipc-ws-shadow-crash-capture-operator.ps1',
            'tools/minipc-ws-shadow-last-eur-fix-operator.ps1',
            'tools/minipc-ws-shadow-pr300-io-guard-operator.ps1',
            'tools/minipc-runtime-supervisor.ps1',
            'tools/install-minipc-runtime-supervisor.ps1',
            'tools/minipc-runtime-supervisor-selfheal-smoke.ps1',
            'tools/minipc-watchdog-effectiveness-smoke.ps1',
            'tools/minipc-secret-hygiene-audit.ps1',
            'tools/minipc-post-fix-verification.ps1',
            'tools/install-minipc-v2r4-ws-shadow.ps1',
            'tools/uninstall-minipc-v2r4-ws-shadow.ps1',
            'tools/minipc-internet-recovery-gate.ps1',
            'tools/minipc-post-recovery-gate.ps1',
            'tools/minipc-phase2-enable.ps1',
            'tools/minipc-phase3-altrady-enable.ps1',
            'tools/minipc-v2r4-preflight-smoke.ps1',
            'tools/minipc-v2r4-readiness-sync.ps1',
            'tools/minipc-v2r4-real-altrady-release-smoke.ps1',
            'tools/install-minipc-v2r4-paper-runtime.ps1',
            'tools/install-minipc-v3-h3-shadow-001.ps1',
            'tools/minipc-local-core-gate.ps1',
            'tools/minipc-next-user-step.ps1',
            'tools/minipc-altrady-secret-prep.ps1',
            'tools/minipc-altrady-alert-helper.ps1',
            'tools/uninstall-minipc-kraken-canary.ps1',
            'tools/install-minipc-kraken-canary.ps1',
            'tools/uninstall-minipc-kraken-universe-feed.ps1',
            'tools/install-minipc-kraken-universe-feed.ps1',
            'tools/minipc-log-cleanup.ps1',
            'tools/minipc-backup.ps1',
            'tools/minipc-restore-smoke.ps1',
            'tools/install-minipc-baseline-tasks.ps1',
            'tools/uninstall-minipc-baseline-tasks.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PARSE_OK $file"
          }

      - name: CPU cache inert staging fail-closed contract (no host/keys)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'tools/minipc-v2r4-cpu-cache-inert-stage.ps1' -Raw
          foreach($forbidden in @('Stop-ScheduledTask','Start-ScheduledTask','Register-ScheduledTask','Unregister-ScheduledTask','Set-ScheduledTask','Invoke-WebRequest','Invoke-RestMethod','Remove-Item','git pull','git reset','git stash')) {
            if($src.Contains($forbidden)) { throw "Unexpected host/network mutation command: $forbidden" }
          }
