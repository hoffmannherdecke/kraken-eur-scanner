name: MINI-PC tools smoke

'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/minipc-*.ps1'
      - 'tools/*minipc*.py'
      - 'tools/v2r4-shadow-cloud-sync.py'
      - 'tools/v2r4-ws-shadow-*.py'
      - 'tools/v3-h3-shadow-runtime.py'
      - 'tools/v3_h3_shadow_common.py'
      - 'tools/v3-h3-kraken-ws-book-reconciliation-smoke.py'
      - 'tools/install-minipc-v3-h3-shadow-001.ps1'
      - '.github/workflows/minipc-tools-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/minipc-*.ps1'
      - 'tools/install-minipc-baseline-tasks.ps1'
      - 'tools/uninstall-minipc-baseline-tasks.ps1'
      - 'tools/minipc-altrady-poller.py'
      - 'tools/minipc-altrady-live-alert-proof.py'
      - 'tools/minipc-kraken-universe-feed.py'
      - 'tools/v2r4-ws-shadow-evidence.py'
      - 'tools/v2r4-ws-shadow-outcome-tracker.py'
      - 'tools/v2r4-shadow-cloud-sync.py'
      - 'tools/minipc-status-sync.py'
      - 'tools/v3-h3-shadow-runtime.py'
      - 'tools/v3_h3_shadow_common.py'
      - 'tools/v3-h3-kraken-ws-book-reconciliation-smoke.py'
      - 'tools/install-minipc-v3-h3-shadow-001.ps1'
      - 'tools/minipc-github-cadence-guard.py'
      - 'tools/minipc-github-dispatch-secret-prep.ps1'
      - 'tools/install-minipc-github-cadence-guard.ps1'
      - 'tools/uninstall-minipc-github-cadence-guard.ps1'
      - 'tools/minipc-runtime-supervisor.ps1'
      - 'tools/install-minipc-runtime-supervisor.ps1'
      - 'tools/minipc-runtime-supervisor-selfheal-smoke.ps1'
      - 'tools/minipc-watchdog-effectiveness-smoke.ps1'
      - 'tools/minipc-secret-hygiene-audit.ps1'
      - 'tools/minipc-post-fix-verification.ps1'
      - 'tools/paper-runtime-reconciliation-audit.py'
      - 'tools/install-minipc-status-sync.ps1'
      - 'tools/uninstall-minipc-status-sync.ps1'
      - 'tools/install-minipc-v2r4-shadow-cloud-sync.ps1'
      - 'tools/uninstall-minipc-v2r4-shadow-cloud-sync.ps1'
      - 'tools/install-minipc-v2r4-shadow-outcomes.ps1'
      - 'tools/uninstall-minipc-v2r4-shadow-outcomes.ps1'
      - 'tools/minipc-v2r4-ws-shadow-smoke.ps1'
      - 'tools/minipc-v2r4-shadow-postboot-resilience.ps1'
      - 'tools/minipc-v2r4-shadow-resilience-bundle.ps1'
      - 'tools/minipc-v2r4-shadow-resilience-resume.ps1'
      - 'tools/install-minipc-v2r4-ws-shadow.ps1'
      - 'tools/uninstall-minipc-v2r4-ws-shadow.ps1'
      - 'tools/install-minipc-kraken-universe-feed.ps1'
      - 'tools/uninstall-minipc-kraken-universe-feed.ps1'
      - '.github/workflows/minipc-tools-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Parse Python transport tools
        shell: powershell
        run: |
          python -m py_compile .\tools\minipc-altrady-poller.py .\tools\minipc-altrady-live-alert-proof.py .\tools\minipc-altrady-e2e-smoke.py .\tools\minipc-kraken-universe-feed.py .\tools\v2r4-ws-shadow-evidence.py .\tools\v2r4-ws-shadow-outcome-tracker.py .\tools\v2r4-shadow-cloud-sync.py .\tools\minipc-status-sync.py .\tools\minipc-github-cadence-guard.py .\tools\paper-runtime-reconciliation-audit.py .\tools\v2r4-paper-local-runtime.py .\tools\v2r4-paper-cloud-sync.py .\tools\v2r4-paper-alerts.py .\tools\v3-h3-shadow-runtime.py .\tools\v3_h3_shadow_common.py .\tools\v3-h3-kraken-ws-book-reconciliation-smoke.py
          python -m py_compile tools/minipc-ws-shadow-crash-footer.py tools/minipc-ws-shadow-last-eur-fix-builder.py tests/test_minipc_ws_shadow_crash_capture.py tests/test_minipc_ws_shadow_last_eur_fix_builder.py
          python -m unittest tests.test_minipc_ws_shadow_crash_capture tests.test_minipc_ws_shadow_last_eur_fix_builder -v
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_WS_SOURCE_GUARD_TEST_FAILED' }
          python -m py_compile tools/minipc-ws-shadow-pr300-io-guard-builder.py tests/test_minipc_ws_shadow_pr300_guard_builder.py
          if ($LASTEXITCODE -ne 0) { throw 'PR300_BUILDER_PARSE_FAILED' }
          python -m unittest tests.test_minipc_ws_shadow_pr300_guard_builder -v
          if ($LASTEXITCODE -ne 0) { throw 'PR300_BUILDER_PARITY_TEST_FAILED' }
          if ($LASTEXITCODE -ne 0) { throw 'WS_SHADOW_CAPTURE_REGRESSION_FAILED' }
          python -m unittest tests.test_v2r4_ws_shadow_file_access -v
          if ($LASTEXITCODE -ne 0) { throw 'WS_SHADOW_ACCESS_REGRESSION_FAILED' }
          if ($LASTEXITCODE -ne 0) { throw 'WS_SHADOW_FIX_REGRESSIONS_FAILED' }
          python .\tools\minipc-github-cadence-guard.py --self-test
          Write-Host 'PYTHON_TRANSPORT_PARSE_OK'

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tools/minipc-watchdog.ps1',
            'tools/minipc-relay-credential-cutover.ps1',
            'tools/minipc-create-separated-relay-secrets.ps1',
            'tools/minipc-github-dispatch-secret-prep.ps1',
            'tools/install-minipc-github-cadence-guard.ps1',
            'tools/uninstall-minipc-github-cadence-guard.ps1',
            'tools/minipc-selftest.ps1',
            'tools/minipc-marketdata-smoke.ps1',
            'tools/minipc-next-gate.ps1',
            'tools/minipc-runtime-recovery-gate.ps1',
            'tools/minipc-v2r4-ws-shadow-smoke.ps1',
            'tools/minipc-v2r4-shadow-postboot-resilience.ps1',
            'tools/minipc-v2r4-shadow-resilience-bundle.ps1',
            'tools/minipc-v2r4-shadow-resilience-resume.ps1',
            'tools/minipc-v2r4-ws-shadow-evidence.ps1',
            'tools/install-minipc-v2r4-shadow-outcomes.ps1',
            'tools/uninstall-minipc-v2r4-shadow-outcomes.ps1',
            'tools/install-minipc-v2r4-shadow-cloud-sync.ps1',
            'tools/uninstall-minipc-v2r4-shadow-cloud-sync.ps1',
            'tools/install-minipc-status-sync.ps1',
            'tools/uninstall-minipc-status-sync.ps1',
            'tools/minipc-v2r4-technical-rollover-preflight.ps1',
            'tools/minipc-v2r4-technical-rollover-stage.ps1',
            'tools/minipc-v2r4-cpu-cache-inert-stage.ps1',
            'tools/minipc-v2r4-cpu-cache-release-readiness.ps1',
            'tools/minipc-v2r4-cpu-cache-rollback-readiness.ps1',
            'tools/minipc-v2r4-cpu-originalhost-baseline.ps1',
            'tools/minipc-v2r4-technical-cutover-readiness.ps1',
            'tools/minipc-v2r4-technical-cutover-operator.ps1',
            'tools/minipc-v2r4-shadow-cloud-sync-pr295-cutover.ps1',
            'tools/minipc-ws-shadow-crash-capture-operator.ps1',
            'tools/minipc-ws-shadow-last-eur-fix-operator.ps1',
            'tools/minipc-ws-shadow-pr300-io-guard-operator.ps1',
            'tools/minipc-runtime-supervisor.ps1',
            'tools/install-minipc-runtime-supervisor.ps1',
            'tools/minipc-runtime-supervisor-selfheal-smoke.ps1',
            'tools/minipc-watchdog-effectiveness-smoke.ps1',
            'tools/minipc-secret-hygiene-audit.ps1',
            'tools/minipc-post-fix-verification.ps1',
            'tools/install-minipc-v2r4-ws-shadow.ps1',
            'tools/uninstall-minipc-v2r4-ws-shadow.ps1',
            'tools/minipc-internet-recovery-gate.ps1',
            'tools/minipc-post-recovery-gate.ps1',
            'tools/minipc-phase2-enable.ps1',
            'tools/minipc-phase3-altrady-enable.ps1',
            'tools/minipc-v2r4-preflight-smoke.ps1',
            'tools/minipc-v2r4-readiness-sync.ps1',
            'tools/minipc-v2r4-real-altrady-release-smoke.ps1',
            'tools/install-minipc-v2r4-paper-runtime.ps1',
            'tools/install-minipc-v3-h3-shadow-001.ps1',
            'tools/minipc-local-core-gate.ps1',
            'tools/minipc-next-user-step.ps1',
            'tools/minipc-altrady-secret-prep.ps1',
            'tools/minipc-altrady-alert-helper.ps1',
            'tools/uninstall-minipc-kraken-canary.ps1',
            'tools/install-minipc-kraken-canary.ps1',
            'tools/uninstall-minipc-kraken-universe-feed.ps1',
            'tools/install-minipc-kraken-universe-feed.ps1',
            'tools/minipc-log-cleanup.ps1',
            'tools/minipc-backup.ps1',
            'tools/minipc-restore-smoke.ps1',
            'tools/install-minipc-baseline-tasks.ps1',
            'tools/uninstall-minipc-baseline-tasks.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PARSE_OK $file"
          }

      - name: CPU cache inert staging fail-closed contract (no host/keys)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'tools/minipc-v2r4-cpu-cache-inert-stage.ps1' -Raw
          foreach($forbidden in @('Stop-ScheduledTask','Start-ScheduledTask','Register-ScheduledTask','Unregister-ScheduledTask','Set-ScheduledTask','Invoke-WebRequest','Invoke-RestMethod','Remove-Item','git pull','git reset','git stash')) {
            if($src.Contains($forbidden)) { throw "Unexpected host/network mutation command: $forbidden" }
          }
          foreach($required in @('c8f37da865314ac91d36c786b66d107aad4a28d1','C84533E1042C9D89','8371CAB2D7D18F96','INERT_CPU_CACHE_STAGE_ONLY','READ_ONLY_PREFLIGHT_PASS_NOT_STAGED','STAGED_INERT_NOT_EXECUTED')) {
            if(-not $src.Contains($required)) { throw "Inert staging gate missing: $required" }
          }
          $nonexistent=Join-Path $env:RUNNER_TEMP 'CPU-CACHE-NONEXISTENT-SOURCE'
          $target=Join-Path $env:RUNNER_TEMP 'Staging\v2r4-cache-inert-c8f37da86531'
          if(Test-Path -LiteralPath $nonexistent){throw 'Fixture collision: source'}
          if(Test-Path -LiteralPath $target){throw 'Fixture collision: target'}
          $failedClosed=$false
          try {
            & ./tools/minipc-v2r4-cpu-cache-inert-stage.ps1 -SourceRoot $nonexistent -TradingRoot $env:RUNNER_TEMP -Stage -Confirm 'INERT_CPU_CACHE_STAGE_ONLY' | Out-Null
          } catch {
            $failedClosed=([string]$_.Exception.Message).Contains('Independent source missing')
          }
          if(-not $failedClosed -or (Test-Path -LiteralPath $target)){throw 'Inert staging missing-source safety test failed'}
          Write-Output 'CPU_CACHE_INERT_NO_HOST_MUTATION_PASS'

      - name: CPU cache release source-only gate rejects absent original host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/minipc-v2r4-cpu-cache-release-readiness.ps1'
          $src=Get-Content -LiteralPath $path -Raw
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)
          if(@($errors).Count -ne 0){ throw "CPU gate source parse errors" }
          foreach($forbidden in @('Stop-ScheduledTask','Start-ScheduledTask','Register-ScheduledTask','Unregister-ScheduledTask','Set-ScheduledTask','Copy-Item','Move-Item','Remove-Item','New-Item','Set-Content','Out-File','Invoke-RestMethod','Invoke-WebRequest','Start-Process','git pull','git reset')) {
            if($src.Contains($forbidden)){throw "CPU source-only gate must not contain mutation command: $forbidden"}
          }
          # Avoid manually transcribed cache SHA values: frozen PR360 source bytes
          # can be normalized differently by git on Windows; stage copied local bytes.
          if(-not $src.Contains('SOURCE_CACHE_SHA_READABLE')){ throw 'Missing source-check evidence gate' }
          $sourceHashReads=[regex]::Matches($src,[regex]::Escape('=SHA (Join-Path $source')).Count
          if($sourceHashReads -ne 2){ throw 'Expected two exact PR360 source-hash reads' }
          if($src.Contains("'candidate\\v2r4-paper-local-runtime.py'='8D62BD0B") -or $src.Contains("'wait\\v2r4_wait_runtime.py'='880A0BEA")){
            throw 'CPU manifest checker reverted to hand-transcribed source hashes'
          }
          foreach($required in @('PAPER-V2R4-20261009T110135Z','c8f37da865314ac91d36c786b66d107aad4a28d1','d8b35a8ec2e6f392f219b1c36cad95f3ad629b64','READ_ONLY_GATE_BLOCKED','READ_ONLY_SOURCE_GATE_PASS_MANUAL_RELEASE_BLOCKED','604d5d460f17c4548b2d69db8ceb2f5368e702a6d51860ce8916e2e7fbba5b30')) {
            if(-not $src.Contains($required)){throw "CPU gate missing source pin: $required"}
          }
          $missing=Join-Path $env:RUNNER_TEMP 'no-such-original-host-cpu-readiness'
          if(Test-Path -LiteralPath $missing){throw 'Unexpected fixture directory collision'}
          $result=& ./$path -TradingRoot $missing | ConvertFrom-Json
          if($result.status -ne 'READ_ONLY_GATE_BLOCKED' -or $result.reason -ne 'GATE_TRADING_ROOT_EXISTS' -or $result.task_mutations -ne $false -or $result.runtime_mutations -ne $false -or (Test-Path $missing)){
            throw 'CPU source-only release gate absent-host fail-closed test failed'
          }
          Write-Output 'CPU_CACHE_READ_ONLY_RELEASE_GATE_NEGATIVE_PASS'

      - name: CPU originalhost performance baseline is read-only and bounded
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools/minipc-v2r4-cpu-originalhost-baseline.ps1'
          $src=Get-Content -LiteralPath $p -Raw
          $tok=$null; $err=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tok,[ref]$err)
          if(@($err).Count -ne 0){throw 'CPU baseline has invalid PowerShell syntax'}
          foreach($command in @(
            'Stop-ScheduledTask','Start-ScheduledTask','Disable-ScheduledTask',
            'Enable-ScheduledTask','Set-ScheduledTask','Register-ScheduledTask',
            'Stop-Process','Start-Process','Copy-Item','Remove-Item','Move-Item',
            'New-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest',
            'Invoke-RestMethod','Export-ScheduledTask','Set-Item'
          )) {
            if($src.Contains($command)){throw "CPU baseline observer contains prohibited mutation: $command"}
          }
          if(-not $src.Contains("ISSUE353_V2R4_CPU_ORIGINALHOST_BASELINE_V1") -or
             -not $src.Contains("production_release_authorized=$false") -or
             -not $src.Contains("disk_writes=$false")){
            throw 'CPU baseline observer lacks read-only evidence flag'
          }
          $missing=Join-Path $env:RUNNER_TEMP 'MISSING-ISSUE353-TRADING-ROOT'
          if(Test-Path -LiteralPath $missing){throw 'Unexpected dummy root'}
          $blocked=$false
          try { & ./$p -TradingRoot $missing -DurationSeconds 15 -IntervalSeconds 5 | Out-Null }
          catch {$blocked=([string]$_ -like '*CPU_SAMPLE_TRADING_ROOT_NOT_PRESENT*')}
          if(-not $blocked){throw 'CPU baseline did not reject absent originalhost'}
          $blocked=$false
          try { & ./$p -TradingRoot $missing -DurationSeconds 2 -IntervalSeconds 1 | Out-Null }
          catch {$blocked=([string]$_ -like '*CPU_SAMPLE_INVALID_BOUNDED_WINDOW*')}
          if(-not $blocked){throw 'CPU baseline accepted invalid sampling interval'}
          Write-Output 'CPU_BASELINE_SOURCE_ONLY_AST_AND_NO_HOST_NEGATIVE_PASS'

      - name: CPU rollback backup-only gate rejects absent host and never mutates tasks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/minipc-v2r4-cpu-cache-rollback-readiness.ps1'
          $src=Get-Content -LiteralPath $path -Raw
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)
          if(@($errors).Count -ne 0){ throw 'CPU rollback gate PowerShell parser error' }
          foreach($forbidden in @('Stop-ScheduledTask','Start-ScheduledTask','Register-ScheduledTask','Unregister-ScheduledTask','Set-ScheduledTask','Copy-Item','Move-Item','Remove-Item','New-Item','Set-Content','Out-File','Invoke-RestMethod','Invoke-WebRequest','Start-Process','git pull','git reset','Set-Item','Stop-Process')) {
            if($src.Contains($forbidden)){throw "Unexpected mutation in rollback-only gate: $forbidden"}
          }
          foreach($required in @('ISSUE353_CPU_PRECHANGE_BACKUP_V1','8371CAB2D7D18F9651E604DBAB88768F77B2DFF5EB88565122858F6428DC50D0','C84533E1042C9D89D6F6EDC31DD22DE6DD3AB3B7AAE2B202EF344495A72BA6A2','READ_ONLY_BACKUP_GATE_PASS_MANUAL_RELEASE_BLOCKED','BACKUP_BYTES_MATCH_PIN','LIVE_ORIGINAL_STILL_PRESENT')) {
            if(-not $src.Contains($required)){throw "CPU rollback gate lacks immutable pin: $required"}
          }
          $fake='D:\Krypto-Sicherungen\ISSUE353-CPU-VORHER-20261017-091646-deadbeef'
          $report=& ./$path -BackupDirectory $fake -TradingRoot $env:RUNNER_TEMP | ConvertFrom-Json
          if($report.status -ne 'READ_ONLY_BACKUP_GATE_BLOCKED' -or
             $report.task_mutations -ne $false -or
             $report.runtime_mutations -ne $false -or
             $report.backup_files_modified -ne $false){
            throw 'CPU rollback gate absent host fail-closed check failed'
          }
          Write-Output 'CPU_ROLLBACK_SOURCE_ONLY_NO_HOST_MUTATION_PASS'

      - name: WS Shadow crash capture requires the pinned original host
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'ws-shadow-absent-capture-fixture'
          if(Test-Path $root){ throw 'Unexpected existing fixture' }
          $caught=$false
          try {
            & ./tools/minipc-ws-shadow-crash-capture-operator.ps1 -TradingRoot $root -PatcherPath ./tools/minipc-ws-shadow-crash-footer.py -Apply
          } catch {
            if($_.Exception.Message -notlike '*Get-ScheduledTask*' -and $_.Exception.Message -notlike '*Cannot find*' -and $_.Exception.Message -notlike '*No MSFT_ScheduledTask*') {
              throw
            }
            $caught=$true
          }
          if(-not $caught -or (Test-Path $root)){ throw 'Unverified host could mutate' }
          Write-Host 'WS_SHADOW_CAPTURE_NO_HOST_NO_MUTATION_PASS'

      - name: WS Shadow fixed-price rollout refuses missing source
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'ws-shadow-absent-price-fix-fixture'
          if(Test-Path $root){throw 'Fixture unexpectedly present'}
          $caught=$false
          try {
            & ./tools/minipc-ws-shadow-last-eur-fix-operator.ps1 -TradingRoot $root -PatcherPath ./tools/minipc-ws-shadow-last-eur-fix-builder.py -Apply
          } catch {
            if($_.Exception.Message -notlike '*Get-ScheduledTask*' -and $_.Exception.Message -notlike '*Cannot find*' -and $_.Exception.Message -notlike '*No MSFT_ScheduledTask*') {throw}
            $caught=$true
          }
          if(-not $caught -or (Test-Path $root)){throw 'Unverified host mutated'}
          Write-Host 'WS_SHADOW_FIX_NO_HOST_NO_MUTATION_PASS'

      - name: WS Shadow PR300 source rollout requires original host
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'ws-shadow-pr300-missing-host'
          if(Test-Path $root){ throw 'Unexpected existing fixture' }
          $caught=$false
          try {
            & ./tools/minipc-ws-shadow-pr300-io-guard-operator.ps1 -TradingRoot $root -PatcherPath ./tools/minipc-ws-shadow-pr300-io-guard-builder.py -Apply
          } catch {
            if($_.Exception.Message -notlike '*Get-ScheduledTask*' -and $_.Exception.Message -notlike '*Cannot find*' -and $_.Exception.Message -notlike '*No MSFT_ScheduledTask*') { throw }
            $caught=$true
          }
          if(-not $caught -or (Test-Path $root)){ throw 'UNVERIFIED_HOST_MUTATED' }
          Write-Host 'PR300_NO_HOST_NO_ACTION_PASS'

      - name: Technical rollover preflight fails closed without writing anything
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'absent-paper-rollover-fixture'
          if(Test-Path $root){ throw 'fixture path already exists' }
          $text = & ./tools/minipc-v2r4-technical-rollover-preflight.ps1 -TradingRoot $root
          $result = ($text -join [Environment]::NewLine) | ConvertFrom-Json
          if($result.status -ne 'PREFLIGHT_BLOCKED_NO_MUTATION'){ throw 'unsafe success without local controls' }
          if(Test-Path $root){ throw 'preflight wrote files' }
          Write-Host 'TECHNICAL_ROLLOVER_READ_ONLY_FAIL_CLOSED_PASS'
      - name: Cutover operator requires reviewed SHA and never mutates on default path
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'nonexistent-cutover-operator-fixture'
          if(Test-Path $root){ throw 'Unexpected fixture' }
          $raw=& ./tools/minipc-v2r4-technical-cutover-operator.ps1 -TradingRoot $root
          $result=($raw -join [Environment]::NewLine) | ConvertFrom-Json
          if($result.status -ne 'BLOCKED' -or $result.phase -ne 'READ_ONLY' -or $result.orders -ne $false){
            throw 'Cutover operator did not fail closed on missing SHA'
          }
          if(Test-Path $root){ throw 'Cutover operator created files in read-only mode' }
          Write-Host 'CUTOVER_OPERATOR_READ_ONLY_FAIL_CLOSED_PASS'

      - name: Technical cutover inventory is read-only and fails closed
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'absent-technical-readiness-fixture'
          if(Test-Path $root){ throw 'fixture path already exists' }
          $text = & ./tools/minipc-v2r4-technical-cutover-readiness.ps1 -TradingRoot $root
          $result = ($text -join [Environment]::NewLine) | ConvertFrom-Json
          if($result.status -ne 'READ_ONLY_GATE_BLOCKED' -or $result.mode -ne 'READ_ONLY'){
            throw 'readiness script did not fail closed'
          }
          if(Test-Path $root){ throw 'read-only readiness created files' }
          Write-Host 'TECHNICAL_CUTOVER_READ_ONLY_FAIL_CLOSED_PASS'

      - name: Compile real-Altrady release smoke helper
        run: python -m py_compile tools/v2r4-real-altrady-release-smoke.py

      - name: Smoke real-Altrady V2R4 release plan-only
        shell: powershell
        run: |
          $out = .\tools\minipc-v2r4-real-altrady-release-smoke.ps1
          $json = ($out -join [Environment]::NewLine) | ConvertFrom-Json
          if ($json.status -ne 'PLAN_ONLY') { throw 'real-Altrady release smoke did not stay plan-only' }
          if ($json.altrady_role -ne 'WAKEUP_HINT_ONLY') { throw 'Altrady role changed' }
          if ($json.kraken_public_is_condition_truth -ne $true) { throw 'Kraken truth guardrail changed' }
          if ($json.guardrails.order_api -ne $false -or $json.guardrails.real_money_actions -ne $false) { throw 'real-money/order guardrail changed' }
          if ($null -ne $json.branch) { throw 'release smoke must not default to any executable branch before candidate materialization' }
          if ($json.binding_spec -ne 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json') { throw 'release smoke must use binding release-candidate spec' }
          $preflightText = Get-Content .\tools\minipc-v2r4-preflight-smoke.ps1 -Raw
          $releaseSmokeText = Get-Content .\tools\minipc-v2r4-real-altrady-release-smoke.ps1 -Raw
          foreach ($text in @($preflightText,$releaseSmokeText)) {
            if ($text -match 'prep/v2r4-refresh-20261001') { throw 'superseded V2R4 branch reference reintroduced' }
          }
          if ($releaseSmokeText -match 'paper_strategy_spec_v2r4_proposed\.json') { throw 'obsolete V2R4 proposed spec reference reintroduced' }
          if ($releaseSmokeText -notmatch 'paper_strategy_spec_v2r4_release_candidate\.json') { throw 'binding V2R4 release-candidate spec reference missing' }
          Write-Host 'REAL_ALTRADY_V2R4_RELEASE_PLAN_SMOKE_OK'

      - name: Smoke V2R4 preflight deferred gate
        shell: powershell
        run: |
          $out = .\tools\minipc-v2r4-preflight-smoke.ps1
          $json = ($out -join [Environment]::NewLine) | ConvertFrom-Json
          if ($json.status -ne 'DEFERRED_NO_CURRENT_RELEASE_BRANCH') { throw 'preflight must defer until an explicit current release candidate exists' }
          if ($null -ne $json.branch) { throw 'preflight must not default to a branch' }
          if ($json.binding_spec -ne 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json') { throw 'preflight binding contract drifted' }
          if ($json.guardrails.paper_activation -ne $false -or $json.guardrails.real_money_actions -ne $false) { throw 'preflight guardrails changed' }
          Write-Host 'V2R4_PREFLIGHT_DEFERRED_GATE_OK'

      - name: Smoke V2R4 readiness sync plan-only
        shell: powershell
        run: |
          $out = .\tools\minipc-v2r4-readiness-sync.ps1
          $json = ($out -join [Environment]::NewLine) | ConvertFrom-Json
          if ($json.status -ne 'PLAN_ONLY') { throw 'readiness sync did not stay plan-only' }
          if ($json.required_branch -ne 'main') { throw 'unexpected required branch' }
          if ($null -ne $json.v2r4_candidate_branch) { throw 'readiness sync must not default to a superseded V2R4 branch' }
          if ($json.guardrails.paper_activation -ne $false -or $json.guardrails.real_money_actions -ne $false) { throw 'readiness sync guardrails changed' }
          Write-Host 'V2R4_READINESS_SYNC_PLAN_SMOKE_OK'

      - name: Smoke bounded cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'minipc-cleanup-smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Logs'),(Join-Path $root 'Temp') | Out-Null
          Set-Content (Join-Path $root 'Logs\old.log') 'old'
          Set-Content (Join-Path $root 'Temp\old.tmp') 'old'
          (Get-Item (Join-Path $root 'Logs\old.log')).LastWriteTime = (Get-Date).AddDays(-30)
          (Get-Item (Join-Path $root 'Temp\old.tmp')).LastWriteTime = (Get-Date).AddDays(-5)
          .\tools\minipc-log-cleanup.ps1 -TradingRoot $root
          if (Test-Path (Join-Path $root 'Logs\old.log')) { throw 'old log not deleted' }
          if (Test-Path (Join-Path $root 'Temp\old.tmp')) { throw 'old temp not deleted' }
          Write-Host 'CLEANUP_SMOKE_OK'

      - name: Smoke backup and restore
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'minipc-backup-smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'State') | Out-Null
          Set-Content (Join-Path $root 'State\example.json') '{"ok":true}'
          .\tools\minipc-backup.ps1 -TradingRoot $root
          .\tools\minipc-restore-smoke.ps1 -TradingRoot $root
          $zips = @(Get-ChildItem (Join-Path $root 'Backup') -Filter 'minipc-state-*.zip')
          if ($zips.Count -ne 1) { throw "expected one backup zip, got $($zips.Count)" }
          Write-Host 'BACKUP_RESTORE_SMOKE_OK'

      - name: Smoke V2R4 shadow outcome tracker
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'v2r4-outcome-tracker-smoke'
          $events = Join-Path $root 'State\v2r4-ws-shadow-events'
          New-Item -ItemType Directory -Force -Path $events | Out-Null
          $now = [datetime]::UtcNow.ToString('o').Replace('+00:00','Z')
          @{kind='V2R4_WS_SHADOW_DISCOVERY';pair='TEST/EUR';observed_at_utc=$now;source_pair_received_at_utc=$now;last_eur=100.0;reasons=@('FAST_10M')} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $events 'event.json')
          @{schema_version=1;kind='MINIPC_KRAKEN_EUR_TICKER_LATEST_V1';written_at_utc=$now;pair_count=1;observed_pair_count=1;pairs=@{'TEST/EUR'=@{symbol='TEST/EUR';received_at_utc=$now;last_eur=101.0}}} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $root 'State\kraken-eur-ticker-latest.json')
          python .\tools\v2r4-ws-shadow-outcome-tracker.py --trading-root $root --once
          if ($LASTEXITCODE -ne 0) { throw 'outcome tracker smoke failed' }
          $h = Get-Content (Join-Path $root 'State\v2r4-ws-shadow-outcome-heartbeat.json') -Raw | ConvertFrom-Json
          if ($h.status -ne 'HEALTHY' -or $h.active_events -ne 1 -or $h.counters.events_enrolled -ne 1) { throw 'unexpected tracker heartbeat' }
          if ($h.strategy_action -ne 'NONE_EVIDENCE_ONLY' -or $h.real_money_actions -ne $false) { throw 'outcome tracker guardrail changed' }
          Write-Host 'V2R4_SHADOW_OUTCOME_TRACKER_SMOKE_OK'
      - name: Smoke watchdog report creation
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'minipc-watchdog-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\minipc-watchdog.ps1 -TradingRoot $root
          $code = $LASTEXITCODE
          $state = Join-Path $root 'State\minipc-health.json'
          $log = Join-Path $root 'Logs\minipc-watchdog.log'
          if (-not (Test-Path $state)) { throw 'watchdog state file missing' }
          if (-not (Test-Path $log)) { throw 'watchdog log file missing' }
          $json = Get-Content $state -Raw | ConvertFrom-Json
          if ($json.kind -ne 'MINIPC_LOCAL_HEALTH_V1') { throw 'unexpected watchdog schema' }
          if ($code -ne 2) { throw "expected critical exit 2 in empty sandbox, got $code" }
          $global:LASTEXITCODE = 0
          Write-Host 'WATCHDOG_SMOKE_OK'
          exit 0
