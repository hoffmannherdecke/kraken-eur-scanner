          if ($json.binding_spec -ne 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json') { throw 'release smoke must use binding release-candidate spec' }
          $preflightText = Get-Content .\tools\minipc-v2r4-preflight-smoke.ps1 -Raw
