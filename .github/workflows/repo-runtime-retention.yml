name: Repository runtime retention cleanup

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/repo-runtime-retention.py'
      - '.github/workflows/repo-runtime-retention.yml'
      - 'research/v3/shadow-runtime/h1-control.json'
      - 'research/v3/shadow-runtime/h1-status.json'
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: write

concurrency:
  group: repository-runtime-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Self-test retention logic
        run: python tools/repo-runtime-retention.py --self-test

      - name: Build verified Supabase archive manifest
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=(os.getenv("SUPABASE_SECRET_KEY") or os.getenv("SUPABASE_SERVICE_ROLE_KEY") or "").strip()
          if not key: raise SystemExit("backend credential missing")
          headers={"apikey":key}
          if not key.startswith("sb_secret_"): headers["Authorization"]="Bearer "+key

          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          ids=[]
          offset=0
          while True:
              rows=get(f"/rest/v1/paper_candidate_outcomes?select=candidate_id&limit=1000&offset={offset}")
              ids.extend(str(x["candidate_id"]) for x in rows)
              if len(rows)<1000: break
              offset+=1000

          ready=get("/rest/v1/paper_series_completion_readiness?select=series_id,candidate_outcomes,completion_ready")
          review=get("/rest/v1/v2r3_release_review_snapshot?select=final_review_allowed,integrity_state")
          h1=get("/rest/v1/v3_h1_shadow_status?select=payload&shadow_candidate_id=eq.V3-H1-SHADOW-001")
          h1_count=get("/rest/v1/v3_h1_shadow_evidence?select=candidate_id")
          retire=bool(
              ready and ready[0].get("completion_ready") is True
              and review and review[0].get("final_review_allowed") is True
              and str(review[0].get("integrity_state") or "")=="HEALTHY"
          )
          manifest={
              "paper_candidate_ids":sorted(set(ids)),
              "active_candidate_outcomes":int((ready[0] if ready else {}).get("candidate_outcomes") or 0),
              "retire_active_paper":retire,
              "h1_evidence_rows":len(h1_count),
          }
          Path(".runtime-retention-manifest.json").write_text(json.dumps(manifest,sort_keys=True)+"\n")
          print("RETENTION_ARCHIVE_MANIFEST "+json.dumps({
              "paper_candidate_ids":len(manifest["paper_candidate_ids"]),
              "active_candidate_outcomes":manifest["active_candidate_outcomes"],
              "retire_active_paper":retire,
              "h1_evidence_rows":manifest["h1_evidence_rows"],
          },sort_keys=True))
          PY

      - name: Apply bounded cleanup
        run: python tools/repo-runtime-retention.py --manifest .runtime-retention-manifest.json --apply

      - name: Commit cleanup only when files changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A handoff_queue paper_decisions paper_revalidations paper_positions paper_followups paper_alerts research/v3/shadow-runtime/h1-context research/v3/shadow-runtime/h1-decisions 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "RUNTIME_RETENTION_NO_CHANGES"
            exit 0
          fi
          git commit -m "[retention] remove archived runtime files"
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt*2))
          done
          test "$pushed" = "true"
