name: V2R3 clean-series freeze guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_strategy_spec.json'
      - 'paper_runtime_control.json'
      - 'paper_evaluator/evaluate.py'
      - 'paper_evaluator/revalidate.py'
      - 'paper_context.py'
      - '.github/workflows/scan.yml'
      - '.github/workflows/paper-evaluator.yml'
      - 'research/v2r3/clean-series-freeze-20261001.json'
      - 'tools/validate-v2r3-clean-series-freeze.py'
      - 'tools/paper-release-rollback-snapshot.py'
      - '.github/workflows/v2r3-clean-series-freeze-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate frozen clean-series contract
        run: python tools/validate-v2r3-clean-series-freeze.py

      - name: Verify rollback evidence
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest=json.loads(Path("research/v2r3/clean-series-freeze-20261001.json").read_text("utf-8"))
          if manifest["status"]=="ACTIVE_UNTIL_RELEASE_REVIEW_COMPLETE":
              p=Path(os.environ["RUNNER_TEMP"])/"v2r3-lkg.json"
              subprocess.run(["python","tools/paper-release-rollback-snapshot.py","--output",str(p)],check=True)
          else:
              assert manifest["status"]=="RETIRED_AFTER_RELEASE_REVIEW_COMPLETE"
              p=Path("research/v2r4/release-evidence/v2r3-last-known-good-rollback-20261007.json")
          j=json.loads(p.read_text("utf-8"))
          assert j["kind"]=="PAPER_RELEASE_ROLLBACK_SNAPSHOT_V1"
          assert j["status"]=="LAST_KNOWN_GOOD_REFERENCE"
          assert j["series_id"]=="PAPER-V2R3-CLEAN-20261001T0925Z"
          assert j["strategy_revision"]=="V2R3-2026-09-28"
          assert j["strategy_fingerprint_sha256"]==manifest["expected_strategy_fingerprint_sha256"]
          assert j["runtime_code_fingerprint_sha256"]==manifest["expected_runtime_code_fingerprint_sha256"]
          assert j["rollback_semantics"]["whole_repo_reset_allowed"] is False
          assert j["rollback_semantics"]["evidence_or_state_rewind_allowed"] is False
          assert j["rollback_semantics"]["protected_code_config_restore_only"] is True
          assert j["guardrails"]["orders"] is False
          assert j["guardrails"]["real_money_actions"] is False
          assert len(j["protected_files_sha256"]) >= 6
          print("ROLLBACK_EVIDENCE PASS content-addressed/no-state-rewind")
          PY
