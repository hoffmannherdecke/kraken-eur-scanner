name: Reconciliation audit active-series fix once

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconciliation-audit-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Filter decisions and revalidations to active series
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tools/paper-runtime-reconciliation-audit.py")
          lines=p.read_text("utf-8").splitlines()
          out=[]
          pending=None
          inserted=set()
          for line in lines:
              out.append(line)
              if "DECISION_INVALID_JSON" in line:
                  pending="decision"
              elif "REVALIDATION_INVALID_JSON" in line:
                  pending="revalidation"
              elif pending and line.strip()=="continue":
                  out.append('        if rec.get("series_id") != series_id:')
                  out.append("            continue")
                  inserted.add(pending)
                  pending=None
          if inserted != {"decision","revalidation"}:
              raise SystemExit("active-series filter insertion incomplete: "+repr(inserted))
          p.write_text("\n".join(out)+"\n","utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/paper-runtime-reconciliation-audit.py
          git commit -m "ops: filter reconciliation audit to active series"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
