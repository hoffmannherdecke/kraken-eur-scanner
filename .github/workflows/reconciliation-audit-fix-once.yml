name: Reconciliation audit active-series fix once

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconciliation-audit-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch active-series decision filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tools/paper-runtime-reconciliation-audit.py")
          c=p.read_text("utf-8")

          old='''        except Exception as exc:
              findings.append({"severity": "CRITICAL", "code": "DECISION_INVALID_JSON", "file": str(path), "detail": str(exc)})
              continue
          cid = str(rec.get("candidate_id") or "")
          if cid:
              decisions[cid] = (path, rec)
          '''
          new='''        except Exception as exc:
              findings.append({"severity": "CRITICAL", "code": "DECISION_INVALID_JSON", "file": str(path), "detail": str(exc)})
              continue
          if rec.get("series_id") != series_id:
              continue
          cid = str(rec.get("candidate_id") or "")
          if cid:
              decisions[cid] = (path, rec)
          '''
          if old not in c:
              raise SystemExit("decision marker missing")
          c=c.replace(old,new,1)

          old='''        except Exception as exc:
              findings.append({"severity": "CRITICAL", "code": "REVALIDATION_INVALID_JSON", "file": str(path), "detail": str(exc)})
              continue
          cid = str(rec.get("candidate_id") or "")
          if cid:
              revals[cid] = (path, rec)
          '''
          new='''        except Exception as exc:
              findings.append({"severity": "CRITICAL", "code": "REVALIDATION_INVALID_JSON", "file": str(path), "detail": str(exc)})
              continue
          if rec.get("series_id") != series_id:
              continue
          cid = str(rec.get("candidate_id") or "")
          if cid:
              revals[cid] = (path, rec)
          '''
          if old not in c:
              raise SystemExit("revalidation marker missing")
          c=c.replace(old,new,1)
          p.write_text(c,"utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/paper-runtime-reconciliation-audit.py
          git commit -m "ops: filter reconciliation audit to active series"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
