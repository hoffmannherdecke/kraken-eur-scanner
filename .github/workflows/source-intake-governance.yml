name: Source intake governance

'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/source-registry.json'
      - 'research/market-source-candidates-v1.json'
      - 'docs/market-source-autonomy-v1.md'
      - 'tools/validate-market-source-catalog.py'
      - '.github/workflows/source-intake-governance.yml'
  push:
    branches: [main]
    paths:
      - 'research/source-registry.json'
      - 'research/market-source-candidates-v1.json'
      - 'docs/market-source-autonomy-v1.md'
      - 'tools/validate-market-source-catalog.py'
      - 'docs/source-intake-policy.md'
      - 'docs/storage-retention-policy.md'
      - 'tools/validate-source-registry.py'
      - '.github/workflows/source-intake-governance.yml'

permissions:
  contents: read

concurrency:
  group: source-intake-governance
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile validator
        run: python -m py_compile tools/validate-source-registry.py tools/validate-market-source-catalog.py

      - name: Validate canonical source registry
        run: python tools/validate-source-registry.py

      - name: Validate optional source discovery catalog (NO live authority)
        run: python tools/validate-market-source-catalog.py

      - name: Fail-closed fake unattended-source proof check
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('research/market-source-candidates-v1.json').read_text())
          d['candidates'][0]['automated_runtime_verified']=True
          d['candidates'][0].pop('runtime_evidence_url',None)
          d['candidates'][0].pop('runtime_verified_at_utc',None)
          p=Path(os.environ['RUNNER_TEMP'])/'source-catalog-fake-e2e.json'
          p.write_text(json.dumps(d))
          PY
          if python tools/validate-market-source-catalog.py --catalog "$RUNNER_TEMP/source-catalog-fake-e2e.json"; then
            echo "ERROR: unverified automated source was accepted"
            exit 1
          else
            echo "FAKE_SOURCE_E2E_FAIL_CLOSED PASS"
          fi

      - name: Fail-closed duplicate storage smoke
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=json.loads(Path("research/source-registry.json").read_text("utf-8"))
          src["sources"][0]["duplicate_raw_storage_allowed"]=True
          src["sources"][0].pop("duplicate_storage_justification",None)
          p=Path(os.environ["RUNNER_TEMP"])/"bad-source-registry.json"
          p.write_text(json.dumps(src),encoding="utf-8")
          PY
          if python tools/validate-source-registry.py --registry "$RUNNER_TEMP/bad-source-registry.json"; then
            echo "ERROR: unjustified duplicate raw storage was accepted"
            exit 1
          else
            echo "DUPLICATE_STORAGE_FAIL_CLOSED PASS"
          fi
