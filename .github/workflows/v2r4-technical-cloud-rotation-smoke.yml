name: V2R4 technical cloud rotation - disposable SQL gate

'on':
  pull_request:
    paths:
      - 'supabase/v2r4-technical-paper-rotation-20261009.sql'
      - 'tests/sql/v2r4_technical_rotation_smoke.sql'
      - '.github/workflows/v2r4-technical-cloud-rotation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Validate atomic cutover, fail-closed and idempotent replay
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/v2r4_technical_rotation_smoke.sql
          echo TECHNICAL_ROTATION_SQL_DISPOSABLE_GATE_OK
