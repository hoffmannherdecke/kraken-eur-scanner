name: Scanner timing evidence sync

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'handoff_queue/**'
      - 'tools/supabase-scanner-timing-sync.py'
      - '.github/workflows/scanner-timing-sync.yml'
  schedule:
    - cron: '12,42 * * * *'
  workflow_run:
    workflows: ['Kraken EUR early sensor']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: scanner-timing-evidence-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate archive credentials
        env:
          SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os
          key=(os.getenv("SUPABASE_SECRET_KEY") or os.getenv("SUPABASE_SERVICE_ROLE_KEY") or "").strip()
          if not key:
              raise SystemExit("Supabase archive credential missing")
          print("SCANNER_TIMING_ARCHIVE_CREDENTIAL configured")
          PY
      - name: Sync scanner detection timestamps
        env:
          SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/supabase-scanner-timing-sync.py
