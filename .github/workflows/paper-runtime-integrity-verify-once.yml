name: Paper runtime integrity verify once

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-runtime-integrity-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile runtime sources
        run: |
          python -m py_compile paper_followup.py paper_evaluator/evaluate.py paper_evaluator/revalidate.py
      - name: Verify followup no-op stability
        run: |
          python - <<'PY'
          import copy
          import paper_followup as pf

          complete = {
              str(h): {
                  "complete": True,
                  "mfe_pct": 1.0,
                  "mae_pct": -1.0,
                  "end_close_pct": 0.0,
              }
              for h in pf.OPPORTUNITY_HORIZONS
          }
          rec = {
              "opportunity_audit": {
                  "schema_version": 1,
                  "purpose": "measure whether 'already moved/too late' was truly untradeable after scanner detection",
                  "candidate_detected_at_utc": "2026-10-01T00:00:00Z",
                  "detection_price_eur": 1.0,
                  "evaluated_at_utc": "2026-10-01T00:00:20Z",
                  "evaluation_ask_eur": 1.0,
                  "detected_to_evaluation_complete_seconds": 20.0,
                  "scan_step_started_at_utc": "2026-09-30T23:59:50Z",
                  "reason_codes": ["TEST"],
                  "setup_lane": "NONE",
                  "flagged_as_already_run": False,
                  "scanner_snapshot": {},
                  "horizons": complete,
                  "classification": "PENDING_REVIEW",
                  "objective_flags_24h": {
                      "continuation_ge_2pct": False,
                      "continuation_ge_5pct": False,
                      "drawdown_le_minus_2pct": False,
                  },
                  "updated_at_utc": "2026-10-01T01:00:00Z",
              }
          }
          d = {
              "timing": {
                  "candidate_detected_at_utc": "2026-10-01T00:00:00Z",
                  "detected_to_evaluation_complete_seconds": 20.0,
                  "scan_step_started_at_utc": "2026-09-30T23:59:50Z",
              },
              "evaluated_at_utc": "2026-10-01T00:00:20Z",
              "fresh_kraken_ticker": {"ask": 1.0},
              "decision": {"reason_codes": ["TEST"], "setup_lane": "NONE"},
          }
          before = copy.deepcopy(rec)
          changed = pf.ensure_opportunity_audit(rec, d, None, "BTCEUR")
          assert changed is False, changed
          assert rec == before, (rec, before)
          print("FOLLOWUP_NOOP_STABILITY_PASS")
          PY
      - name: Verify deterministic staged-change detection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q
          git config user.name test
          git config user.email test@example.invalid
          mkdir -p paper_decisions paper_followups
          echo '{}' > paper_decisions/base.json
          echo '{}' > paper_followups/base.json
          git add .
          git commit -qm init
          for i in $(seq 1 500); do echo '{"x":1}' > "paper_followups/$i.json"; done
          echo '{"candidate":1}' > paper_decisions/new.json
          git add paper_decisions/ paper_followups/
          if git diff --cached --quiet; then
            echo "expected staged changes"; exit 1
          fi
          echo "DETERMINISTIC_STAGE_DETECTION_PASS"
