name: V2R4 release contract guard

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json'
      - 'research/v2r4/README_RELEASE_CANDIDATE.md'
      - 'docs/v2r4-**'
      - 'docs/master-version-register.md'
      - 'docs/strategy-version-map.md'
      - '.github/workflows/v2r4-release-contract-guard.yml'
  push:
    branches: [main]
    paths:
      - 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json'
      - 'research/v2r4/README_RELEASE_CANDIDATE.md'
      - 'docs/v2r4-**'
      - 'docs/master-version-register.md'
      - 'docs/strategy-version-map.md'
      - '.github/workflows/v2r4-release-contract-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate V2R4 first-series contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/v2r4/paper_strategy_spec_v2r4_release_candidate.json')
          j=json.loads(p.read_text('utf-8'))
          assert j['status']=='PREPARED_NOT_ACTIVE_RELEASE_CONTRACT'
          assert j['paper_only'] is True
          assert j['real_money_actions_enabled'] is False
          e=j['entry']
          assert e['simulation_sizing_mode']=='FIXED_V2R3_PARITY'
          assert e['scout_notional_eur']==50
          assert e['stage2_notional_eur']==50
          assert e['target_total_notional_eur']==100
          assert e['adaptive_sizing_enabled'] is False
          g=j['activation_gates']
          for key in (
            'v2r3_completion_ready_required',
            'v2r3_integrity_healthy_required',
            'v2r3_final_review_allowed_required',
            'v2r3_final_causal_review_completed_required',
            'predecessor_successor_migration_review_completed_required',
          ):
              assert g[key] is True, key
          assert g['v2r4_activation_readiness_state_required']=='MANUAL_RELEASE_REVIEW_REQUIRED'
          assert g['explicit_release_decision_required']=='APPROVED_PAPER'
          assert g['automatic_activation_allowed'] is False
          assert g['runtime_evidence_storage']=='SUPABASE_PRIMARY_BOUNDED_LOCAL_STATE_NO_PER_EVENT_GIT_COMMITS'
          assert j['measurement']['git_runtime_event_commits_allowed'] is False
          assert 1440 in j['measurement']['followup_horizons_minutes']
          assert 'pnl_by_simulation_size_tier' not in j['measurement']['compare_metrics']
          d=j['decision_policy']
          assert d['major_market_regime_role']=='INHERIT_FROZEN_V2R3_BEHAVIOR_FIRST_SERIES'
          assert d['derivatives_role']=='INHERIT_FROZEN_V2R3_BEHAVIOR_FIRST_SERIES'
          assert d['coin_specific_catalyst_role']=='INHERIT_FROZEN_V2R3_BEHAVIOR_FIRST_SERIES'
          assert d['role_relaxations_status']=='DEFERRED_PENDING_SEPARATE_EVIDENCE_AND_EXPLICIT_MIGRATION_DISPOSITION'
          assert j['deferred_research']['adaptive_sizing']['status']=='DEFER_TO_LATER_GENERATION'
          assert j['deferred_research']['decision_role_relaxations']['status']=='DEFER_TO_LATER_GENERATION'
          print('V2R4_RELEASE_CONTRACT_GUARD_PASS')
          PY
      - name: Reject obsolete activation shortcut wording
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('research/v2r4/README_RELEASE_CANDIDATE.md').read_text('utf-8')
          assert 'Technical smoke success is necessary but **never sufficient**' in text
          assert 'automatic_activation_allowed' in text
          assert '50 EUR scout + 50 EUR stage 2' in text
          assert 'No V2R4 or later runtime may reproduce' in text
          print('V2R4_RELEASE_DOC_GUARD_PASS')
          PY

      - name: Validate canonical V2R4 governance consistency
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              'docs/master-version-register.md',
              'docs/strategy-version-map.md',
              'docs/v2r4-paper-activation-checklist.md',
              'docs/v2r4-release-readiness.md',
              'docs/v2r4-v2r3-release-diff.md',
          ]
          docs = {p: Path(p).read_text('utf-8') for p in paths}
          joined = '\n'.join(docs.values())

          # Never allow accidental repeated replacement artifacts.
          for bad in ('superseded superseded', 'Draft-the superseded', 'the superseded Draft-the'):
              assert bad not in joined, bad

          master = docs['docs/master-version-register.md']
          assert 'CLEAN-MAIN RELEASE CONTRACT' in master
          assert 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json' in master
          assert 'release diff / sizing decision — updated 2026-10-05' in master
          assert 'Strategy mechanics remain `OPEN_RESEARCH`' not in master

          strategy = docs['docs/strategy-version-map.md']
          assert 'research/v2r4/paper_strategy_spec_v2r4_release_candidate.json' in strategy
          assert '50 EUR Scout + 50 EUR Stage 2' in strategy

          checklist = docs['docs/v2r4-paper-activation-checklist.md']
          assert 'Binding machine contract: `research/v2r4/paper_strategy_spec_v2r4_release_candidate.json`' in checklist
          assert 'first full V2R4 Paper series' in checklist
          assert '50 EUR scout + 50 EUR stage 2' in checklist

          readiness = docs['docs/v2r4-release-readiness.md']
          assert 'prepared binding machine contract is `research/v2r4/paper_strategy_spec_v2r4_release_candidate.json`' in readiness
          assert 'first-series sizing is already bindingly fixed at 50+50 EUR' in readiness

          diff = docs['docs/v2r4-v2r3-release-diff.md']
          assert 'Binding first-series release contract: `research/v2r4/paper_strategy_spec_v2r4_release_candidate.json`' in diff
          assert 'V2R4 code candidate: Draft-PR #9' not in diff
          assert 'historical V2R4 proposal was **not purely a timing-only change**' in diff
          assert 'INHERIT frozen V2R3 behavior for first series' in diff
          assert '24h follow-up' in diff

          print('V2R4_GOVERNANCE_CONSISTENCY_PASS')
          PY
