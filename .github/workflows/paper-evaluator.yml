name: Paper runtime evaluator and lifecycle

'on':
  # Normal execution is dispatched directly by the scanner. The independent watchdog
  # performs bounded recovery for orphaned candidates. A separate cron fallback was
  # removed because GitHub schedule jitter could create a stale-head persistence race.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-runtime-v2r2
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Sync stateful runtime to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PAPER_RUNTIME_BASE_SHA=$(git rev-parse HEAD)"

      - name: Preflight and select prospective candidates
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "BLOCKER missing OPENAI_API_KEY"; exit 2; }
          python -m py_compile             paper_context.py paper_followup.py paper_position_tracker.py             paper_evaluator/evaluate.py paper_evaluator/revalidate.py paper_evaluator/slack_action_push.py
          mkdir -p .paper-work
          python - <<'PY'
          import json, time
          from datetime import datetime
          from pathlib import Path

          control=json.loads(Path("paper_runtime_control.json").read_text("utf-8"))
          if control.get("enabled") is not True:
              Path(".paper-work/candidates.json").write_text("[]\n")
              print("PAPER_RUNTIME_DISABLED")
              raise SystemExit(0)

          series_id=control["series_id"]
          target=int(control.get("target_completed_paper_trades",20))
          closed=0
          for p in Path("paper_positions").glob("*.json") if Path("paper_positions").exists() else []:
              try:
                  d=json.loads(p.read_text("utf-8"))
                  if d.get("series_id")==series_id and d.get("status")=="CLOSED":
                      closed+=1
              except Exception:
                  pass

          start_ts=int(datetime.fromisoformat(control["series_started_at_utc"].replace("Z","+00:00")).timestamp())
          rows=[]
          if closed < target:
              now=int(time.time())
              for p in Path("handoff_queue").glob("*.json"):
                  try:
                      d=json.loads(p.read_text("utf-8"))
                      age=now-int(d["event_ts"])
                      if int(d["event_ts"])>=start_ts and 0<=age<=3600 and not (Path("paper_decisions")/p.name).exists():
                          rows.append((int(d["event_ts"]),str(p)))
                  except Exception:
                      continue
          else:
              print("PAPER_TARGET_REACHED",closed,target)

          changed=[p for _,p in sorted(rows)][:8]
          Path(".paper-work/candidates.json").write_text(json.dumps(changed)+"\n")
          print("PAPER_SELECTED",json.dumps(changed))
          PY

      - name: Evaluate new prospective candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          for p in json.load(open(".paper-work/candidates.json")):
              subprocess.run(["python","paper_evaluator/evaluate.py",p],check=True)
          PY

      - name: Revalidate all due WAIT decisions
        run: |
          set -euo pipefail
          PYTHONPATH=paper_evaluator python paper_evaluator/revalidate.py

      - name: Advance open paper positions
        run: |
          set -euo pipefail
          python paper_position_tracker.py

      - name: Update compact missed-move follow-up
        run: |
          set -euo pipefail
          python paper_followup.py

      - name: Build actionable notification manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          files=[]
          for directory in ("paper_decisions","paper_revalidations"):
              if not Path(directory).exists():
                  continue
              out=subprocess.check_output(["git","status","--porcelain",directory],text=True)
              for line in out.splitlines():
                  if len(line)>=4:
                      p=line[3:].strip()
                      if p.endswith(".json"):
                          files.append(p)
          Path(".paper-work/action-files.json").write_text(json.dumps(sorted(set(files)))+"\n")
          print("PAPER_ACTION_MANIFEST",json.dumps(sorted(set(files))))
          PY

      - name: Validate active-series safety and persist runtime state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          control=json.loads(Path("paper_runtime_control.json").read_text("utf-8"))
          series_id=control["series_id"]
          test_id=control["test_id"]

          for directory in ("paper_decisions","paper_revalidations"):
              if not Path(directory).exists():
                  continue
              for p in Path(directory).glob("*.json"):
                  d=json.loads(p.read_text("utf-8"))
                  if d.get("series_id")!=series_id:
                      continue
                  assert d["test_id"]==test_id
                  assert d["real_money_actions_enabled"] is False
                  assert d["decision"]["decision"] in {"BUY_SCOUT","WAIT","REJECT"}
                  if d["decision"]["decision"]=="BUY_SCOUT":
                      assert d["paper_entry"]
                      assert d["paper_entry"]["stage2_plan"]["status"]=="PENDING"
                      assert float(d["paper_entry"]["stage2_plan"]["trigger_eur"])>float(d["paper_entry"]["fill_price_eur"])

          if Path("paper_positions").exists():
              for p in Path("paper_positions").glob("*.json"):
                  d=json.loads(p.read_text("utf-8"))
                  if d.get("series_id")!=series_id:
                      continue
                  assert d["kind"] in {"PAPER_POSITION_V2","PAPER_POSITION_V3"}
                  assert d["real_money_actions_enabled"] is False
                  assert d["status"] in {"OPEN","CLOSED","UNVERIFIED"}
                  assert float(d["active_stop_eur"])>0
                  if d["status"]=="CLOSED":
                      assert d["exit"] is not None

          print("PAPER_RUNTIME_SAFETY_GATE_PASS",series_id)
          PY

          if git status --porcelain -- paper_decisions paper_revalidations paper_positions paper_followups 2>/dev/null | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper_decisions/ paper_revalidations/ 2>/dev/null || true
            git add paper_positions/ paper_followups/ 2>/dev/null || true
            git commit -m "[paper-runtime] persist active-series state"
            pushed=false
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$pushed" = "true" || { echo "paper state push failed after retries"; exit 1; }
          else
            echo "PAPER_RUNTIME_NO_STATE_CHANGES"
          fi

      - name: Push actionable paper signal to Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_ID: U0C39EDQ1H8
        run: |
          set -euo pipefail
          python paper_evaluator/slack_action_push.py .paper-work/action-files.json

      - name: Persist Slack alert receipts
        if: always()
        run: |
          set -euo pipefail
          if git status --porcelain paper_alerts/ 2>/dev/null | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper_alerts/
            git commit -m "[paper-alert] persist Slack alert receipt"
            pushed=false
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$pushed" = "true" || { echo "paper alert receipt push failed after retries"; exit 1; }
          else
            echo "NO_NEW_SLACK_ALERT_RECEIPTS"
          fi
