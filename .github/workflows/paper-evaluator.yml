name: Paper V2 candidate evaluator

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'handoff_queue/*.json'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: paper-v2-evaluator
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Preflight and select prospective candidates
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "BLOCKER missing OPENAI_API_KEY"; exit 2; }
          python -m py_compile paper_evaluator/evaluate.py paper_evaluator/slack_action_push.py
          mkdir -p .paper-work
          python - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime
          from pathlib import Path

          control=json.loads(Path("paper_runtime_control.json").read_text("utf-8"))
          if control.get("enabled") is not True:
              Path(".paper-work/candidates.json").write_text("[]\n")
              print("PAPER_RUNTIME_DISABLED")
              raise SystemExit(0)

          current_test_id=control.get("test_id","SHADOW-V2-20260924-01")
          target=int(control.get("target_completed_paper_trades",20))
          closed=0
          for p in Path("paper_positions").glob("*.json") if Path("paper_positions").exists() else []:
              try:
                  d=json.loads(p.read_text("utf-8"))
                  if d.get("test_id")==current_test_id and d.get("status")=="CLOSED":
                      closed+=1
              except Exception:
                  pass
          if closed >= target:
              Path(".paper-work/candidates.json").write_text("[]\n")
              print("PAPER_TARGET_REACHED",closed,target)
              raise SystemExit(0)

          start_iso=control.get("series_started_at_utc")
          start_ts=(int(datetime.fromisoformat(start_iso.replace("Z","+00:00")).timestamp())
                    if start_iso else 1790532491)
          changed=[]
          if os.environ.get("GITHUB_EVENT_NAME")=="push":
              try:
                  out=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True)
                  changed=[x for x in out.splitlines() if x.startswith("handoff_queue/") and x.endswith(".json")]
              except Exception:
                  pass
          if not changed:
              now=int(time.time())
              rows=[]
              for p in Path("handoff_queue").glob("*.json"):
                  try:
                      d=json.loads(p.read_text())
                      age=now-int(d["event_ts"])
                      if int(d["event_ts"]) >= start_ts and 0 <= age <= 3600 and not (Path("paper_decisions")/p.name).exists():
                          rows.append((int(d["event_ts"]),str(p)))
                  except Exception:
                      continue
              changed=[p for _,p in sorted(rows,reverse=True)]
          changed=changed[:3]
          if not changed:
              print("PAPER_NO_UNPROCESSED_RECENT_CANDIDATES")
              Path(".paper-work/candidates.json").write_text("[]\n")
          else:
              Path(".paper-work/candidates.json").write_text(json.dumps(changed)+"\n")
              print("PAPER_SELECTED",json.dumps(changed))
          Path(".paper-work/candidates.json").write_text(json.dumps(changed)+"\n")
          print("PAPER_SELECTED",json.dumps(changed))
          PY
      - name: Evaluate frozen V2 paper decisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          for p in json.load(open(".paper-work/candidates.json")):
              subprocess.run(["python","paper_evaluator/evaluate.py",p],check=True)
          PY
      - name: Build action notification manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=[]
          for src in json.load(open(".paper-work/candidates.json")):
              target=Path("paper_decisions")/Path(src).name
              if target.exists():
                  files.append(str(target))
          Path(".paper-work/action-files.json").write_text(json.dumps(files)+"\n")
          print("PAPER_ACTION_MANIFEST",json.dumps(files))
          PY
      - name: Validate safety and persist append-only decisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("paper_decisions").glob("*.json"))
          if not files: raise SystemExit("no paper decision persisted")
          for p in files:
              d=json.loads(p.read_text())
              assert d["real_money_actions_enabled"] is False
              assert d["kind"]=="PAPER_V2_DECISION_V1"
              assert d["test_id"]=="SHADOW-V2-20260924-01"
              assert d["decision"]["decision"] in {"BUY_SCOUT","WAIT","REJECT"}
              if d["decision"]["decision"]=="BUY_SCOUT":
                  assert d["paper_entry"] and d["paper_entry"]["status"].startswith("FILLED_SIMULATED")
          print("PAPER_SAFETY_GATE_PASS")
          PY
          if git status --porcelain paper_decisions/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper_decisions/
            git commit -m "[paper-eval] persist frozen V2 decision"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "PAPER_NO_NEW_DECISIONS"
          fi
      - name: Push actionable paper signal to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_ID: U0C39EDQ1H8
        run: |
          set -euo pipefail
          python paper_evaluator/slack_action_push.py .paper-work/action-files.json
      - name: Persist Slack alert receipts
        run: |
          set -euo pipefail
          if git status --porcelain paper_alerts/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper_alerts/
            git commit -m "[paper-alert] persist Slack alert receipt"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "NO_NEW_SLACK_ALERT_RECEIPTS"
          fi
