name: Historical data preflight

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/historical/**'
      - 'tools/kraken-historical-preflight.py'
      - 'tools/historical-pit-smoke.py'
      - 'tools/historical-trial-ledger.py'
      - 'tools/prepare-minipc-historical-research.ps1'
      - 'tools/download-kraken-ohlcvt-full.ps1'
      - 'tools/inspect-kraken-ohlcvt-archive.py'
      - 'tools/extract-kraken-ohlcvt-eur15.py'
      - 'tools/cleanup-verified-kraken-ohlcvt-parts.ps1'
      - 'tools/normalize-kraken-eur15.py'
      - 'tools/historical-real-pair-replay-smoke.py'
      - 'tools/historical-real-pair-replay-smoke-v2.py'
      - 'tools/historical-broad-pit-smoke.py'
      - 'tools/run-minipc-eur15-normalization.ps1'
      - 'tools/record-real-pair-replay-trial.py'
      - 'tools/run-minipc-broad-pit-v2.ps1'
      - '.github/workflows/historical-data-preflight.yml'

permissions:
  contents: read

concurrency:
  group: historical-data-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile metadata-only tools
        run: |
          python -m py_compile tools/kraken-historical-preflight.py
          python -m py_compile tools/historical-pit-smoke.py
          python -m py_compile tools/historical-trial-ledger.py
          python -m py_compile tools/inspect-kraken-ohlcvt-archive.py
          python -m py_compile tools/extract-kraken-ohlcvt-eur15.py
          python -m py_compile tools/normalize-kraken-eur15.py
          python -m py_compile tools/historical-real-pair-replay-smoke.py
          python -m py_compile tools/historical-real-pair-replay-smoke-v2.py
          python -m py_compile tools/historical-broad-pit-smoke.py
          python -m py_compile tools/record-real-pair-replay-trial.py

      - name: Validate no-download Kraken manifest
        run: |
          python tools/kraken-historical-preflight.py

      - name: Run synthetic point-in-time smoke
        run: |
          python tools/historical-pit-smoke.py

      - name: Validate trial-ledger schema JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/historical/trial-ledger-schema.json")
          obj=json.loads(p.read_text("utf-8"))
          assert obj["schema_version"] == 1
          assert obj["kind"] == "HISTORICAL_TRIAL_LEDGER_SCHEMA_V1"
          assert obj["baseline_execution"]["taker_fee_pct_per_side"] == 0.60
          assert obj["baseline_execution"]["leverage"] is False
          required=set(obj["required_fields"])
          for name in (
              "trial_id","dataset_sha256","train_window","validation_window",
              "holdout_window","purge_seconds","embargo_seconds","metrics"
          ):
              assert name in required, name
          print("TRIAL_LEDGER_SCHEMA PASS")
          PY

      - name: Smoke immutable trial ledger
        run: |
          DB="$RUNNER_TEMP/historical-trial-ledger.sqlite3"
          python tools/historical-trial-ledger.py --db "$DB" init
          python tools/historical-trial-ledger.py --db "$DB" append \
            --record research/historical/fixtures/trial-record-sample.json
          python tools/historical-trial-ledger.py --db "$DB" verify
          if python tools/historical-trial-ledger.py --db "$DB" append \
            --record research/historical/fixtures/trial-record-sample.json; then
            echo "ERROR: immutable ledger accepted duplicate trial_id"
            exit 1
          else
            echo "IMMUTABILITY_GUARD PASS: duplicate trial_id rejected"
          fi

      - name: PowerShell MINI-PC plan-only smoke
        shell: pwsh
        run: |
          ./tools/prepare-minipc-historical-research.ps1

      - name: Guarded OHLCVT downloader plan-only smoke
        shell: pwsh
        run: |
          ./tools/download-kraken-ohlcvt-full.ps1 | Tee-Object -Variable plan
          if (($plan -join [Environment]::NewLine) -notmatch '"status":\s*"PLAN_ONLY"') {
            throw "Downloader did not remain plan-only in CI"
          }
          if (($plan -join [Environment]::NewLine) -notmatch '"downloads_performed":\s*false') {
            throw "Downloader plan violated no-download guardrail"
          }

      - name: Smoke archive inspector on synthetic ZIP
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path("/tmp/kraken-synthetic.zip")
          manifest={"kind":"synthetic","build":"ci"}
          with zipfile.ZipFile(p,"w",compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr("MANIFEST.json", json.dumps(manifest))
              z.writestr("XBTEUR_15.csv", "1,2,3,4,5,6,7\n")
              z.writestr("ETHEUR_60.csv", "1,2,3,4,5,6,7\n")
              z.writestr("SOLUSD_15.csv", "1,2,3,4,5,6,7\n")
          PY
          python tools/inspect-kraken-ohlcvt-archive.py /tmp/kraken-synthetic.zip | tee /tmp/archive-inspect.txt
          grep -q '"status": "PASS"' /tmp/archive-inspect.txt
          grep -q '"likely_eur_15m_count": 1' /tmp/archive-inspect.txt

      - name: Smoke selective EUR15 extractor
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path("/tmp/kraken-eur15-synthetic.zip")
          with zipfile.ZipFile(p,"w",compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr("XBTEUR_15.csv", "1,2,3,4,5,6,7\n2,2,3,4,5,6,7\n")
              z.writestr("ETHEUR_15.csv", "1,2,3,4,5,6,7\n")
              z.writestr("SOLEUR_60.csv", "1,2,3,4,5,6,7\n")
          PY
          python - <<'PY'
          import hashlib, importlib.util, pathlib, sys, zipfile
          mod_path=pathlib.Path("tools/extract-kraken-ohlcvt-eur15.py")
          spec=importlib.util.spec_from_file_location("extractor", mod_path)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          p=pathlib.Path("/tmp/kraken-eur15-synthetic.zip")
          m.EXPECTED_ARCHIVE_SHA256=hashlib.sha256(p.read_bytes()).hexdigest()
          sys.argv=["extractor",str(p),"/tmp/eur15-out","/tmp/eur15-catalog.json","--expected-count","2","--validate-csv"]
          raise SystemExit(m.main())
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/eur15-catalog.json").read_text())
          assert j["status"]=="PASS"
          assert j["file_count"]==2
          assert all(e["csv_validation"]["bad_column_rows"]==0 for e in j["entries"])
          print("EUR15_EXTRACTOR PASS")
          PY

      - name: Smoke deterministic EUR15 normalizer
        run: |
          mkdir -p /tmp/eur15-normalize-src
          python - <<'PY'
          from pathlib import Path
          root=Path("/tmp/eur15-normalize-src")
          rows=[]
          for i in range(40):
              # Deliberately skip exactly one 15m interval after row 19.
              slot=i if i < 20 else i + 1
              ts=slot*900
              base=100.0+i
              rows.append(f"{ts},{base},{base+1},{base-1},{base+0.5},{10+i},{5+i}\n")
          (root/"XBTEUR_15.csv").write_text("".join(rows))
          (root/"ETHEUR_15.csv").write_text(
              "0,10,11,9,10.5,20,8\n900,10.5,11.5,10,11,22,9\n"
          )
          PY
          python tools/normalize-kraken-eur15.py \
            /tmp/eur15-normalize-src /tmp/eur15-normalized-a /tmp/eur15-normalized-a.json \
            --expected-count 2
          python tools/normalize-kraken-eur15.py \
            /tmp/eur15-normalize-src /tmp/eur15-normalized-b /tmp/eur15-normalized-b.json \
            --expected-count 2
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          a=json.loads(Path("/tmp/eur15-normalized-a.json").read_text())
          b=json.loads(Path("/tmp/eur15-normalized-b.json").read_text())

          assert a["status"]=="PASS"
          assert a["schema_version"]=="KRAKEN_EUR15_NORMALIZED_V1"
          assert a["file_count"]==2
          assert a["total_gap_events"]==1
          assert a["total_missing_intervals_not_filled"]==1
          assert a["point_in_time_contract"]["synthetic_gap_fill_used"] is False
          assert a["point_in_time_contract"]["feature_visibility_rule"]=="bar_end_epoch <= data_cutoff_epoch"

          for name in ("XBTEUR_15.normalized.csv.gz","ETHEUR_15.normalized.csv.gz"):
              da=hashlib.sha256((Path("/tmp/eur15-normalized-a")/name).read_bytes()).hexdigest()
              db=hashlib.sha256((Path("/tmp/eur15-normalized-b")/name).read_bytes()).hexdigest()
              assert da==db, name

          print("EUR15_NORMALIZER PASS deterministic/no-gap-fill/explicit-close-time")
          PY

      - name: Smoke real-pair point-in-time replay methodology
        run: |
          python tools/historical-real-pair-replay-smoke.py \
            /tmp/eur15-normalized-a/XBTEUR_15.normalized.csv.gz \
            --lookback-bars 13 --horizon-bars 1 \
            --output /tmp/real-pair-replay-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/real-pair-replay-smoke.json").read_text())
          assert j["status"]=="PASS"
          assert j["decision"]["point_in_time_assertions"]["future_bar_in_features"] is False
          assert j["label"]["generated_after_decision_freeze"] is True
          assert j["guardrails"]["historical_strategy_tuning_performed"] is False
          print("REAL_PAIR_PIT_REPLAY PASS")
          PY

      - name: Smoke contiguous wall-clock PIT replay V2
        run: |
          python tools/historical-real-pair-replay-smoke-v2.py \
            /tmp/eur15-normalized-a/XBTEUR_15.normalized.csv.gz \
            --lookback-bars 13 --horizon-bars 1 \
            --output /tmp/real-pair-replay-smoke-v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/real-pair-replay-smoke-v2.json").read_text())
          assert j["status"]=="PASS"
          assert j["decision"]["point_in_time_assertions"]["future_bar_in_features"] is False
          assert j["decision"]["point_in_time_assertions"]["history_contiguous_15m"] is True
          assert j["decision"]["point_in_time_assertions"]["return_1h_exact_wall_clock"] is True
          assert j["decision"]["point_in_time_assertions"]["return_3h_exact_wall_clock"] is True
          assert j["label"]["future_contiguous_15m"] is True
          assert j["label"]["horizon_wall_clock_seconds"]==900
          print("REAL_PAIR_PIT_REPLAY_V2 PASS contiguous/wall-clock exact")
          PY

      - name: Smoke broad deterministic PIT methodology
        run: |
          python tools/historical-broad-pit-smoke.py \
            /tmp/eur15-normalized-a \
            --repo-root . \
            --expected-count 2 \
            --pair-count 1 \
            --anchors-per-pair 2 \
            --lookback-bars 13 \
            --horizon-bars 1 \
            --output /tmp/broad-pit-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/broad-pit-smoke.json").read_text())
          assert j["status"]=="PASS"
          assert j["selected_pair_count"]==1
          assert j["case_count"]==2
          assert j["selection_contract"]["performance_used_for_selection"] is False
          assert all(v==0 for k,v in j["integrity_summary"].items() if k!="unique_decision_hashes")
          assert j["integrity_summary"]["unique_decision_hashes"]==2
          assert j["guardrails"]["performance_claim_made"] is False
          print("BROAD_PIT_SMOKE PASS deterministic/no-leakage/no-performance-selection")
          PY

      - name: Smoke real-pair replay Trial Ledger record
        run: |
          python tools/record-real-pair-replay-trial.py \
            --normalization-catalog /tmp/eur15-normalized-a.json \
            --replay-report /tmp/real-pair-replay-smoke.json \
            --db /tmp/real-pair-trial-ledger.sqlite3 \
            --schema research/historical/trial-ledger-schema.json \
            --output-record /tmp/real-pair-trial-record.json \
            --repo-root . \
            --expected-normalized-count 2
          python tools/record-real-pair-replay-trial.py \
            --normalization-catalog /tmp/eur15-normalized-a.json \
            --replay-report /tmp/real-pair-replay-smoke.json \
            --db /tmp/real-pair-trial-ledger.sqlite3 \
            --schema research/historical/trial-ledger-schema.json \
            --output-record /tmp/real-pair-trial-record.json \
            --repo-root . \
            --expected-normalized-count 2
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          rec=json.loads(Path("/tmp/real-pair-trial-record.json").read_text())
          assert rec["metrics"]["methodology_integrity_only"] is True
          assert rec["metrics"]["performance_interpretation_allowed"] is False
          con=sqlite3.connect("/tmp/real-pair-trial-ledger.sqlite3")
          try:
              count=con.execute("select count(*) from trials").fetchone()[0]
          finally:
              con.close()
          assert count==1
          print("REAL_PAIR_TRIAL_LEDGER PASS idempotent/immutable")
          PY

      - name: Smoke V2 replay Trial Ledger record
        run: |
          python tools/record-real-pair-replay-trial.py \
            --normalization-catalog /tmp/eur15-normalized-a.json \
            --replay-report /tmp/real-pair-replay-smoke-v2.json \
            --db /tmp/real-pair-v2-trial-ledger.sqlite3 \
            --schema research/historical/trial-ledger-schema.json \
            --output-record /tmp/real-pair-v2-trial-record.json \
            --repo-root . \
            --expected-normalized-count 2
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          rec=json.loads(Path("/tmp/real-pair-v2-trial-record.json").read_text())
          assert rec["strategy_revision"]=="NO_STRATEGY_REPLAY_METHODOLOGY_SMOKE_V2"
          assert rec["metrics"]["methodology_integrity_only"] is True
          con=sqlite3.connect("/tmp/real-pair-v2-trial-ledger.sqlite3")
          try:
              count=con.execute("select count(*) from trials").fetchone()[0]
          finally:
              con.close()
          assert count==1
          print("REAL_PAIR_V2_TRIAL_LEDGER PASS")
          PY

      - name: MINI-PC broad PIT V2 plan-only smoke
        shell: pwsh
        run: |
          ./tools/run-minipc-broad-pit-v2.ps1 | Tee-Object -Variable plan
          if (($plan -join [Environment]::NewLine) -notmatch '"status":\s*"PLAN_ONLY"') {
            throw "broad PIT V2 orchestrator did not remain plan-only"
          }
          if (($plan -join [Environment]::NewLine) -notmatch '"performance_backtest_started":\s*false') {
            throw "broad PIT V2 orchestrator plan violated methodology-only guardrail"
          }

      - name: MINI-PC EUR15 normalization plan-only smoke
        shell: pwsh
        run: |
          ./tools/run-minipc-eur15-normalization.ps1 | Tee-Object -Variable plan
          if (($plan -join [Environment]::NewLine) -notmatch '"status":\s*"PLAN_ONLY"') {
            throw "normalization orchestrator did not remain plan-only"
          }
          if (($plan -join [Environment]::NewLine) -notmatch '"network_used":\s*false') {
            throw "normalization orchestrator plan violated offline guardrail"
          }

      - name: Smoke OHLCVT cleanup plan-only
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "Kraken_OHLCVT_Full_2026Q2.zip"
          Set-Content -LiteralPath $temp -Value "synthetic"
          $expected = (Get-FileHash -Algorithm SHA256 -Path $temp).Hash.ToLowerInvariant()
          $script = Get-Content ./tools/cleanup-verified-kraken-ohlcvt-parts.ps1 -Raw
          $script = $script -replace 'fc81b54cba6e12af3e9422dde9416179e6ef76af4831d48d839fbdb43018eaa4', $expected
          $patched = Join-Path $env:RUNNER_TEMP "cleanup.ps1"
          Set-Content -LiteralPath $patched -Value $script
          & $patched -ArchivePath $temp | Tee-Object -Variable plan
          if (($plan -join [Environment]::NewLine) -notmatch '"status":\s*"PLAN_ONLY"') {
            throw "cleanup did not remain plan-only"
          }

      - name: Safety assertion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("research/historical/kraken-historical-manifest.json").read_text())
          assert m["bulk_downloads_allowed"] is False
          assert m["active_strategy_runtime_changes_allowed"] is False
          assert all(d["download_enabled"] is False for d in m["datasets"])
          assert all(d["download_enabled"] is False for d in m["incremental_updates"])
          assert m["storage_guardrails"]["github_actions_bulk_download_allowed"] is False
          print("SAFETY_GUARDRAILS PASS: no downloads, no active runtime mutation")
          PY
