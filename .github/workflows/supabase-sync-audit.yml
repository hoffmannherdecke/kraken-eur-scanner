name: Supabase archive source audit

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_runtime_control.json'
      - 'paper_decisions/**'
      - 'paper_revalidations/**'
      - 'paper_positions/**'
      - 'tools/supabase-sync-audit.py'
      - '.github/workflows/supabase-sync-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit repository-side Supabase archive payload
        run: python tools/supabase-sync-audit.py
