name: Crypto process health watchdog

'on':
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  push:
    branches: [main]
    paths:
      - 'process_audit.py'
      - 'tools/process-health-alert-router.py'
      - 'supabase/process_health_alert_state.sql'
      - '.github/workflows/process-health.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: crypto-process-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate health alert routing logic
        run: |
          python -m py_compile tools/process-health-alert-router.py
          python tools/process-health-alert-router.py --self-test

      - name: Audit full paper chain and bounded self-heal
        shell: bash
        run: |
          set +e
          python process_audit.py
          code=$?
          set -e

          # process_audit.py uses exit 2 for a detected CRITICAL health state.
          # That is an application-level incident, not a broken GitHub workflow:
          # bounded self-healing happens inside the audit; transition-/dedupe-controlled
          # Slack escalation is handled by the next step from process_health.json.
          # Repairable CRITICAL incidents get a 15-minute grace before user-facing
          # escalation; non-repairable integrity/safety faults remain immediate.
          # Keep GitHub "Run failed" (and its email) for unexpected execution failures.
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then
            echo "PROCESS_AUDIT_COMPLETED health_exit=$code"
            exit 0
          fi

          echo "::error::process_audit.py failed unexpectedly with exit code $code"
          exit "$code"
      - name: Route actionable CRITICAL transitions to Slack
        if: always() && hashFiles('process_health.json') != ''
        env:
          SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_ID: U0C39EDQ1H8
        run: python tools/process-health-alert-router.py process_health.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crypto-process-health-${{ github.run_id }}
          path: process_health.json
          retention-days: 7
          if-no-files-found: error
