permissions:
  contents: read

concurrency:
  group: project-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate on-demand context routing and loss-of-context regression tests
        run: |
          python -m py_compile tools/context_before_action.py
          python tools/context_before_action.py --scope strategy > /dev/null
          python tools/context_before_action.py --scope architecture > /dev/null
          python tools/context_before_action.py --scope operations > /dev/null
          python tools/context_before_action.py --scope research > /dev/null
          python -m unittest discover -s tests -p 'test_context_before_action.py' -v
      - name: Validate selective V3 PIT optional-context fusion and source safety
        run: |
          python -m py_compile tools/v3_context_fusion_preflight.py
          python tools/v3_context_fusion_preflight.py > /dev/null
          python -m unittest discover -s tests -p 'test_v3_context_fusion_preflight.py' -v
      - name: Validate V3 controlled cutover goal without runtime activation
        run: |
          python -m py_compile tests/test_v3_paper_transition_contract.py tools/validate-project-current-state.py
          python -m unittest discover -s tests -p 'test_v3_paper_transition_contract.py' -v
      - name: Validate no stale Paper email or duplicate V2R4-V3 series routing
        run: |
          python -m py_compile tools/paper_series_transition_guard.py tools/project_milestone_controller.py
          python -m unittest discover -s tests -p 'test_paper_series_transition_guard.py' -v
      - name: Validate cross-chat V3-B user-approved five-candidate ten-HTTP research cap and MINI-PC wrapper
        run: |
          python -m py_compile paper_evaluator/v3_b_bounded_shadow_five.py
          python -m unittest discover -s tests -p 'test_v3_b_bounded_shadow_five.py' -v
          pwsh -NoProfile -Command '$tokens=$null; $errs=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/run-minipc-v3-b-shadow5.ps1",[ref]$tokens,[ref]$errs) | Out-Null; if ($errs.Count -gt 0) { $errs | Out-String | Write-Error; exit 1 }; Write-Output "V3B_SHADOW5_POWERSHELL_PARSE_PASS"'
      - name: Validate experimental paper A/B one-change and fail-closed economic contract
        run: |
          python -m unittest discover -s tests -p 'test_v3_experimental_continuity_volume_review_v1.py' -v
          python -m unittest discover -s tests -p 'test_v3_paper_experimental_ab_contract.py' -v
      - name: Validate user-approved finite V3 P3 A/B 5-setup HTTP10 6h Mini-PC research
        run: |
          python -m py_compile paper_evaluator/v3_p3_ab_five_bounded_research.py
          python -m unittest discover -s tests -p 'test_v3_p3_ab_five_bounded_research.py' -v
          pwsh -NoProfile -Command '$tokens=$null; $errs=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/run-minipc-v3-p3-ab-five.ps1",[ref]$tokens,[ref]$errs) | Out-Null; if ($errs.Count -gt 0) { $errs | Out-String | Write-Error; exit 1 }; Write-Output "V3_P3_AB_POWERSHELL_PARSE_PASS"'
      - name: Validate inactive V3 P3 future observability without model or runtime execution
        run: |
          python -m py_compile paper_evaluator/v3_p3_future_diagnostics_offline_v1.py
          python -m unittest discover -s tests -p 'test_v3_p3_future_diagnostics_offline_v1.py' -v
      - name: Guard V3 integrated next actions, source research status and shared model eligibility lineage
        run: python -m unittest discover -s tests -p 'test_v3_integrated_readiness_handoff.py' -v
      - name: Validate inactive P3 fresh CONTINUITY and shared fee/stop model gates
        run: python -m unittest discover -s tests -p 'test_v3_continuity_fresh_review_candidate_v1.py' -v
      - name: Validate inactive P2 post-WAIT fresh-review and common V3 economic safety
        run: |
          python -m unittest discover -s tests -p 'test_v3_wait_fresh_review_candidate_v1.py' -v
          python -m unittest discover -s tests -p 'test_v3_full_entry_decision_candidate_v1.py' -v
          python -m unittest discover -s tests -p 'test_v3_second_leg_policy_candidate_v1.py' -v
      - name: Guard cross-version one-change V3 BUY flexibility against premature activation
        run: python -m unittest discover -s tests -p 'test_v3_buy_gate_flexibility_prereg.py' -v
      - name: Validate current state
        run: python tools/validate-project-current-state.py
      - name: Validate strict technical-only experimental Paper release without invented profits
        run: |
          python -m py_compile tools/v3_experimental_paper_technical_gate.py
          python -m unittest discover -s tests -p 'test_v3_experimental_paper_technical_gate.py' -v
      - name: Enforce successor causal-learning and entry-productivity gate
        run: |
          python -m py_compile tools/strategy_successor_gate.py
          python -m unittest discover -s tests -p 'test_strategy_successor_gate.py' -v
      - name: Verify V3 second-leg learning remains in all future strategy gates
        run: |
          python tools/validate-v3-entry-succession-lineage.py
          python -m unittest discover -s tests -p 'test_v3_entry_successor_lineage.py' -v
      - name: Enforce H1–H11 status followthrough, H3 archive and H6 sequencing
        run: |
          python -m unittest discover -s tests -p 'test_v3_h_component_followthrough.py' -v
      - name: Validate autonomous milestone controller
        run: |
          python -m py_compile tools/project_milestone_controller.py
          python -m unittest discover -s tests -p 'test_project_milestone_controller.py'
      - name: Validate unified monitor ownership and anti-conflict contract
        run: |
          python tools/validate-monitoring-evidence-routing.py
          python -m unittest discover -s tests -p 'test_monitoring_evidence_routing.py'
      - name: Validate project-wide outage guards and PowerShell syntax
        run: |
          python tools/validate-outage-resilience.py
          python -m unittest discover -s tests -p 'test_outage_resilience.py'
          pwsh -NoProfile -Command '$tokens=$null; $errs=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/minipc-runtime-supervisor.ps1",[ref]$tokens,[ref]$errs) | Out-Null; if ($errs.Count -gt 0) { $errs | Out-String | Write-Error; exit 1 }; Write-Output "SUPERVISOR_POWERSHELL_PARSE_PASS"'
      - name: Validate bounded autonomous implementation selector
        run: |
          python tools/select-autonomous-implementation.py
          python -m unittest discover -s tests -p 'test_autonomous_implementation.py'
      - name: Validate project-wide followthrough router without extra schedules
        run: |
          python tools/project_followthrough_router.py
          python -m unittest discover -s tests -p 'test_project_followthrough_router.py' -v
      - name: Offline MINI-PC cloud alert watcher classification regression (no network)
        run: |
          python -m py_compile tests/test_minipc_cloud_health_watch_contract.py
          python -m unittest discover -s tests -p 'test_minipc_cloud_health_watch_contract.py' -v
          python -m py_compile tools/minipc_cloud_evidence.py tests/test_minipc_cloud_evidence.py
          python -m unittest discover -s tests -p 'test_minipc_cloud_evidence.py' -v
      - name: Validate workflow registry
        run: python tools/validate-workflow-registry.py
      - name: Validate active H3 shadow candidate
        run: python tools/validate-v3-shadow-candidate.py research/v3/shadow-candidates/v3-h3-shadow-001.json
      - name: Validate integration candidates if present
        shell: bash
        run: |
          shopt -s nullglob
          files=(research/v3/integration-candidates/*.json)
          for file in "${files[@]}"; do
            python tools/validate-v3-integration-candidate.py "$file"
          done
