name: Cleanup stale paper runtime queue

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-runtime-queue-cleanup.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel stale queued runtime runs
        run: |
          python - <<'PY'
          import json, os, urllib.request

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"paper-runtime-queue-cleanup/1.0",
              "Content-Type":"application/json",
          }
          def req(method,path):
              r=urllib.request.Request("https://api.github.com/repos/"+repo+path,method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as resp:
                  raw=resp.read()
                  return json.loads(raw) if raw else None

          data=req("GET","/actions/workflows/paper-evaluator.yml/runs?per_page=20")
          active=[r for r in data.get("workflow_runs",[]) if r.get("status") in ("queued","pending","in_progress")]
          active.sort(key=lambda r:r["created_at"],reverse=True)
          keep=active[:1]
          cancel=active[1:]
          for r in cancel:
              req("POST",f"/actions/runs/{int(r['id'])}/cancel")
          print("PAPER_RUNTIME_QUEUE_CLEANUP",json.dumps({
              "kept":[r["id"] for r in keep],
              "cancelled":[r["id"] for r in cancel],
          },sort_keys=True))
          PY
