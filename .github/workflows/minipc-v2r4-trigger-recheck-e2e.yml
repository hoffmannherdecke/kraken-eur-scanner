name: MINI-PC V2R4 trigger-recheck E2E smoke

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/minipc-v2r4-trigger-recheck-e2e.ps1'
      - '.github/workflows/minipc-v2r4-trigger-recheck-e2e.yml'

permissions:
  contents: read

jobs:
  windows-e2e-shape:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Prepare MINI-PC-like runtime tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          test-path env:OPENAI_API_KEY | Out-Null
          if (-not $env:OPENAI_API_KEY) { throw 'missing OPENAI_API_KEY' }
          $root=Join-Path $env:RUNNER_TEMP 'Trading'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Repos') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Runtime') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'State') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Temp') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Secrets') | Out-Null

          git clone "https://github.com/${{ github.repository }}.git" (Join-Path $root 'Repos\kraken-eur-scanner')
          python -m venv (Join-Path $root 'Runtime\kraken-eur-scanner-venv')

          $hb=@{
            kind='MINIPC_KRAKEN_PUBLIC_CANARY_V1'
            status='HEALTHY'
            checked_at_utc=(Get-Date).ToUniversalTime().ToString('o')
            events_total=100
            book_events=90
            trade_events=10
            gaps=0
            subscription_errors=0
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $root 'State\kraken-canary-heartbeat.json'),
            $hb,
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $root 'Secrets\openai-api-key.txt'),
            $env:OPENAI_API_KEY + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )
          "TRADING_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run exact local trigger-to-recheck E2E gate
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\minipc-v2r4-trigger-recheck-e2e.ps1" -TradingRoot "$env:TRADING_ROOT"
