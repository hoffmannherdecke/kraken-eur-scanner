name: Reconciliation audit verify once

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconciliation-audit-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run read-only reconciliation audit
        run: |
          python tools/paper-runtime-reconciliation-audit.py
