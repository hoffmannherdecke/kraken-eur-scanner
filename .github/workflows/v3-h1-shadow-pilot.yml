name: V3 H1 completed pilot archive

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/v3-h1-shadow-archive.py'
      - 'research/v3/shadow-runtime/h1-control.json'
      - '.github/workflows/v3-h1-shadow-pilot.yml'

permissions:
  contents: read

concurrency:
  group: v3-h1-completed-pilot-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate frozen completed pilot
        run: |
          python -m py_compile tools/v3-h1-shadow-archive.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/v3/shadow-runtime/h1-control.json').read_text())
          s=json.loads(Path('research/v3/shadow-runtime/h1-status.json').read_text())
          assert c['enabled'] is False
          assert s['minimum_gate_met'] is True
          assert s['shadow_records']==200 and s['pass_records']==200
          assert s['automatic_promotion'] is False
          assert s['orders'] is False and s['real_money_actions'] is False
          print('V3_H1_CLOSED_PILOT_GUARD_PASS')
          PY
      - name: Archive immutable pilot evidence
        run: python tools/v3-h1-shadow-archive.py
