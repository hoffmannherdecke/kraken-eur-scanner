name: V3 H3 association precheck guard
on:
  push:
    branches: [main]
    paths:
      - 'tools/v3-h3-prospective-association.py'
      - 'tools/run-minipc-v3-h3-prospective-association.ps1'
      - 'research/v3/h3-prospective-state-association-trial-v2.json'
      - 'research/v3/h3-association-trial-ledger-record-v2.json'
      - '.github/workflows/v3-h3-association-precheck-guard.yml'
  workflow_dispatch:
concurrency:
  group: v3-h3-association-precheck-guard
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/v3-h3-prospective-association.py
      - name: Self-test
        run: python tools/v3-h3-prospective-association.py --self-test
      - name: Ledger compatibility
        run: |
          python - <<'PY'
          import json, pathlib, tempfile, subprocess, sys
          p=pathlib.Path('research/v3/h3-association-trial-ledger-record-v2.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          r['code_fingerprint']='ci-selftest'
          with tempfile.TemporaryDirectory() as td:
              rec=pathlib.Path(td)/'record.json'
              db=pathlib.Path(td)/'ledger.sqlite3'
              rec.write_text(json.dumps(r),encoding='utf-8')
              subprocess.run([sys.executable,'tools/historical-trial-ledger.py','--db',str(db),'append','--record',str(rec)],check=True)
              subprocess.run([sys.executable,'tools/historical-trial-ledger.py','--db',str(db),'verify'],check=True)
          print('V3_H3_LEDGER_COMPAT PASS')
          PY
      - name: Wrapper static guard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/run-minipc-v3-h3-prospective-association.ps1').read_text(encoding='utf-8')
          for needle in ['RUN_V3_H3_ASSOC_002','RUN_V3_H3_SMOKE_002','1800','trial-ledger.sqlite3','holdout_opened','orders','--self-test','v3-h3-assoc-002-session-','research\\v3\\h3-association-reports','raw_session_rows_imported=$false','Unexpected staged paths during H3 evidence import','git push origin main','H3 evaluation remains PASS, but canonical report import is pending']:
              assert needle in s, needle
          print('V3_H3_MINIPC_WRAPPER_STATIC_GUARD PASS')
          PY
      - name: Install pinned websocket client
        run: python -m pip install --disable-pip-version-check --no-input "websockets==15.0.1"
      - name: Real WS fixed-grid sampling smoke
        run: |
          python tools/v3-h3-prospective-association.py --spec research/v3/h3-prospective-state-association-trial-v2.json capture --seconds 30 --session-id CI-H3-ASSOC-002-SMOKE --output /tmp/h3-assoc-002-smoke.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/h3-assoc-002-smoke.json',encoding='utf-8'))
          assert x['status']=='PASS', x
          assert x['trial_id']=='V3-H3-ASSOC-002'
          assert x['wire_messages']>0
          assert x['subscription_acks']>=1
          for sym in ['BTC/EUR','ETH/EUR','SOL/EUR']:
              assert x['counts'][sym]>0, (sym,x['counts'])
          assert x['guardrails']['orders'] is False
          assert x['guardrails']['holdout_opened'] is False
          print('V3_H3_ASSOC_002_REAL_WS_SMOKE PASS',x['counts'])
          PY
      - name: Contract guard
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/v3/h3-prospective-state-association-trial-v2.json',encoding='utf-8'))
          assert s['trial_id']=='V3-H3-ASSOC-002'
          assert s['status']=='FROZEN_PREREGISTERED_CAPTURE_NOT_STARTED'
          assert s['lineage']['replaces_trial_id']=='V3-H3-ASSOC-001'
          assert s['lineage']['prior_trial_rows_written']==0
          assert s['lineage']['research_question_changed'] is False
          assert s['source']['symbols']==['BTC/EUR','ETH/EUR','SOL/EUR']
          assert s['source']['depth']==10
          assert s['sampling']['observation_clock']=='FIXED_5_SECOND_WALL_CLOCK_GRID'
          assert s['sampling']['maximum_state_age_ms']==2000
          assert s['metrics']['p_values'] is False
          assert s['metrics']['threshold_search'] is False
          assert s['metrics']['feature_transform_search'] is False
          assert s['metrics']['horizon_search'] is False
          assert s['metrics']['pair_selection'] is False
          assert s['metrics']['model_training'] is False
          assert 'maker fill probability inference' in s['prohibited']
          assert 'sealed historical holdout access' in s['prohibited']
          print('V3_H3_ASSOC_CONTRACT_GUARD PASS')
          PY
