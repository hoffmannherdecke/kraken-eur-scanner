name: Scanner startup recovery

'on':
  # Event-driven fallback for a scanner run that GitHub itself could not start.
  # This is intentionally separate from the scheduled process-health watchdog so
  # recovery does not depend on another cron tick.
  workflow_run:
    workflows:
      - Kraken EUR early sensor
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: scanner-startup-recovery
  cancel-in-progress: false

jobs:
  recover:
    # One-shot only: retry a scheduled startup_failure. A failed workflow_dispatch
    # retry is NOT auto-retried again, preventing recovery loops.
    if: ${{ github.event.workflow_run.conclusion == 'startup_failure' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Dispatch one immediate scanner retry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          failed_run_id = os.environ["FAILED_RUN_ID"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "scanner-startup-recovery/1.0",
              "Content-Type": "application/json",
          }

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          runs = request("GET", "/actions/workflows/scan.yml/runs?per_page=8").get("workflow_runs", [])
          active = [
              r for r in runs
              if r.get("status") in {"queued", "in_progress"}
              and str(r.get("id")) != failed_run_id
          ]
          if active:
              print("RECOVERY_SKIP active scanner run already exists:",
                    ",".join(str(r.get("id")) for r in active))
              raise SystemExit(0)

          request("POST", "/actions/workflows/scan.yml/dispatches", {"ref": "main"})
          print(f"RECOVERY_DISPATCHED scanner retry after startup_failure run {failed_run_id}")
          PY
