name: V3 H10 H11 public source precheck
on:
  push:
    paths:
      - 'research/source-registry.json'
      - 'research/v3/h10-hyperliquid-readonly-precheck-v1.json'
      - 'research/v3/h11-polymarket-readonly-precheck-v1.json'
      - 'tools/v3-h10-h11-public-source-smoke.py'
      - '.github/workflows/v3-h10-h11-public-source-precheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/v3-h10-h11-public-source-smoke.py
      - name: Public read-only smoke
        run: python tools/v3-h10-h11-public-source-smoke.py
