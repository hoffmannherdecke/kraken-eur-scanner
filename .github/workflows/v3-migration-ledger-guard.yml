# Self-testing canonical V3 migration ledger guard
name: V3 migration ledger guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3-migration-ledger.json'
      - 'tools/validate-v3-migration-ledger.py'
      - 'tools/run-minipc-v3-next-physical-gates.ps1'
      - 'tools/run-minipc-v3-next-physical-gates-sync.ps1'
      - 'docs/v3-research-framework.md'
      - '.github/workflows/v3-migration-ledger-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile validator
        run: python -m py_compile tools/validate-v3-migration-ledger.py
      - name: Validate living migration ledger
        run: python tools/validate-v3-migration-ledger.py
      - name: Fail-closed OPEN_RESEARCH gate smoke
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=json.loads(Path('research/v3-migration-ledger.json').read_text('utf-8'))
          row=next(x for x in src['components'] if x['migration_status']=='OPEN_RESEARCH')
          row['pending_gate']=None
          p=Path(os.environ['RUNNER_TEMP'])/'bad-v3-ledger.json'
          p.write_text(json.dumps(src),encoding='utf-8')
          PY
          if python tools/validate-v3-migration-ledger.py --ledger "$RUNNER_TEMP/bad-v3-ledger.json"; then
            echo 'ERROR: OPEN_RESEARCH without pending gate was accepted'
            exit 1
          else
            echo 'V3_LEDGER_FAIL_CLOSED PASS'
          fi

      - name: Physical gate bundle plan-only smoke
        shell: pwsh
        run: |
          ./tools/run-minipc-v3-next-physical-gates.ps1 | Tee-Object -Variable plan
          $text = $plan -join [Environment]::NewLine
          if ($text -notmatch '"status":\s*"PLAN_ONLY"') {
            throw "V3 physical gate bundle did not remain plan-only"
          }
          if ($text -notmatch '"holdout_opened":\s*false') {
            throw "V3 physical gate bundle violated holdout guard"
          }
          if ($text -notmatch '"orders":\s*false') {
            throw "V3 physical gate bundle violated no-order guard"
          }
          if ($text -notmatch '"real_money_actions":\s*false') {
            throw "V3 physical gate bundle violated real-money guard"
          }

      - name: Safe sync wrapper plan-only smoke
        shell: pwsh
        run: |
          ./tools/run-minipc-v3-next-physical-gates-sync.ps1 | Tee-Object -Variable plan
          $text = $plan -join [Environment]::NewLine
          if ($text -notmatch '"status":\s*"PLAN_ONLY"') { throw "safe-sync wrapper did not remain plan-only" }
          if ($text -notmatch '"destructive_git_operations":\s*false') { throw "safe-sync wrapper permits destructive git" }
          if ($text -notmatch '"force_reset":\s*false') { throw "safe-sync wrapper permits force reset" }
          if ($text -notmatch '"orders":\s*false') { throw "safe-sync wrapper violated no-order guard" }
          if ($text -notmatch '"real_money_actions":\s*false') { throw "safe-sync wrapper violated real-money guard" }

      - name: Static validate physical bundle child paths
        shell: pwsh
        run: |
          $text = Get-Content ./tools/run-minipc-v3-next-physical-gates.ps1 -Raw
          foreach ($needle in @(
            '$feature=Join-Path $repo "tools\run-minipc-v3-feature-integrity-gates.ps1"',
            '$h3=Join-Path $repo "tools\run-minipc-v3-h3-ws-book-smoke.ps1"',
            '$h9=Join-Path $repo "tools\run-minipc-v3-h9-book-trade-clock-smoke.ps1"',
            '$binance=Join-Path $repo "tools\run-minipc-binance-public-access-smoke.ps1"',
            'foreach($p in @($repo,$feature,$h3,$h9,$binance))'
          )) {
            if (-not $text.Contains($needle)) { throw "Physical bundle missing required wiring: $needle" }
          }
          Write-Host "V3_PHYSICAL_BUNDLE_STATIC_WIRING PASS"
