name: Paper series completion watch

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-series-completion-watch.yml'
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read

concurrency:
  group: paper-series-completion-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check evidence-diversity V2R3 completion gate
        env:
          SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_ID: U0C39EDQ1H8
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request

          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=(os.getenv("SUPABASE_SECRET_KEY") or os.getenv("SUPABASE_SERVICE_ROLE_KEY") or "").strip()
          webhook=os.getenv("SLACK_WEBHOOK_URL","").strip()
          uid=os.environ["SLACK_USER_ID"]
          event=os.getenv("EVENT_NAME","")
          dry_run=event!="schedule"

          if not key:
              raise SystemExit("Supabase backend credential missing")

          headers={"apikey":key,"Content-Type":"application/json"}
          if not key.startswith("sb_secret_"):
              headers["Authorization"]="Bearer "+key

          def req(method,path,body=None,extra=None):
              h=dict(headers)
              if extra:
                  h.update(extra)
              data=None if body is None else json.dumps(body,separators=(",",":")).encode()
              r=urllib.request.Request(base+path,data=data,method=method,headers=h)
              with urllib.request.urlopen(r,timeout=20) as resp:
                  raw=resp.read().decode("utf-8","replace")
                  return resp.status,(json.loads(raw) if raw else None)

          _,rows=req("GET","/rest/v1/paper_series_completion_readiness?select=*")
          if not rows:
              raise SystemExit("No active paper-series completion readiness row")

          s=rows[0]
          sid=s["series_id"]
          encoded=urllib.parse.quote(sid,safe="")
          _,watch=req(
              "GET",
              f"/rest/v1/paper_series_completion_watch?series_id=eq.{encoded}&select=*"
          )
          prev=watch[0] if watch else None
          already_notified=bool(prev and prev.get("ready_notified_at"))
          ready=bool(s.get("completion_ready"))

          _,usage_rows=req(
              "GET",
              f"/rest/v1/paper_model_usage_guard?series_id=eq.{encoded}&select=*"
          )
          usage=usage_rows[0] if usage_rows else None
          usage_state=str((usage or {}).get("usage_state") or "UNAVAILABLE").upper()
          prev_snapshot=(prev or {}).get("snapshot") or {}
          previous_usage_state=str(prev_snapshot.get("model_usage_state") or "UNKNOWN").upper()
          usage_anomaly=(usage_state=="ANOMALY")
          should_notify_usage=(usage_anomaly and previous_usage_state!="ANOMALY" and not dry_run)

          snapshot={
              "series_age_days":s.get("series_age_days"),
              "candidate_outcomes":s.get("candidate_outcomes"),
              "completed_trades":s.get("completed_trades"),
              "eligible_24h":s.get("eligible_24h"),
              "complete_24h":s.get("complete_24h"),
              "coverage_24h_pct":s.get("coverage_24h_pct"),
              "outcomes_remaining_to_alt_gate":s.get("outcomes_remaining_to_alt_gate"),
              "hours_remaining_to_age_gate":s.get("hours_remaining_to_age_gate"),
              "hours_remaining_to_temporal_span_gate":s.get("hours_remaining_to_temporal_span_gate"),
              "fasttrack_policy_version":s.get("fasttrack_policy_version"),
              "qualifying_cohort_size":s.get("qualifying_cohort_size"),
              "qualifying_sample_target":s.get("qualifying_sample_target"),
              "qualifying_span_hours":s.get("qualifying_span_hours"),
              "qualifying_active_days":s.get("qualifying_active_days"),
              "qualifying_max_single_day_share_pct":s.get("qualifying_max_single_day_share_pct"),
              "qualifying_max_rolling_24h_share_pct":s.get("qualifying_max_rolling_24h_share_pct"),
              "qualifying_eligible_24h":s.get("qualifying_eligible_24h"),
              "qualifying_complete_24h":s.get("qualifying_complete_24h"),
              "qualifying_coverage_24h_pct":s.get("qualifying_coverage_24h_pct"),
              "temporal_diversity_ready":s.get("temporal_diversity_ready"),
              "qualifying_maturity_ready":s.get("qualifying_maturity_ready"),
              "gate_state":s.get("gate_state"),
              "model_usage_state":usage_state,
              "model_logical_calls":(usage or {}).get("logical_model_calls"),
              "model_estimated_http_attempts":(usage or {}).get("estimated_http_attempts"),
              "model_retry_overhead_requests":(usage or {}).get("retry_overhead_requests"),
              "model_duplicate_response_ids":(usage or {}).get("duplicate_response_ids"),
              "model_max_attempt":(usage or {}).get("max_attempt"),
              "model_cost_precision":(usage or {}).get("cost_precision"),
          }

          now=dt.datetime.now(dt.timezone.utc).isoformat()
          ready_notified_at=(prev or {}).get("ready_notified_at")
          should_notify=(ready and not already_notified and not dry_run)

          if should_notify:
              ready_notified_at=now

          record={
              "series_id":sid,
              "last_gate_state":s["gate_state"],
              "last_checked_at":now,
              "ready_notified_at":ready_notified_at,
              "snapshot":snapshot,
              "updated_at":now,
          }

          print(json.dumps({
              "dry_run":dry_run,
              "completion_ready":ready,
              "already_notified":already_notified,
              "should_notify":should_notify,
              "should_notify_usage":should_notify_usage,
              "previous_usage_state":previous_usage_state,
              "snapshot":snapshot,
          },sort_keys=True))

          if dry_run:
              raise SystemExit(0)

          req(
              "POST",
              "/rest/v1/paper_series_completion_watch?on_conflict=series_id",
              [record],
              {"Prefer":"resolution=merge-duplicates,return=minimal"},
          )

          def slack(text):
              if not webhook:
                  raise SystemExit("Slack webhook missing for required notification")
              r=urllib.request.Request(
                  webhook,
                  data=json.dumps({"text":text}).encode(),
                  method="POST",
                  headers={"Content-Type":"application/json"},
              )
              with urllib.request.urlopen(r,timeout=15) as resp:
                  reply=resp.read().decode("utf-8","replace").strip()
                  print(f"Slack response: {resp.status} {reply}")
                  if not 200<=resp.status<300:
                      raise RuntimeError(f"Slack HTTP {resp.status}")

          if should_notify:
              slack(
                  f"<@{uid}> V2R3-Paper-Abschlussgate ist bereit: "
                  f"State={s['gate_state']}, Trades={s['completed_trades']}, "
                  f"Candidate-Outcomes={s['candidate_outcomes']}, "
                  f"24h-Coverage={s['coverage_24h_pct']}%, "
                  f"Policy={s.get('fasttrack_policy_version')}, "
                  f"Diversity={s.get('temporal_diversity_ready')}, "
                  f"Qualifying-24h={s.get('qualifying_eligible_24h')}/{s.get('qualifying_cohort_size')}. "
                  "Bitte Abschlussauswertung sofort starten; keine automatische Strategie-/Echtgeldaktivierung."
              )

          if should_notify_usage:
              slack(
                  f"<@{uid}> Paper-Modellnutzung meldet ANOMALY für {sid}: "
                  f"Calls={(usage or {}).get('logical_model_calls')}, "
                  f"HTTP-Versuche={(usage or {}).get('estimated_http_attempts')}, "
                  f"Retry-Overhead={(usage or {}).get('retry_overhead_requests')}, "
                  f"Duplicate-Response-IDs={(usage or {}).get('duplicate_response_ids')}, "
                  f"Max-Attempt={(usage or {}).get('max_attempt')}. "
                  "Nur Nutzungs-/Infrastrukturprüfung; keine automatische Strategie- oder Budgetänderung."
              )
          PY
