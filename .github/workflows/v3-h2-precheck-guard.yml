name: V3 H2 derivatives precheck guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h2-derivatives-state-precheck-v1.json'
      - 'research/v3/h2-prospective-derivatives-association-dataset-contract-v1.json'
      - 'research/historical/binance-derivatives-context-preflight-v1.json'
      - 'tools/binance-derivatives-context-smoke.py'
      - 'tools/kraken-futures-h2-coverage-precheck.py'
      - 'tools/v3-h2-kraken-analytics-shape-precheck.py'
      - '.github/workflows/v3-h2-precheck-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile public Kraken Futures precheck
        run: python -m py_compile tools/kraken-futures-h2-coverage-precheck.py

      - name: Validate preregistered H2 precheck guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/v3/h2-derivatives-state-precheck-v1.json').read_text('utf-8'))
          assert j['kind']=='V3_H2_DERIVATIVES_STATE_PRECHECK_V1'
          assert j['status'] in {'PRECHECK','PRECHECK_ASSOCIATION_CAPTURE_PREREGISTERED','PRECHECK_RESPONSE_SHAPE_GREEN_CAPTURE_PARSER_PENDING'}
          assert j['first_research_role']['mode']=='STATE_STRATIFICATION_AND_INCREMENTAL_INFORMATION_ONLY'
          assert j['first_research_role']['direct_buy_sell_rule'] is False
          assert j['selection_bias_guardrails']['threshold_sweep_allowed'] is False
          assert j['selection_bias_guardrails']['pair_subset_selection_by_seen_performance_allowed'] is False
          assert j['selection_bias_guardrails']['current_sealed_holdout_open_allowed'] is False
          assert j['selection_bias_guardrails']['precheck_may_select_winner'] is False
          assert j['runtime_guardrails']['active_v2r3_change_allowed'] is False
          assert j['runtime_guardrails']['v2r4_activation_allowed'] is False
          assert j['runtime_guardrails']['orders_allowed'] is False
          assert j['runtime_guardrails']['leverage_allowed'] is False
          assert j['runtime_guardrails']['real_money_actions_allowed'] is False
          assert j['current_data_readiness']['performance_trial_started'] is False
          assert j['current_data_readiness']['holdout_opened'] is False
          if j['status']=='PRECHECK':
              assert j['next_gate']=='COVERAGE_SEMANTICS_PRECHECK_COMPLETE__NEXT_PREREGISTER_ASSOCIATION_DATASET_WITHOUT_HOLDOUT'
          else:
              assert j['current_data_readiness']['association_dataset_id']=='V3-H2-DERIV-ASSOC-PROSPECTIVE-001'
              assert j['current_data_readiness']['association_capture_started'] is False
              assert j['current_data_readiness']['performance_trial_started'] is False
              assert j['current_data_readiness']['holdout_opened'] is False
          rd=j['current_data_readiness']
          assert rd['kraken_derivatives_coverage_audit']=='CI_GREEN_REAL_PUBLIC_PRECHECK_RUN_2'
          assert rd['kraken_spot_eur_base_count']==501
          assert rd['kraken_spot_eur_bases_with_mapped_perpetual_count']==142
          assert abs(float(rd['kraken_derivatives_coverage_pct_of_spot_eur_bases'])-28.34) < 1e-9
          assert rd['performance_trial_started'] is False
          assert rd['holdout_opened'] is False
          print('V3_H2_PRECHECK PASS no-tuning/no-holdout/no-runtime-change')
          PY

      - name: Public Kraken Futures coverage/semantics precheck
        run: |
          python tools/kraken-futures-h2-coverage-precheck.py \
            --max-symbols 5 \
            --lookback-seconds 3600 \
            --interval 300 \
            --output /tmp/kraken-futures-h2-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/kraken-futures-h2-coverage.json").read_text())
          assert j["status"]=="PASS"
          assert j["spot_online_eur_base_count"] > 0
          assert j["futures_ticker_count"] > 0
          assert j["futures_perpetual_count"] > 0
          assert j["spot_eur_bases_with_mapped_perpetual_count"] > 0
          assert len(j["selected_symbols"]) > 0
          assert j["analytics_probe_ok"] > 0
          assert j["interpretation"]["coverage_only"] is True
          assert j["interpretation"]["performance_conclusion_allowed"] is False
          assert j["interpretation"]["kraken_spot_eur_remains_execution_truth"] is True
          assert j["guardrails"]["api_key_used"] is False
          assert j["guardrails"]["holdout_opened"] is False
          assert j["guardrails"]["performance_selection_performed"] is False
          assert j["guardrails"]["orders"] is False
          assert j["guardrails"]["real_money_actions"] is False
          print("KRAKEN_FUTURES_H2_COVERAGE PASS public/bounded/no-performance")
          print(json.dumps({
            "spot_online_eur_base_count":j["spot_online_eur_base_count"],
            "futures_ticker_count":j["futures_ticker_count"],
            "futures_perpetual_count":j["futures_perpetual_count"],
            "mapped_perpetual_count":j["spot_eur_bases_with_mapped_perpetual_count"],
            "coverage_pct":j["coverage_pct_of_spot_eur_bases"],
            "selected_symbols":j["selected_symbols"],
            "analytics_probe_ok":j["analytics_probe_ok"],
            "analytics_probe_with_data":j["analytics_probe_with_data"],
          },sort_keys=True))
          PY


      - name: Validate H2 prospective association dataset contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/v3/h2-prospective-derivatives-association-dataset-contract-v1.json")
          j=json.loads(p.read_text("utf-8"))
          assert j["kind"]=="V3_H2_PROSPECTIVE_DERIVATIVES_ASSOCIATION_DATASET_CONTRACT_V1"
          assert j["dataset_id"]=="V3-H2-DERIV-ASSOC-PROSPECTIVE-001"
          assert j["status"]=="PREREGISTERED_NOT_CAPTURING"
          assert j["event_clock"]["analytics_to_equals_event_epoch_seconds"] is True
          s=j["primary_source"]
          assert s["analytics_types"]==["open-interest","funding","future-basis"]
          assert s["interval_seconds"]==300
          assert s["lookback_seconds"]==3600
          assert s["missing_mapping_action"]=="DERIVATIVES_STATE_MISSING_KEEP_CANDIDATE_ROW"
          assert s["execution_authority"] is False
          o=j["first_stage_outputs"]
          assert o["coverage_rate"] is True
          assert o["metric_age_distribution"] is True
          assert o["response_shape_audit"] is True
          assert o["future_candidate_outcome_label"] is False
          assert o["trade_return"] is False
          assert o["performance_metric"] is False
          assert o["threshold_or_bin_selection"] is False
          d=j["derivation_policy"]
          assert all(d[k] is False for k in ["funding_delta","funding_persistence","oi_delta","basis_delta","taker_ratio","long_short_ratio"])
          p=j["point_in_time_guardrails"]
          assert p["only_rows_at_or_before_event"] is True
          assert p["explicit_to_parameter_required"] is True
          assert p["future_rows_forbidden"] is True
          assert p["silent_forward_fill_forbidden"] is True
          assert p["missing_state_does_not_drop_candidate"] is True
          g=j["selection_and_holdout_guardrails"]
          assert g["performance_trial_started"] is False
          assert g["threshold_sweep"] is False
          assert g["sealed_2026h1_holdout_opened"] is False
          r=j["runtime_guardrails"]
          assert r["active_v2r3_change_allowed"] is False
          assert r["v2r4_activation_allowed"] is False
          assert r["orders_allowed"] is False
          assert r["real_money_actions_allowed"] is False
          assert r["automatic_capture_schedule_enabled"] is False
          print("V3_H2_ASSOC_CONTRACT PASS prospective/raw-state/no-performance/no-holdout")
          PY


      - name: Live Kraken H2 analytics response-shape audit
        run: |
          python -m py_compile tools/v3-h2-kraken-analytics-shape-precheck.py
          python tools/v3-h2-kraken-analytics-shape-precheck.py \
            --symbol PF_XBTUSD \
            --lookback-seconds 3600 \
            --interval 300 \
            --output /tmp/h2-shape.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h2-shape.json").read_text())
          assert j["status"]=="PASS"
          assert j["symbol"]=="PF_XBTUSD"
          assert [p["metric"] for p in j["probes"]]==["open-interest","funding","future-basis"]
          assert all(p["ok"] for p in j["probes"])
          assert all(p["timestamp_count"]>0 for p in j["probes"])
          assert all(p["last_timestamp_at_or_before_to"] is True for p in j["probes"])
          assert j["interpretation"]["shape_only"] is True
          assert j["interpretation"]["metric_values_evaluated"] is False
          assert j["guardrails"]["performance_trial_started"] is False
          assert j["guardrails"]["holdout_opened"] is False
          assert j["guardrails"]["active_v2r3_changed"] is False
          assert j["guardrails"]["v2r4_changed"] is False
          assert j["guardrails"]["orders"] is False
          assert j["guardrails"]["real_money_actions"] is False
          print("V3_H2_RESPONSE_SHAPE PASS bounded/to-event-compatible/no-performance")
          print("H2_SHAPE_COMPACT "+json.dumps({
            "checked_at_utc":j["checked_at_utc"],
            "symbol":j["symbol"],
            "request_window":j["request_window"],
            "probes":[{
              "metric":p["metric"],
              "timestamp_count":p["timestamp_count"],
              "timestamp_unit":p["timestamp_unit"],
              "last_timestamp_raw":p["last_timestamp_raw"],
              "data_shape":p["data_shape"]
            } for p in j["probes"]]
          },sort_keys=True))
          PY
