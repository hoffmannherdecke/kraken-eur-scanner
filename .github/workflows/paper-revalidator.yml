name: Paper WAIT revalidator diagnostic

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Diagnostic revalidation dry persistence check
        run: |
          set -euo pipefail
          python -m py_compile paper_context.py paper_evaluator/evaluate.py paper_evaluator/revalidate.py
          echo "Standalone revalidator is diagnostic-only. Productive revalidation runs inside paper-evaluator.yml."
