name: Repository runtime compaction

'on':
  push:
    branches: [main]
    paths:
      - 'research/archive/runtime-compaction-20261005.request.json'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete only verified archived runtime files from current tree'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repository-runtime-compaction
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://nlgzjmqgwueojlyqmoru.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Archive closed Paper series and completed H1 pilot first
        run: |
          python -m py_compile tools/archive-closed-paper-series.py tools/v3-h1-shadow-archive.py tools/repository-runtime-compaction.py
          python tools/archive-closed-paper-series.py
          python tools/v3-h1-shadow-archive.py
      - name: Dry-run compaction gate
        run: python tools/repository-runtime-compaction.py
      - name: Apply verified compaction
        if: ${{ github.event_name == 'push' || inputs.apply }}
        run: python tools/repository-runtime-compaction.py --apply
      - name: Persist one bounded compaction commit
        if: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A handoff_queue paper_decisions paper_revalidations paper_followups paper_positions \
            research/v3/shadow-runtime/h1-context research/v3/shadow-runtime/h1-decisions \
            research/archive/runtime-compaction-20261005.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "NO_COMPACTION_CHANGES"
            exit 0
          fi
          git commit -m "[maintenance] compact archived runtime evidence"
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt*2))
          done
          test "$pushed" = "true"
