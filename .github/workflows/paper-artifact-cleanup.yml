name: Cleanup paper artifacts and scanner caches

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-artifact-cleanup.yml'
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: paper-artifact-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Prune expired diagnostics and rolling scanner caches
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor, as_completed

          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]
          headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"paper-storage-cleanup/2.0",
          }
          def request(method,path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None

          def safe_delete(path):
              try:
                  request("DELETE",path); return None
              except urllib.error.HTTPError as exc:
                  if exc.code==404: return None
                  return f"HTTP {exc.code}"
              except Exception as exc:
                  return repr(exc)

          # Diagnostic market tapes have their own 1-day retention. Only remove
          # stale leftovers older than 36h; never delete a fresh manual diagnosis.
          cutoff=datetime.now(timezone.utc)-timedelta(hours=36)
          artifacts=[]; page=1
          while True:
              data=request("GET",f"/actions/artifacts?per_page=100&page={page}")
              rows=data.get("artifacts",[])
              artifacts.extend(rows)
              if len(rows)<100: break
              page+=1
          tape_victims=[]
          for a in artifacts:
              if not a.get("name","").startswith("paper-market-tape-"): continue
              created=datetime.fromisoformat(a["created_at"].replace("Z","+00:00"))
              if created<cutoff:
                  tape_victims.append(a)

          # Scanner caches are immutable by design, so keep a small rollback
          # window instead of accumulating a new ~MB cache every scan.
          caches=[]; page=1
          while True:
              data=request("GET",f"/actions/caches?per_page=100&page={page}")
              rows=data.get("actions_caches",[])
              caches.extend(rows)
              if len(rows)<100: break
              page+=1
          scanner_caches=[x for x in caches if str(x.get("key","")).startswith("scanner-state-")]
          scanner_caches.sort(key=lambda x:x.get("created_at",""),reverse=True)
          cache_victims=scanner_caches[12:]

          errors=[]
          for a in tape_victims:
              err=safe_delete(f"/actions/artifacts/{int(a['id'])}")
              if err: errors.append({"kind":"artifact","id":a["id"],"error":err})
          for x in cache_victims:
              err=safe_delete(f"/actions/caches/{int(x['id'])}")
              if err: errors.append({"kind":"cache","id":x["id"],"error":err})

          print("STORAGE_CLEANUP",json.dumps({
              "fresh_or_non_tape_artifacts_preserved":len(artifacts)-len(tape_victims),
              "stale_tapes_deleted_or_gone":len(tape_victims),
              "scanner_caches_found":len(scanner_caches),
              "scanner_caches_kept":min(12,len(scanner_caches)),
              "scanner_caches_deleted_or_gone":len(cache_victims),
              "errors":errors[:20],
          },sort_keys=True))
          if errors:
              raise SystemExit(f"cleanup errors: {len(errors)}")
          PY
