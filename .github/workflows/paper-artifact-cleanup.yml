name: Cleanup oversized paper capture artifacts

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-artifact-cleanup.yml'
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: paper-artifact-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete legacy multi-GB raw paper tapes
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"paper-artifact-cleanup/1.0",
          }

          def request(method,path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+path,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None

          page=1
          victims=[]
          while True:
              data=request("GET",f"/actions/artifacts?per_page=100&page={page}")
              rows=data.get("artifacts",[])
              for a in rows:
                  if a.get("name","").startswith("paper-market-tape-"):
                      victims.append((int(a["id"]),a["name"],int(a.get("size_in_bytes") or 0)))
              if len(rows)<100:
                  break
              page+=1

          def delete_one(item):
              artifact_id,name,size=item
              try:
                  request("DELETE",f"/actions/artifacts/{artifact_id}")
                  return ("deleted",artifact_id,name,size,None)
              except urllib.error.HTTPError as exc:
                  if exc.code==404:
                      return ("already_gone",artifact_id,name,size,None)
                  return ("error",artifact_id,name,size,f"HTTP {exc.code}")
              except Exception as exc:
                  return ("error",artifact_id,name,size,repr(exc))

          deleted=0
          deleted_bytes=0
          errors=[]
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(delete_one,item) for item in victims]
              for fut in as_completed(futures):
                  status,artifact_id,name,size,error=fut.result()
                  if status in ("deleted","already_gone"):
                      deleted+=1
                      deleted_bytes+=size
                  else:
                      errors.append({"id":artifact_id,"name":name,"error":error})
                  print(status.upper(),artifact_id,name,size,error or "")

          print("PAPER_TAPE_CLEANUP",json.dumps({
              "matched_artifacts":len(victims),
              "deleted_or_already_gone":deleted,
              "deleted_bytes":deleted_bytes,
              "deleted_gib":round(deleted_bytes/(1024**3),3),
              "errors":errors[:20],
              "error_count":len(errors),
          },sort_keys=True))
          if errors:
              raise SystemExit(f"cleanup errors: {len(errors)}")
          PY
