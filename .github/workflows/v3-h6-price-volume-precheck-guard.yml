name: V3 H6 price volume precheck guard

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v3/h6-price-volume-trend-precheck-v1.json'
      - 'research/v3/h6-eur15-development-feature-trial-v1.json'
      - 'research/v3/h6-association-trial-ledger-record-v1.json'
      - 'research/v3/h6-price-volume-association-trial-v1.json'
      - 'tools/v3-h6-eur15-feature-integrity.py'
      - 'tools/v3-h6-association-trial.py'
      - 'tools/run-minipc-v3-h1-h6-association.ps1'
      - 'tools/run-minipc-v3-feature-integrity-gates.ps1'
      - 'research/v3/fixtures/h6-price-volume-synthetic.json'
      - 'tools/v3-h6-price-volume-pit-smoke.py'
      - '.github/workflows/v3-h6-price-volume-precheck-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile H6 smoke
        run: python -m py_compile tools/v3-h6-price-volume-pit-smoke.py

      - name: Validate H6 preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h6-price-volume-trend-precheck-v1.json").read_text("utf-8"))
          assert j["kind"]=="V3_H6_PRICE_VOLUME_TREND_PRECHECK_V1"
          assert j["status"] in {"PRECHECK_PIT_METHOD_GREEN","PRECHECK_REAL_FEATURE_INTEGRITY_GREEN_ASSOCIATION_PREREG_PENDING","ASSOCIATION_TRIAL_PREREGISTERED_NOT_EXECUTED"}
          assert j["complexity_guardrails"]["ctrend_full_implementation_allowed"] is False
          assert j["complexity_guardrails"]["nonlinear_model_allowed_in_precheck"] is False
          assert j["complexity_guardrails"]["parameter_sweep_allowed"] is False
          assert j["future_trial_constraints"]["sealed_2026h1_holdout_open_allowed"] is False
          assert j["runtime_guardrails"]["active_v2r3_change_allowed"] is False
          assert j["runtime_guardrails"]["orders"] is False
          rd=j["methodology_readiness"]
          assert rd["synthetic_price_volume_pit_smoke"]=="CI_GREEN_RUN_1"
          assert rd["future_row_trap"]=="PASS_IGNORED"
          assert rd["missing_prior_volume_window"]=="PASS_RATIO_REMAINS_NULL"
          assert rd["performance_trial_started"] is False
          assert rd["holdout_opened"] is False
          if j["status"]=="PRECHECK_PIT_METHOD_GREEN":
              assert j["next_gate"]=="REAL_EUR15_FEATURE_TRIAL_PREREGISTERED__NEXT_EXECUTE_PHYSICALLY_WITH_HOLDOUT_SEALED"
          elif j["status"]=="PRECHECK_REAL_FEATURE_INTEGRITY_GREEN_ASSOCIATION_PREREG_PENDING":
              assert j["next_gate"]=="PREREGISTER_H6_ASSOCIATION_TRIAL_ON_DEVELOPMENT_ONLY_NO_HOLDOUT_NO_THRESHOLD_SEARCH"
          else:
              assert j["next_gate"]=="IMPLEMENT_VALIDATE_AND_EXECUTE_V3_H6_ASSOC_001_ON_PRE2026_DEVELOPMENT_ONLY"
          if j["status"]=="PRECHECK_PIT_METHOD_GREEN":
              assert j["next_gate"]=="REAL_EUR15_FEATURE_TRIAL_PREREGISTERED__NEXT_EXECUTE_PHYSICALLY_WITH_HOLDOUT_SEALED"
          elif j["status"]=="PRECHECK_REAL_FEATURE_INTEGRITY_GREEN_ASSOCIATION_PREREG_PENDING":
              assert j["next_gate"]=="PREREGISTER_H6_ASSOCIATION_TRIAL_ON_DEVELOPMENT_ONLY_NO_HOLDOUT_NO_THRESHOLD_SEARCH"
          else:
              assert j["next_gate"]=="IMPLEMENT_VALIDATE_AND_EXECUTE_V3_H6_ASSOC_001_ON_PRE2026_DEVELOPMENT_ONLY"
          rd=j["methodology_readiness"]
          assert rd["synthetic_price_volume_pit_smoke"]=="CI_GREEN_RUN_1"
          assert rd["future_row_trap"]=="PASS_IGNORED"
          assert rd["missing_prior_volume_window"]=="PASS_RATIO_REMAINS_NULL"
          assert rd["performance_trial_started"] is False
          assert rd["holdout_opened"] is False
          assert rd["real_eur15_feature_trial_preregistered"]=="V3-H6-EUR15-FEATURE-INTEGRITY-001"
          assert rd["real_eur15_expected_pair_files"]==648
          assert rd["real_eur15_expected_rows"]==20960798
          assert rd["feature_trial_performance_labels_allowed"] is False
          print("V3_H6_PREREG PASS transparent/no-search/no-holdout")
          PY

      - name: Complete price volume PIT smoke
        run: |
          python tools/v3-h6-price-volume-pit-smoke.py \
            research/v3/fixtures/h6-price-volume-synthetic.json \
            --cutoff-epoch 18000 \
            --output /tmp/h6.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h6.json").read_text())
          assert j["status"]=="PASS"
          assert j["future_rows_present"]==1
          assert j["price_returns_pct"]["1h"] > 0
          assert j["price_returns_pct"]["4h"] < 30
          assert j["volume"]["recent_1h_complete"] is True
          assert j["volume"]["prior_1h_complete"] is True
          assert j["volume"]["recent_vs_prior_1h_ratio"] > 1
          assert j["agreement"]["price_up_with_volume_expansion"] is True
          assert all(j["point_in_time_assertions"].values())
          assert j["guardrails"]["performance_trial_started"] is False
          assert j["guardrails"]["nonlinear_model_used"] is False
          assert j["guardrails"]["holdout_opened"] is False
          print("V3_H6_PRICE_VOLUME PASS future-ignored/transparent")
          PY

      - name: Missing prior volume bar must remain missing
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=json.loads(Path("research/v3/fixtures/h6-price-volume-synthetic.json").read_text("utf-8"))
          src["bars"]=[x for x in src["bars"] if x["bar_end_epoch"]!=14400]
          p=Path(os.environ["RUNNER_TEMP"])/"h6-missing.json"
          p.write_text(json.dumps(src),encoding="utf-8")
          PY
          python tools/v3-h6-price-volume-pit-smoke.py "$RUNNER_TEMP/h6-missing.json" \
            --cutoff-epoch 18000 --output /tmp/h6-missing-out.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/h6-missing-out.json").read_text())
          assert j["status"]=="PASS"
          assert j["volume"]["prior_1h_complete"] is False
          assert j["volume"]["prior_1h_mean"] is None
          assert j["volume"]["recent_vs_prior_1h_ratio"] is None
          print("V3_H6_MISSING PASS no-zero-fill/no-short-denominator")
          PY


      - name: Validate real EUR15 H6 feature-only preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("research/v3/h6-eur15-development-feature-trial-v1.json").read_text("utf-8"))
          assert j["kind"]=="V3_H6_EUR15_DEVELOPMENT_FEATURE_TRIAL_V1"
          assert j["status"]=="FROZEN_PREREGISTERED_NOT_EXECUTED"
          assert j["trial_id"]=="V3-H6-EUR15-FEATURE-INTEGRITY-001"
          d=j["dataset"]
          assert d["normalized_schema"]=="KRAKEN_EUR15_NORMALIZED_V1"
          assert d["expected_normalized_pair_files"]==648
          assert d["expected_total_normalized_rows"]==20960798
          assert d["development_window"]["end_utc_exclusive"]=="2026-01-01T00:00:00Z"
          assert d["sealed_holdout"]["status"]=="LOCKED_DO_NOT_READ_IN_H6_FEATURE_TRIAL"
          assert "NO CURRENT_LISTING_STATUS_FILTER" in d["universe_method"]
          p=j["point_in_time_contract"]
          assert all([
              p["cutoff_is_bar_end"],
              p["only_bar_end_at_or_before_cutoff"],
              p["exact_wall_clock_lookbacks"],
              p["future_rows_forbidden"],
              p["live_incomplete_bar_forbidden"],
              p["missing_bars_remain_missing"],
              p["zero_fill_forbidden"],
              p["recent_and_prior_volume_windows_non_overlapping"],
              p["current_live_universe_as_historical_filter_forbidden"],
          ])
          o=j["outputs_allowed"]
          assert o["future_return_labels"] is False
          assert o["trade_returns"] is False
          assert o["edge_metrics"] is False
          assert o["threshold_ranking"] is False
          g=j["search_and_selection_guardrails"]
          assert g["parameter_sweep"] is False
          assert g["threshold_selection"] is False
          assert g["horizon_sweep"] is False
          assert g["performance_trial_started"] is False
          assert g["sealed_holdout_opened"] is False
          r=j["runtime_guardrails"]
          assert r["active_v2r3_change_allowed"] is False
          assert r["v2r4_change_allowed"] is False
          assert r["paper_shadow_runtime_change_allowed"] is False
          assert r["orders"] is False
          assert r["real_money_actions"] is False
          print("V3_H6_REAL_FEATURE_PREREG PASS 648-pair/pre-2026/no-label/no-holdout")
          PY


      - name: H6 real feature runner self-test
        run: |
          python -m py_compile tools/v3-h6-eur15-feature-integrity.py
          python tools/v3-h6-eur15-feature-integrity.py --self-test


      - name: Validate H6 association preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("research/v3/h6-price-volume-association-trial-v1.json").read_text())
          assert s["kind"]=="V3_H6_PRICE_VOLUME_ASSOCIATION_TRIAL_V1"
          assert s["status"]=="FROZEN_PREREGISTERED_NOT_EXECUTED"
          assert s["trial_id"]=="V3-H6-ASSOC-001"
          assert s["fixed_numeric_features"]==["price_return_1h","price_return_4h","volume_ratio_recent_vs_prior_1h"]
          assert s["fixed_boolean_features"]==["price_up_with_volume_expansion","price_down_with_volume_expansion"]
          assert s["topology"]["sealed_holdout"]["status"]=="LOCKED_DO_NOT_READ_OR_LABEL"
          assert s["labels"]["exact_contiguous_future_required"] is True
          assert s["outputs_guard"]["threshold_search"] is False
          assert s["outputs_guard"]["horizon_search"] is False
          assert s["outputs_guard"]["automatic_winner_selection"] is False
          assert s["runtime_guardrails"]["orders"] is False
          assert s["runtime_guardrails"]["real_money_actions"] is False
          r=json.loads(Path("research/v3/h6-association-trial-ledger-record-v1.json").read_text())
          assert r["trial_id"]=="V3-H6-ASSOC-001"
          assert r["dataset_sha256"]=="fc81b54cba6e12af3e9422dde9416179e6ef76af4831d48d839fbdb43018eaa4"
          assert r["purge_seconds"]==14400 and r["embargo_seconds"]==14400
          assert r["influenced_later_design"] is False
          print("V3_H6_ASSOC_PREREG PASS fixed/descriptive/no-holdout/no-selection")
          PY

      - name: H6 association runner self-test
        run: |
          python -m py_compile tools/v3-h6-association-trial.py
          python tools/v3-h6-association-trial.py --self-test
      - name: H1 H6 association physical wrapper remains plan-only
        shell: pwsh
        run: |
          $raw = ./tools/run-minipc-v3-h1-h6-association.ps1 | Out-String
          $j = $raw | ConvertFrom-Json
          if($j.status -ne "PLAN_ONLY"){throw "association wrapper not plan-only"}
          if($j.holdout_opened -ne $false){throw "holdout guard failed"}
          if($j.winner_selection -ne $false){throw "winner-selection guard failed"}
          if($j.orders -ne $false){throw "order guard failed"}
          if($j.real_money_actions -ne $false){throw "real-money guard failed"}

      - name: Association wrapper Windows UTF8-no-BOM guard
        shell: pwsh
        run: |
          $text=Get-Content ./tools/run-minipc-v3-h1-h6-association.ps1 -Raw
          if(-not $text.Contains('New-Object System.Text.UTF8Encoding($false)')){throw "missing UTF8-no-BOM writer"}
          if(-not $text.Contains('[System.IO.File]::WriteAllText')){throw "missing explicit no-BOM write"}
          if($text.Contains('Set-Content -LiteralPath $tmp -Encoding UTF8')){throw "BOM-prone temp ledger write still present"}
          Write-Host "V3_ASSOC_WINDOWS_UTF8_NOBOM PASS"
