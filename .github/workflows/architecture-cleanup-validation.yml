name: Architecture cleanup validation

'on':
  pull_request:
    branches: [main]
    paths:
      - 'market_data/**'
      - 'tools/minipc-kraken-universe-feed.py'
      - 'tools/minipc-status-sync.py'
      - 'tools/v2r4-shadow-cloud-sync.py'
      - 'tools/install-minipc-status-sync.ps1'
      - 'tools/install-minipc-v2r4-shadow-cloud-sync.ps1'
      - 'tools/minipc-secret-hygiene-audit.ps1'
      - 'tools/minipc-relay-credential-cutover.ps1'
      - 'tools/repository-runtime-compaction.py'
      - 'tools/v3-h1-shadow-archive.py'
      - 'research/v3-migration-ledger.json'
      - 'research/v3/shadow-runtime/h1-control.json'
      - 'docs/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - 'tools/minipc-final-security-apps-reboot-audit.ps1'
      - 'tools/minipc-secret-hygiene-audit.ps1'
      - 'tools/minipc-watchdog.ps1'
      - 'tools/minipc-altrady-*.ps1'
      - 'tools/minipc-altrady-*.py'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile changed Python
        run: |
          python -m py_compile \
            market_data/universe.py \
            tools/minipc-kraken-universe-feed.py \
            tools/repository-runtime-compaction.py \
            tools/v3-h1-shadow-archive.py \
            tools/validate-v3-migration-ledger.py \
            tools/validate-artifact-retention.py \
            tools/minipc-status-sync.py \
            tools/v2r4-shadow-cloud-sync.py
      - name: V2R3 freeze guard
        run: python tools/validate-v2r3-clean-series-freeze.py
      - name: Strategy lineage guard
        run: python tools/validate-v3-migration-ledger.py

      - name: Artifact retention guard
        run: python tools/validate-artifact-retention.py
      - name: Shared market data tests
        run: python -m unittest discover -s market_data -p 'test_*.py' -v
      - name: Security and resilience regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflows=list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          assert workflows, 'no workflows found'

          for p in workflows:
              text=p.read_text(encoding='utf-8')
              forbidden_trigger='pull_request_' + 'target:'
              assert forbidden_trigger not in text, f'forbidden privileged PR trigger: {p}'
              if re.search(r'(?m)^\s*pull_request:\s*$', text):
                  secret_expr='$' + '{{' + ' secrets.'
                  assert secret_expr not in text, f'PR workflow may not consume repository secrets: {p}'
                  m=re.search(r'(?ms)^permissions:\s*\n((?:[ \t]+.*\n?)*)', text)
                  perms=(m.group(1) if m else '')
                  assert not re.search(r':\s*write\b', perms), f'PR workflow may not have write permission: {p}'

          relay=Path('.github/workflows/action-push-relay.yml').read_text(encoding='utf-8')
          assert 'issue_comment:' in relay
          assert "author_association == 'OWNER'" in relay
          assert "github.event.issue.number == 1" in relay
          assert "startsWith(github.event.comment.body, 'SLACK_ACTION_V1 | ')" in relay

          config=Path('supabase/config.toml').read_text(encoding='utf-8')
          approved={
              'altrady-trigger-relay': ('ALTRADY_WEBHOOK_TOKEN','sameToken'),
              'v2r4-shadow-evidence-relay': ('internal_relay_credentials','sameFixedHex'),
              'minipc-status-relay': ('internal_relay_credentials','sameFixedHex'),
          }
          for name,markers in approved.items():
              section=config.split(f'[functions.{name}]',1)
              assert len(section)==2, f'missing function config: {name}'
              block=section[1].split('[functions.',1)[0]
              assert 'verify_jwt = false' in block
              src=Path(f'supabase/functions/{name}/index.ts').read_text(encoding='utf-8')
              for expected in markers:
                  assert expected in src, f'{name} missing custom-auth marker {expected}'

          tracked=[p.as_posix().lower() for p in Path('.').rglob('*') if p.is_file() and '.git/' not in p.as_posix()]
          forbidden_suffixes=('.pem','.pfx','.p12','.key')
          for name in tracked:
              assert not (name=='.env' or '/.env' in name or name.endswith(forbidden_suffixes)), f'sensitive file present: {name}'

          final_audit=Path('tools/minipc-final-security-apps-reboot-audit.ps1').read_text(encoding='utf-8')
          assert 'read_only=$true' in final_audit
          assert 'firewall_changes=$false' in final_audit
          assert 'defender_changes=$false' in final_audit
          hygiene=Path('tools/minipc-secret-hygiene-audit.ps1').read_text(encoding='utf-8')
          assert 'READ-ONLY AUDIT' in hygiene and 'NO CREDENTIAL ROTATION' in hygiene

          print('SECURITY_RESILIENCE_BASELINE_PASS')
          PY
      - name: Completed H1 pilot guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/v3/shadow-runtime/h1-control.json').read_text())
          s=json.loads(Path('research/v3/shadow-runtime/h1-status.json').read_text())
          assert c['enabled'] is False
          assert c['closed_reason']=='PREREGISTERED_MINIMUM_GATE_MET_200_OF_200_PASS'
          assert s['shadow_records']==200 and s['pass_records']==200
          assert s['minimum_gate_met'] is True
          assert s['orders'] is False and s['real_money_actions'] is False
          print('H1_CLOSED_PILOT_PASS')
          PY
      - name: JSON and safety contract checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
            'docs/fasttrack-evidence-diversity-policy.json',
            'research/v3-migration-ledger.json',
            'research/v3/shadow-runtime/h1-control.json',
          ]:
            json.loads(Path(p).read_text())
          sql=Path('supabase/evidence-diversity-fasttrack-v2.sql').read_text()
          assert 'security_invoker=true' in sql
          assert 'intake_should_stop' in sql
          assert 'PRIMARY_WAITING_24H_MATURITY' in sql
          e=Path('.github/workflows/paper-evaluator.yml').read_text()
          assert 'PAPER_NEW_INTAKE_FROZEN_BY_COMPLETION_GOVERNANCE' in e
          assert 'paper_series_completion_readiness' in e
          assert '0<=age<=3600' in e and 'sorted(rows)][:8]' in e
          control=json.loads(Path('paper_runtime_control.json').read_text())
          if control.get('git_runtime_compatibility_mode')=='DISABLED_V2R4_LOCAL_SUPABASE_PRIMARY':
              assert control['enabled'] is False
              assert control['real_money_actions_enabled'] is False
              assert control['runtime_owner']=='MINIPC_LOCAL_V2R4_PENDING_ACTIVATION'
              assert control['successor_runtime_storage_policy']=='SUPABASE_PRIMARY_BOUNDED_LOCAL_STATE_NO_PER_EVENT_GIT_COMMITS'
              approval=json.loads(Path('research/v2r4/release-evidence/v2r4-paper-approval-20261007.json').read_text())
              assert approval['decision']=='APPROVED_PAPER'
              assert approval['automatic_activation_allowed'] is False
              assert approval['real_money_actions_allowed'] is False
          else:
              assert control['supabase_archive_mode']=='AUTOMATIC_SECURE_BACKEND_ARCHIVE_PRIMARY_RUNTIME_EVIDENCE'
              assert control['successor_runtime_storage_policy']=='SUPABASE_PRIMARY_GIT_COMPACT_RELEASE_EVIDENCE_ONLY'
          status_sync=Path('tools/minipc-status-sync.py').read_text()
          shadow_sync=Path('tools/v2r4-shadow-cloud-sync.py').read_text()
          assert 'minipc-status-token.txt' in status_sync
          assert 'shadow-evidence-token.txt' in shadow_sync
          assert 'altrady-webhook-token.txt' not in status_sync
          assert 'altrady-webhook-token.txt' not in shadow_sync
          status_install=Path('tools/install-minipc-status-sync.ps1').read_text()
          shadow_install=Path('tools/install-minipc-v2r4-shadow-cloud-sync.ps1').read_text()
          assert 'minipc-status-token.txt' in status_install
          assert 'shadow-evidence-token.txt' in shadow_install
          cutover=Path('tools/minipc-relay-credential-cutover.ps1').read_text()
          assert 'bootstrap_dedicated_credential' not in cutover
          assert 'VERIFY_ONLY_NO_ROTATION' in cutover
          assert 'Credential mutation: NONE' in cutover
          assert 'Real-money/order actions: NONE' in cutover
          for relay in (
            'supabase/functions/minipc-status-relay/index.ts',
            'supabase/functions/v2r4-shadow-evidence-relay/index.ts',
          ):
              text=Path(relay).read_text()
              assert 'bootstrap_dedicated_credential' not in text, relay
              assert 'ALTRADY_WEBHOOK_TOKEN' not in text, relay
              assert 'dedicated_credential_not_ready' in text, relay
              assert 'sameFixedHex' in text, relay
          framework=Path('docs/v3-research-framework.md').read_text()
          allowed={'NEW','PRECHECK','OFFLINE_TEST','SHADOW','KEEP_TESTING','PROMOTE_CANDIDATE','PROMOTED','REJECTED','DEFERRED'}
          import re
          for value in re.findall(r'^Status: `([^`]+)`',framework,re.M):
              assert value in allowed, value
          assert 'EVIDENCE_DIVERSITY_FASTTRACK_V1' not in Path('PROJECT_BACKLOG.md').read_text()
          print('ARCHITECTURE_CONTRACT_PASS')
          PY
