name: V3 H3 shadow preparation guard

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/v3/shadow-candidates/v3-h3-shadow-001.json'
      - 'research/v3/shadow-candidates/v3-h3-shadow-001-config.json'
      - 'research/v3/h3-shadow-001-preparation-20261007.json'
      - 'research/v3/h1-shadow-001-fixed-review-20261007.json'
      - '.github/workflows/v3-h3-shadow-prep-guard.yml'
  push:
    branches: [main]
    paths:
      - 'research/v3/shadow-candidates/v3-h3-shadow-001.json'
      - 'research/v3/shadow-candidates/v3-h3-shadow-001-config.json'
      - 'research/v3/h3-shadow-001-preparation-20261007.json'
      - 'research/v3/h1-shadow-001-fixed-review-20261007.json'
      - '.github/workflows/v3-h3-shadow-prep-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate H3 draft contract and frozen preparation invariants
        run: |
          set -euo pipefail
          python tools/validate-v3-shadow-candidate.py research/v3/shadow-candidates/v3-h3-shadow-001.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          cfg_path=Path('research/v3/shadow-candidates/v3-h3-shadow-001-config.json')
          cand=json.loads(Path('research/v3/shadow-candidates/v3-h3-shadow-001.json').read_text('utf-8'))
          cfg=json.loads(cfg_path.read_text('utf-8'))
          prep=json.loads(Path('research/v3/h3-shadow-001-preparation-20261007.json').read_text('utf-8'))
          h1=json.loads(Path('research/v3/h1-shadow-001-fixed-review-20261007.json').read_text('utf-8'))

          actual=hashlib.sha256(cfg_path.read_bytes()).hexdigest()
          assert actual==cand['frozen_config_sha256'], (actual,cand['frozen_config_sha256'])
          assert cand['status']=='DRAFT'
          assert cand['changed_components']==['STATE_CONDITIONING']
          assert cfg['status']=='DRAFT_PREPARED_NOT_ACTIVE'
          assert cfg['supported_pairs']['candidate_pairs']==['XBT/EUR','ETH/EUR','SOL/EUR']
          assert cfg['supported_pairs']['alias_map']['XBT/EUR']=='BTC/EUR'
          assert list(cfg['fixed_features'])==[
            'spread_bps','bid_depth_quote_top10','ask_depth_quote_top10','depth_imbalance_top10'
          ]
          assert cfg['source_contract']['maximum_state_age_ms']==2000
          assert cfg['shadow_decision_change']['mode']=='CONTEXT_ONLY'
          assert cfg['shadow_decision_change']['directional_sign_assumption'] is False
          assert cfg['shadow_decision_change']['threshold_search'] is False
          assert cfg['shadow_decision_change']['feature_transform_search'] is False
          assert cfg['activation_preconditions']['physical_minipc_point_in_time_context_smoke_pass'] is False
          assert cfg['activation_preconditions']['physical_trigger_to_shadow_evaluation_smoke_pass'] is False
          assert cfg['activation_preconditions']['explicit_shadow_start_decision'] is False
          assert prep['status']=='PREPARED_NOT_ACTIVE'
          assert prep['anti_duplication']['h1_rerun_required'] is False
          assert prep['anti_duplication']['h3_assoc_collection_rerun_required'] is False
          assert h1['fixed_conclusion']['standalone_decision_modifier']=='REJECT'
          assert h1['sequence_disposition']['h3_materialization_allowed'] is True
          assert h1['sequence_disposition']['h3_activation_allowed_now'] is False
          print('V3_H3_SHADOW_PREP_GUARD_PASS')
          PY
