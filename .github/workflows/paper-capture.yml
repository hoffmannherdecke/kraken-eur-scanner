name: Kraken paper market capture

'on':
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'
  pull_request:
    paths:
      - 'paper_capture/**'
      - 'market_data/**'
      - '.github/workflows/paper-capture.yml'
  push:
    branches: [main]
    paths:
      - 'paper_capture/**'
      - 'market_data/**'
      - '.github/workflows/paper-capture.yml'

# Public market data only. No exchange secrets, write permissions or messaging.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'pull_request' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-smoke]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install websockets==15.0.1
      - name: Controlled sequence, shared market data and parity tests
        run: |
          python -m unittest discover -s paper_capture -p 'test_*.py' -v
          python -m unittest discover -s market_data -p 'test_*.py' -v
      - name: Live Kraken EUR book and trade probe
        run: python paper_capture/market.py --seconds 60 --out probe --smoke
      - name: Verify Kraken EUR candle and ticker context
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'paper_capture')
          from market import rest_market_context
          ctx = rest_market_context('RAY/EUR', 'RAYEUR')
          assert ctx['ticker']['last'] > 0
          assert ctx['candles']['1m'] and ctx['candles']['5m'] and ctx['candles']['15m'] and ctx['candles']['60m']
          assert ctx['levels']['support_15m'] is not None and ctx['levels']['resistance_15m'] is not None
          print('REST_CONTEXT_VERIFIED ' + json.dumps({
              'symbol': ctx['symbol'],
              'retrieved_at': ctx['retrieved_at'],
              'ticker': ctx['ticker'],
              'levels': ctx['levels'],
              'volume_acceleration_5m_vs_prior20m': ctx['volume_acceleration_5m_vs_prior20m'],
              'latest_1m': ctx['candles']['1m'][-1],
              'latest_5m': ctx['candles']['5m'][-1],
              'latest_15m': ctx['candles']['15m'][-1],
              'latest_60m': ctx['candles']['60m'][-1],
          }, sort_keys=True))
          PY
      - name: Verify scanner market discovery and live subscriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python paper_capture/market.py --seconds 75 --out discovery-probe
          python - <<'PY'
          import gzip, json
          rows = [json.loads(line) for line in gzip.open('discovery-probe/events.jsonl.gz', 'rt')]
          assert any(r['kind']=='discovery_ok' for r in rows), 'candidate discovery unverified'
          assert not any(r['kind'] in ('discovery_error','subscription_error','trade_sequence_gap') for r in rows), 'hard capture error'
          observed = [r for r in rows if r['kind']=='scanner_market_observed']
          verified = {r['symbol'] for r in rows if r['kind']=='book_verified'}
          assert observed, 'scanner market discovery empty'
          assert all(r['symbol'] in verified for r in observed), 'observed market book missing'

          gaps = [r for r in rows if r['kind']=='data_gap']
          recovered = False
          if gaps:
              last_gap_seq = max(r['seq'] for r in gaps)
              assert any(r['kind']=='market_data_incomplete' and r.get('component')=='websocket'
                         and r['seq'] > last_gap_seq for r in rows), 'gap not quality-labelled'
              assert any(r['kind']=='connection_start' and r['seq'] > last_gap_seq for r in rows), 'gap not reconnected'
              assert any(r['kind']=='book_verified' and r['seq'] > last_gap_seq for r in rows), 'book not restored after gap'
              assert any(r['kind']=='micro_snapshot' and r.get('quality')=='complete'
                         and r['seq'] > last_gap_seq for r in rows), 'no complete post-gap recovery window'
              recovered = True

          print('PAPER_DISCOVERY_VERIFIED', json.dumps({
              'observed':len(observed),'verified_symbols':sorted(verified),
              'gaps':len(gaps),'recovered_after_gap':recovered
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-market-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe/
            discovery-probe/
          retention-days: 90
          if-no-files-found: error

  capture:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      upload_batches: ${{ steps.split.outputs.upload_batches }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    # Deliberately no shared concurrency lock: hourly sessions must overlap.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install websockets==15.0.1
      - name: Create small upload smoke fixture
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p capture
          python - <<'PY'
          import json
          from pathlib import Path
          source = b''.join(f'{index:04d}\n'.encode() for index in range(1340))
          assert len(source) == 6700
          Path('capture/events.jsonl.gz').write_bytes(source)
          Path('capture/manifest.json').write_text(json.dumps({'smoke_fixture': True, 'source_size_bytes': len(source)}) + '\n')
          print(f'PAPER_UPLOAD_SMOKE_FIXTURE bytes={len(source)} expected_parts=67')
          PY
      - name: Continuous public market capture
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python paper_capture/market.py --seconds 4200 --out capture
      - name: Split evidence into bounded downloadable parts
        id: split
        if: always()
        env:
          PAPER_CAPTURE_PART_SIZE_BYTES: ${{ github.event_name == 'pull_request' && '100' || '25165824' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path('capture/events.jsonl.gz')
          manifest = Path('capture/manifest.json')
          if not source.is_file() or not manifest.is_file():
              raise SystemExit('capture evidence missing')

          out = Path('capture-parts')
          out.mkdir(exist_ok=True)
          # Each published part remains below the connector's 32 MiB download ceiling.
          # Smoke runs override this to 100 bytes to exercise many dynamic parts cheaply.
          configured_part_size = int(os.environ.get('PAPER_CAPTURE_PART_SIZE_BYTES', str(24 * 1024 * 1024)))
          if configured_part_size <= 0:
              raise SystemExit('part size must be positive')
          # Keep the default 24 MiB chunks; grow only when needed to fit the
          # Actions v4 ten-artifact-per-job limit, staying below 30 MiB.
          max_parts = 99
          max_part_size = 30 * 1024 * 1024
          part_size = configured_part_size
          if configured_part_size >= 24 * 1024 * 1024:
              part_size = max(configured_part_size, (source.stat().st_size + max_parts - 1) // max_parts)
              if part_size > max_part_size:
                  raise SystemExit(
                      f'capture size {source.stat().st_size} bytes exceeds the dynamic artifact capacity '
                      f'of {max_parts} parts at {max_part_size} bytes each'
                  )
          whole_hash = hashlib.sha256()
          parts = []
          with source.open('rb') as src:
              index = 0
              while True:
                  block = src.read(part_size)
                  if not block:
                      break
                  whole_hash.update(block)
                  name = f'events.jsonl.gz.part{index:03d}'
                  path = out / name
                  path.write_bytes(block)
                  parts.append({
                      'index': index,
                      'name': name,
                      'size_bytes': len(block),
                      'sha256': hashlib.sha256(block).hexdigest(),
                  })
                  index += 1

          shutil.copy2(manifest, out / 'manifest.json')
          parts_manifest = {
              'schema_version': 1,
              'source_name': source.name,
              'source_size_bytes': source.stat().st_size,
              'source_sha256': whole_hash.hexdigest(),
              'part_size_bytes': part_size,
              'parts': parts,
              'reassembly': 'concatenate parts in ascending index order, then verify source_size_bytes and source_sha256',
          }
          (out / 'parts-manifest.json').write_text(
              json.dumps(parts_manifest, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print('PAPER_CAPTURE_PARTS', json.dumps(parts_manifest, sort_keys=True))

          # Artifacts v4 allows at most 10 artifacts per job. Stage chunks in
          # batches so one matrix publisher job can publish at most 10 final
          # artifacts while retaining the historical per-part artifact names.
          staging = out / 'staging'
          staging.mkdir(exist_ok=True)
          batches = []
          cursor = 0
          batch_index = 0
          while cursor < len(parts):
              capacity = 9 if batch_index == 0 else 10
              batch_dir = staging / f'batch-{batch_index:03d}'
              batch_dir.mkdir(parents=True, exist_ok=True)
              if batch_index == 0:
                  shutil.copy2(out / 'manifest.json', batch_dir / 'manifest.json')
                  shutil.copy2(out / 'parts-manifest.json', batch_dir / 'parts-manifest.json')
              for part in parts[cursor:cursor + capacity]:
                  shutil.copy2(out / part['name'], batch_dir / part['name'])
              cursor += capacity
              batches.append(batch_index)
              batch_index += 1

          if len(batches) > 10:
              raise SystemExit(
                  f'capture produced {len(parts)} parts requiring {len(batches)} staging artifacts; '
                  'GitHub permits at most 10 artifacts per job'
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('upload_batches=' + json.dumps(batches, separators=(',', ':')) + '\n')
          print('PAPER_CAPTURE_STAGING', json.dumps({'parts': len(parts), 'batches': batches}))
          PY
      - name: Install pinned artifact client
        if: always() && hashFiles('capture-parts/parts-manifest.json') != ''
        run: npm install --prefix "$RUNNER_TEMP/paper-artifact-sdk" --no-save --no-audit --no-fund @actions/artifact@2.3.2
      - name: Upload bounded staging batches
        if: always() && hashFiles('capture-parts/parts-manifest.json') != ''
        env:
          NODE_PATH: ${{ runner.temp }}/paper-artifact-sdk/node_modules
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node paper_capture/artifact_transfer.cjs stage

  publish_parts:
    needs: capture
    if: needs.capture.outputs.upload_batches != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.capture.outputs.upload_batches) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: paper-market-stage-${{ github.run_id }}-${{ github.run_attempt }}-batch-${{ matrix.batch }}
          path: stage-batch
      - name: Install pinned artifact client
        run: npm install --prefix "$RUNNER_TEMP/paper-artifact-sdk" --no-save --no-audit --no-fund @actions/artifact@2.3.2
      - name: Publish dynamically named manifest and chunk artifacts
        env:
          NODE_PATH: ${{ runner.temp }}/paper-artifact-sdk/node_modules
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          BATCH_INDEX: ${{ matrix.batch }}
        run: node paper_capture/artifact_transfer.cjs publish

  verify_upload:
    needs: [capture, publish_parts]
    if: needs.capture.result == 'success' && needs.publish_parts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-market-tape-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: uploaded-artifacts
          merge-multiple: false
      - name: Verify every uploaded part, its mapping, and reassembled source
        run: python paper_capture/verify_parts.py uploaded-artifacts ${{ github.run_id }} ${{ github.run_attempt }}
